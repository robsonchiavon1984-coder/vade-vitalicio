  // as palavras do acervo que sobram antes e depois do trecho colado são contexto, não divergência
  let i0 = 0, i1 = dif.length - 1;
  while (i0 <= i1 && dif[i0][0] === '+') i0++;
  while (i1 >= i0 && dif[i1][0] === '+') i1--;
  const antes = dif.slice(0, i0).map(x => x[1]), depois = dif.slice(i1 + 1).map(x => x[1]);
  dif = dif.slice(i0, i1 + 1);
  const iguais = dif.filter(x => x[0] === '=').length;
  const pc = dif.length ? Math.round(100 * iguais / dif.length) : 0;
  const html = dif.map(([op, w]) => op === '=' ? esc(w) : `<span class="df ${op === '-' ? 'del' : 'add'}">${esc(w)}</span>`).join(' ');
  openModal({
    title: 'Comparação com ' + d.rot, wide: true,
    body: `<div class="cmp"><div class="cmp-cab"><span class="chip tp">${esc(d.tipo)}</span><b>${esc(d.rot)}</b><span class="mini">${esc(d.sub || '')}</span><span style="flex:1"></span><span class="chip ${pc >= 90 ? 'ok' : pc >= 60 ? 'warn' : 'err'}">${pc}% de coincidência</span></div>
      <div class="cmp-leg"><span><i class="df del">assim</i> só no texto que você colou</span><span><i class="df add">assim</i> só no texto registrado aqui</span><span>sem marca: idêntico</span><span><i class="ctx">assim</i> contexto do acervo, fora do trecho colado</span></div>
      <div class="cmp-txt">${antes.length ? `<span class="ctx">${esc(antes.join(' '))} </span>` : ''}${html}${depois.length ? `<span class="ctx"> ${esc(depois.join(' '))}</span>` : ''}</div>
      ${dif.some(x => x[0] !== '=') ? '<div class="mini" style="margin-top:8px">Diferenças de pontuação e de acentuação não são marcadas — a comparação é feita palavra a palavra, desconsiderando acentos e sinais.</div>' : '<div class="okbox" style="margin-top:8px">Os dois textos coincidem palavra por palavra.</div>'}</div>`,
    buttons: [{ label: 'Fechar' }, { label: 'Abrir a origem', cls: 'pri', onClick: () => gIr(i) }],
  });
}

/* ---------- ligação ---------- */
function initBuscaGlobal() {
  const inp = $('#gsearch'); if (!inp) return;
  const roda = debounce(() => gRender(), 220);
  inp.addEventListener('focus', () => { gIndice(); gRender(); });
  inp.addEventListener('input', roda);

  inp.addEventListener('keydown', e => {

    else if (e.key === 'ArrowUp') { e.preventDefault(); gSelecionar(-1); }

  document.addEventListener('mousedown', e => { if (!e.target.closest('.gsbox')) gFechar(); });
}

<script>
/* =====================================================================
   PARTE 12 — abas de navegação e divisão de tela

  return { view: UI.view, leiId: UI.leiId, artId: UI.artId, cadId: UI.cadId, tab: UI.tab, cadTab: UI.cadTab, leiTab: UI.leiTab, leiSeg: UI.leiSeg, conTab: UI.conTab, cronoId: UI.cronoId, cronoSeg: UI.cronoSeg, notaId: UI.notaId, jurisId: UI.jurisId };
}

    UI.conTab = e.conTab || 'certames'; UI.cronoId = e.cronoId || null; UI.cronoSeg = e.cronoSeg || 'painel';

    <div class="abas-dir">
      <button class="btn sm ghost" id="aba-dup" title="Duplicar a aba atual">⧉</button>
      <button class="btn sm ${S.prefs.split && S.prefs.split.on ? 'pri' : 'ghost'}" id="aba-split" title="Dividir a tela: consulta ao lado (Ctrl+Shift+D)"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>Dividir</button>

      <div class="p2-corpo doc">${pr.titulo ? `<p><b>${esc(pr.titulo)}</b></p>` : ''}${pr.tese ? `<p>${esc(pr.tese)}</p>` : '<div class="empty">Sem tese registrada.</div>'}${pr.fonte ? `<p class="mini">${esc(pr.fonte)}</p>` : ''}${pr.orgao || pr.data ? `<p class="mini">${esc([pr.orgao, pr.data ? fmtBR(pr.data) : ''].filter(Boolean).join(' · '))}</p>` : ''}</div>`;

/* =====================================================================
   Importação e exportação do repertório
   ===================================================================== */
const TIPO_APP = {
  'tema': 'rg', 'tema repetitivo': 'repetitivo', 'repetitivo': 'repetitivo',
  'sumula': 'sumula', 'sumula vinculante': 'sv', 'enunciado (cjf)': 'cjf', 'enunciado cjf': 'cjf', 'enunciado': 'cjf',
  'iac': 'iac', 'irdr': 'irdr', 'puil': 'puil',
  'adi': 'adi', 'adc': 'adi', 'adpf': 'adi', 'ado': 'adi', 'adi por omissao': 'adi',
  'repercussao geral': 'rg', 'informativo': 'informativo', 'outro': 'persuasivo',
};
function tipoDoApp(tipo, tribunal) {
  const t = norm(tipo);
  if (t === 'tema') return norm(tribunal) === 'stj' ? 'repetitivo' : 'rg';
  return TIPO_APP[t] || (tiposJuris().some(x => x.id === t) ? t : 'persuasivo');
}
function ramoDoApp(nome) {
  if (!nome) return null;
  const n = norm(nome);
  let r = S.ramos.find(x => norm(x.nome) === n);
  if (r) return r.id;
  const APROX = [
    [/processual civil|processo civil/, 'pcivil'], [/processual penal|processo penal|execucao penal/, 'ppenal'],
    [/processual do trabalho/, 'trab'], [/do trabalho/, 'trab'],
    [/constitucional/, 'const'], [/administrativo/, 'adm'], [/tributario|financeiro/, 'trib'],
    [/familia|sucessoes/, 'fam'], [/civil/, 'civil'], [/penal/, 'penal'],
    [/previdenciario/, 'prev'], [/consumidor/, 'cons'], [/empresarial|comercial/, 'emp'],
    [/ambiental|agrario/, 'amb'], [/eleitoral/, 'eleit'], [/internacional|humanos/, 'dh'],
    [/infancia|juventude|crianca/, 'eca'], [/registr|notarial/, 'reg'], [/judiciaria|magistratura/, 'mag'],
  ];
  for (const [re, id] of APROX) if (re.test(n) && S.ramos.some(x => x.id === id)) return id;
  /* não existe: cria o ramo com o nome do app, para nada se perder */
  const novo = { id: 'r' + uid(), nome: String(nome), cor: '#64748b' };
  S.ramos.push(novo);
  return novo.id;
}
function precDoApp(r) {
  const tipo = tipoDoApp(r.tipo, r.tribunal);
  return novoPrecedente({
    id: String(r.id || uid()),
    tipo, tribunal: String(r.tribunal || ''), numero: String(r.numero || ''),
    jornada: String(r.jornada || ''), recurso: String(r.recurso || ''), relator: String(r.relator || ''),
    questao: String(r.questao || ''), tese: String(r.tese || ''), transito: String(r.transito || ''),
    data: String(r.transito || ''), info: String(r.info || ''), situacao: String(r.situacao || ''),
    dispositivos: String(r.dispositivos || ''), leis: String(r.leis || ''), institutos: String(r.institutos || ''),
    ramo: ramoDoApp(r.ramo), fonte: String(r.fonte || ''), relevante: !!r.relevante,
    orgao: String(r.tribunal || ''), tipoOriginal: String(r.tipo || ''),
    criadoEm: String(r.createdAt || new Date().toISOString()),
    atualizadoEm: String(r.updatedAt || r.createdAt || new Date().toISOString()),
  });
}
/* reconhece tanto o backup do app de precedentes quanto o backup do próprio Vade Mecum */
function lerBackupPrecedentes(dados) {
  if (Array.isArray(dados)) return { registros: dados, cfg: null, app: 'lista' };
  if (dados && Array.isArray(dados.records)) return { registros: dados.records, cfg: dados.cfg || null, app: dados.app || 'repertorio-precedentes' };
  if (dados && Array.isArray(dados.precedentes)) return { registros: dados.precedentes, cfg: null, app: 'vademecum' };
  throw new Error('não encontrei a lista de precedentes neste arquivo');
}
function importarPrecedentes(dados, modo) {
  const { registros, cfg, app } = lerBackupPrecedentes(dados);
  const doVademecum = app === 'vademecum';
  if (cfg) {
    const c = cat();
    const junta = (lista, vindos) => { (vindos || []).forEach(x => { if (x && !lista.some(y => norm(y) === norm(x))) lista.push(x); }); };
    junta(c.situacoes, cfg.situacoes); junta(c.tribunais, cfg.tribunais); junta(c.jornadas, cfg.jornadas); junta(c.institutos, cfg.institutosCat);
  }
  if (modo === 'replace') { registrarExclusao(precs().map(p => p.id)); S.precedentes = []; }
  const atual = precs();
  const porId = new Map(atual.map(p => [p.id, p]));
  const chave = p => norm([tipoJurisAbrev(p.tipo), p.tribunal, p.numero, (p.jornada || '').slice(0, 30)].join('|'));
  const porChave = new Map(atual.map(p => [chave(p), p]));
  let novos = 0, atualizados = 0, iguais = 0, reunidos = 0;
  for (const bruto of registros) {
    const p = doVademecum ? novoPrecedente(bruto) : precDoApp(bruto);
    const k = String(p.numero).trim() ? chave(p) : null;
    const mesmoId = porId.get(p.id);
    const mesmaChave = k ? porChave.get(k) : null;
    if (!mesmoId && !mesmaChave) { atual.push(p); porId.set(p.id, p); if (k) porChave.set(k, p); novos++; continue; }
    const ex = mesmoId || mesmaChave;
    if (!mesmoId) reunidos++;                                  // ficha repetida: reúne em vez de descartar
    const antes = JSON.stringify([ex.tese, ex.institutos, ex.leis, ex.dispositivos, ex.questao]);
    fundirPrecedente(ex, p);
    if (!mesmoId) { /* já contabilizado como reunido */ }
    else if (JSON.stringify([ex.tese, ex.institutos, ex.leis, ex.dispositivos, ex.questao]) !== antes || String(p.atualizadoEm || '') > String(ex.atualizadoEm || '')) atualizados++;
    else iguais++;
  }
  save();
  return { novos, atualizados, iguais, reunidos, lidos: registros.length, total: atual.length };
}
/* reúne duas fichas do mesmo precedente sem perder nada: o texto mais completo prevalece
   e as listas livres (institutos, leis, dispositivos) são somadas */
function fundirPrecedente(ex, p) {
  const maisNovo = String(p.atualizadoEm || '') > String(ex.atualizadoEm || '');
  const soma = (a, b) => { const vistos = new Set(); const out = []; splitList(a).concat(splitList(b)).forEach(x => { x = x.trim(); const k = norm(x); if (x && !vistos.has(k)) { vistos.add(k); out.push(x); } }); return out.join('; '); };
  /* dispositivos e leis levam vírgula dentro ("art. 85, § 11, do CPC"): só o ponto e vírgula separa */
  const pv = x => String(x == null ? '' : x).split(/[;\n]/).map(y => y.trim()).filter(Boolean);
  const somaPV = (a, b) => { const vistos = new Set(); const out = []; pv(a).concat(pv(b)).forEach(y => { const k = norm(y); if (!vistos.has(k)) { vistos.add(k); out.push(y); } }); return out.join('; '); };
  const melhor = (a, b) => { a = String(a || '').trim(); b = String(b || '').trim(); if (!a) return b; if (!b) return a; return b.length > a.length * 1.15 ? b : (maisNovo && b.length >= a.length ? b : a); };
  ex.institutos = soma(ex.institutos, p.institutos);
  ex.leis = somaPV(ex.leis, p.leis);
  ex.dispositivos = somaPV(ex.dispositivos, p.dispositivos);
  ex.tese = melhor(ex.tese, p.tese);
  ex.questao = melhor(ex.questao, p.questao);
  ex.titulo = melhor(ex.titulo, p.titulo);
  ex.info = melhor(ex.info, p.info);
  for (const k of ['tribunal', 'jornada', 'recurso', 'relator', 'transito', 'situacao', 'fonte', 'url', 'numero'])
    if (!String(ex[k] || '').trim() || (maisNovo && String(p[k] || '').trim())) { if (String(p[k] || '').trim()) ex[k] = p[k]; }
  if (!ex.ramo && p.ramo) ex.ramo = p.ramo;
  if (maisNovo && p.ramo) ex.ramo = p.ramo;
  if (!ex.tipo || (maisNovo && p.tipo)) ex.tipo = p.tipo || ex.tipo;
  ex.relevante = ex.relevante || p.relevante;
  ex.tags = [...new Set((ex.tags || []).concat(p.tags || []))];
  ex.arts = (ex.arts || []).concat((p.arts || []).filter(a => !(ex.arts || []).some(x => x.artId === a.artId)));
  ex.data = ex.transito || ex.data;
  ex.atualizadoEm = maisNovo ? p.atualizadoEm : ex.atualizadoEm;
}
function modalImportarPrecedentes() {

/* a IA responde em JSON; aqui a resposta é limpa e recuperada mesmo com sobras */
function objetosSoltos(s) {
  const objs = []; let prof = 0, ini = -1, emStr = false, escapou = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (emStr) { if (escapou) escapou = false; else if (c === '\\') escapou = true; else if (c === '"') emStr = false; continue; }
    if (c === '"') { emStr = true; continue; }
    if (c === '{') { if (prof === 0) ini = i; prof++; }
    else if (c === '}') { if (prof > 0) { prof--; if (prof === 0 && ini >= 0) { objs.push(s.slice(ini, i + 1)); ini = -1; } } }
  }
  const out = []; for (const o of objs) { try { out.push(JSON.parse(o)); } catch (_) {} }
  return out;
}

  const nucleo = (a >= 0 && b > a) ? s.slice(a, b + 1) : s;
  try { return JSON.parse(nucleo); } catch (e) { const o = objetosSoltos(s); if (o.length) return o[0]; throw new Error('a IA não devolveu um JSON válido'); }

/* ================= pesquisa ================= */
function buscar(q, o) {
  const out = []; const qn = norm(q.trim()); if (!qn && o.modo !== 'estrelas') return out;
  const qnum = normNumero(q.trim());
  for (const lei of S.leis) {
    if (o.ramo && !lei.ramos.includes(o.ramo)) continue; if (o.lei && lei.id !== o.lei) continue;
    for (const a of artigosDe(lei)) {
      if (a.estrelas < (o.estrelas || 0)) continue;
      if (o.modo === 'numero') { if (normNumero(a.numero) === qnum) out.push({ lei, art: a, where: 'artigo', snip: plain(a.texto).slice(0, 220) }); continue; }
      const campos = { texto: ['texto', plain(a.texto)], notas: ['notas', notasTxt(a)], juris: ['jurisprudência', jurisTxt(a)], tags: ['tema', a.tags.join(' · ')] };
      const alvo = o.modo === 'tudo' ? Object.keys(campos) : [o.modo];
      for (const k of alvo) { const [lbl, txt] = campos[k]; if (!txt) continue; const idx = norm(txt).indexOf(qn); if (idx >= 0) { out.push({ lei, art: a, where: lbl, snip: snippet(txt, idx, qn.length) }); break; } }
    }
  }
  return out;
}
function snippet(txt, idx, len) { const a = Math.max(0, idx - 100), b = Math.min(txt.length, idx + len + 140); return (a > 0 ? '…' : '') + esc(txt.slice(a, idx)) + '<mark>' + esc(txt.slice(idx, idx + len)) + '</mark>' + esc(txt.slice(idx + len, b)) + (b < txt.length ? '…' : ''); }
function renderBusca() {
  const V = $('#view-busca'); const b = UI.busca;
  V.innerHTML = `<h2 class="vt">Pesquisa</h2><p class="sub">Por palavra ou expressão, tema/assunto, notas, jurisprudência ou número do artigo — em todas as leis ou filtrando por ramo e lei.</p>
    <div class="bigsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="b-q" value="${esc(b.q)}" placeholder="ex.: capacidade contributiva · nascituro · 1225 · dignidade"></div>
    <div class="filters"><div class="seg" id="b-modo">${[['tudo','Tudo'],['texto','Texto da lei'],['tags','Temas'],['notas','Notas'],['juris','Jurisprudência'],['numero','Nº do artigo']].map(([k, l]) => `<button class="${b.modo === k ? 'on' : ''}" data-m="${k}">${l}</button>`).join('')}</div>
      <select id="b-ramo"><option value="">Todos os ramos</option>${S.ramos.map(r => `<option value="${r.id}" ${b.ramo === r.id ? 'selected' : ''}>${esc(r.nome)}</option>`).join('')}</select>
      <select id="b-lei"><option value="">Todas as leis</option>${S.leis.map(l => `<option value="${l.id}" ${b.lei === l.id ? 'selected' : ''}>${esc(l.sigla)} — ${esc(l.epigrafe)}</option>`).join('')}</select>
      <select id="b-est"><option value="0">Qualquer relevância</option>${[1,2,3,4,5].map(n => `<option value="${n}" ${b.estrelas == n ? 'selected' : ''}>${'★'.repeat(n)} ou mais</option>`).join('')}</select></div>
    <div id="b-res"></div>`;
  const run = () => { b.q = $('#b-q').value; b.ramo = $('#b-ramo').value; b.lei = $('#b-lei').value; b.estrelas = +$('#b-est').value; const res = buscar(b.q, b).concat(buscarCadernos(b.q, b)); const R = $('#b-res');
    if (!b.q.trim()) { R.innerHTML = '<div class="empty">Digite algo para pesquisar. Dica: clique num tema de qualquer artigo para ver todos os artigos com o mesmo assunto.</div>'; return; }
    R.innerHTML = `<div class="mini" style="margin-bottom:10px">${res.length} resultado${res.length === 1 ? '' : 's'}</div><div class="uplist">${res.slice(0, 300).map(r => r.cad ? `<div class="card result" data-cad="${r.cad.id}"><div class="h"><b>${esc(r.cad.titulo)}</b><small>${esc((ramoById(r.cad.ramo) || {}).nome || '')}</small><span class="where">${r.where}</span>${r.cad.estrelas ? `<span style="color:var(--star);font-size:12px">${'★'.repeat(r.cad.estrelas)}</span>` : ''}</div><div class="snip">${r.snip}</div></div>` : `<div class="card result" data-go="${r.lei.id}:${r.art.id}"><div class="h"><b>${esc(r.lei.sigla)}, ${esc(artLabel(r.art))}</b><small>${esc(r.lei.epigrafe)}</small><span class="where">${r.where}</span>${r.art.estrelas ? `<span style="color:var(--star);font-size:12px">${'★'.repeat(r.art.estrelas)}</span>` : ''}${r.art.tags.length ? `<span class="mini">${r.art.tags.map(esc).join(' · ')}</span>` : ''}</div><div class="snip">${r.snip}</div></div>`).join('') || '<div class="empty">Nada encontrado.</div>'}</div>`;
    $$('[data-go]', R).forEach(x => x.onclick = () => { const [l, a] = x.dataset.go.split(':'); openArt(l, a); }); $$('[data-cad]', R).forEach(x => x.onclick = () => openCad(x.dataset.cad)); };
  $('#b-q').oninput = debounce(run, 200); $('#b-q').onkeydown = e => { if (e.key === 'Enter') run(); };
  $$('#b-modo button').forEach(x => x.onclick = () => { b.modo = x.dataset.m; $$('#b-modo button').forEach(y => y.classList.toggle('on', y === x)); run(); });
  ['#b-ramo', '#b-lei', '#b-est'].forEach(s => $(s).onchange = run);
  run(); $('#b-q').focus();
}
/* ================= temas ================= */
/* índice temático: reúne os temas dos artigos e dos cadernos com os institutos
   jurídicos dos precedentes, sob um mesmo verbete */
function indiceTemas() {
  const ix = new Map();
  const chave = t => norm(t).replace(/\s+/g, ' ').trim();
  const put = (t, ramos, onde) => {
    const k = chave(t); if (!k) return;
    const e = ix.get(k) || { rotulo: String(t).trim(), n: 0, art: 0, cad: 0, prec: 0, ramos: new Set(), formas: new Set() };
    e.n++; e[onde]++; e.formas.add(String(t).trim());
    /* fica com a forma escrita mais frequente, para o verbete não oscilar */
    if (String(t).trim().length < e.rotulo.length) e.rotulo = String(t).trim();
    (ramos || []).forEach(r => r && e.ramos.add(r));
    ix.set(k, e);
  };
  for (const l of S.leis) for (const a of artigosDe(l)) for (const t of (a.tags || [])) put(t, l.ramos, 'art');

        <div class="card p"><b>Estudo de hoje</b>${blocos.length ? `<div class="mini" style="margin:4px 0 10px">${feitoHoje} de ${blocos.length} blocos concluídos</div>${blocos.map(b => crBlocoHTML(b.crono, b.disc.id, t, false)).join('')}` : `<div class="empty">Nenhum bloco programado para hoje. ${S.cronos.length ? '' : 'Crie um cronograma em <a data-ir="concursos">Concursos e cronograma</a>.'}</div>`}
          ${evsHoje.length ? `<div class="ev-list" style="margin-top:10px">${evsHoje.map(e => `<div class="ev" style="border-left-color:${e.cor}"><b>${esc(e.titulo)}</b>${e.hora ? `<span class="chip">${esc(e.hora)}</span>` : ''}${e.co ? `<span class="mini">${esc(e.co.nome)}</span>` : ''}</div>`).join('')}</div>` : ''}</div>

          <div class="dash-list">${prazos.length ? prazos.slice(0, 8).map(p => `<a data-dia="${p.data}"><i class="pto" style="background:${CR_TIPO_COR[p.tipo]}"></i><b>${fmtBRc(p.data)}</b><small>${esc(p.titulo)}${p.co ? ' — ' + esc(p.co.nome) : ''}</small><span class="mini">${diasEntre(t, p.data) === 0 ? 'hoje' : 'em ' + plural(diasEntre(t, p.data), 'dia')}</span></a>`).join('') : '<div class="empty">Nenhum prazo nos próximos 60 dias.</div>'}</div></div>
      </div>
    </div>

    ${S.cronos.length ? `<div class="card p" style="margin-top:12px"><div class="rowbar" style="margin:0 0 8px"><b>Cronogramas</b><span style="flex:1"></span><button class="btn sm ghost" data-ir="concursos">abrir</button></div><div class="ledger">${S.cronos.map(c => { const tt = crTotais(c); return `<div class="lrow"><div class="nm"><b>${esc(c.nome)}</b><small>${fmtBR(c.start)} → ${fmtBR(c.end)} · ritmo ${nfBR.format(tt.ritmo)}/dia</small></div><div class="pbar"><i style="width:${tt.pct}%"></i></div><div class="mini pc">${nfBR.format(tt.lido)}/${nfBR.format(tt.total)} · ${tt.pct}%</div><div>${tt.atraso ? `<span class="chip err">atraso ${nfBR.format(tt.atraso)}</span>` : '<span class="chip ok">em dia</span>'}</div></div>`; }).join('')}</div></div>` : ''}

    <div class="dashrow"><div class="card p"><b>Continuar leitura</b><div class="dash-list" style="margin-top:6px">${ult ? `<a id="d-cont"><b>${esc(ult.lei.sigla)}, ${esc(artLabel(ult.art))}</b><small>${esc(plain(ult.art.texto).slice(0, 80))}</small></a>` : '<div class="empty">Nenhuma leitura recente.</div>'}</div>
      <div style="margin-top:12px"><b>Atalhos</b><div class="kbdlist" style="margin-top:6px"><kbd>Ctrl K</kbd><span>pesquisar</span><kbd>Alt ←/→</kbd><span>artigo anterior / próximo</span><kbd>Ctrl S</kbd><span>salvar redação</span><kbd>Ctrl B/I/U</kbd><span>negrito / itálico / sublinhado</span><kbd>Esc</kbd><span>fechar janela</span></div></div></div>
      <div class="card p"><b>Editados recentemente</b><div class="dash-list" style="margin-top:6px">${recentes.slice(0, 8).map(r => r.cad
      ? `<a data-cad="${r.cad.id}"><b>${esc(r.cad.titulo)}</b><small>${esc(plain(r.cad.conteudo).slice(0, 60))}</small><span class="mini">${fmtDate(r.cad.atualizadoEm)}</span></a>`
      : `<a data-go="${r.lei.id}:${r.art.id}"><b>${esc(r.lei.sigla)}, ${esc(artLabel(r.art))}</b><small>${esc(plain(r.art.texto).slice(0, 70))}</small><span class="mini">${fmtDate(r.art.atualizadoEm)}</span></a>`).join('') || '<div class="empty">Nada ainda.</div>'}</div></div></div>
    <div class="dashrow"><div class="card p"><b>Por ramo</b><div class="dash-list" style="margin-top:6px">${S.ramos.map(r => { const ls = leisDoRamo(r.id); const na = ls.reduce((s, l) => s + artigosDe(l).length, 0); return `<a data-ramo="${r.id}"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${r.cor};display:inline-block"></span><b>${esc(r.nome)}</b><small>${ls.length} leis · ${na} artigos</small></a>`; }).join('')}</div></div>
      <div class="card p"><b>Como usar</b><div style="font-size:13px;line-height:1.6;color:var(--txt2);margin-top:6px">O catálogo já traz as principais leis de concurso, ainda sem texto. Abra a lei, clique em "Importar texto", cole o conteúdo copiado do Planalto e o programa separa capítulos e artigos. Depois: marque estrelas, adicione temas, escreva notas e jurisprudência, destaque trechos e crie correlações entre artigos de leis diferentes. ${nL} correlações e ${nT} temas cadastrados até agora.</div></div></div>`;
  bindPrimeiroUso(V);
  if ($('#d-cont')) $('#d-cont').onclick = () => openArt(ult.lei.id, ult.art.id);
  $$('[data-go]', V).forEach(x => x.onclick = () => { const [l, a] = x.dataset.go.split(':'); openArt(l, a); });
  $$('[data-cad]', V).forEach(x => x.onclick = () => openCad(x.dataset.cad));
  $$('[data-ramo]', V).forEach(x => x.onclick = () => { S.prefs.ramoAtivo = x.dataset.ramo; save(); renderRamos(); renderTree(); showView('leitura'); });
  $$('[data-ir]', V).forEach(x => x.onclick = () => showView(x.dataset.ir));
  $$('[data-dia]', V).forEach(x => x.onclick = () => modalDia(x.dataset.dia));
  crBindBlocos(V, () => renderDashboard());
  const cx = $('#d-calbox', V);
  if (cx) crBindCalendario(cx, { get y() { return UI.calY; }, set y(v) { UI.calY = v; }, get m() { return UI.calM; }, set m(v) { UI.calM = v; } }, () => renderDashboard());
}
/* ================= ajustes e backup ================= */
function exportBackup() {
  const blob = new Blob([JSON.stringify(sanitizeState(S), null, 1)], { type: 'application/json' }); const nome = `vademecum-backup-${today()}.json`;
  const fim = () => { S.meta.ultimoBackup = new Date().toISOString(); save(); toast('Backup exportado', 'ok'); };
  if (isMobile() && navigator.share) { compartilharBackup(blob, nome).then(ok => { if (ok) fim(); else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click(); fim(); } }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); fim();
}
function importBackup(file, modo) {
  const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.leis || !d.ramos) throw new Error('formato inválido');
    const chaves = S.ia ? S.ia.chaves : null;
    const driveLocal = S.drive ? JSON.parse(JSON.stringify(S.drive)) : null;   // credenciais são deste aparelho, não do backup
    if (modo === 'replace') { S = migrate(d); if (chaves) S.ia.chaves = chaves; if (driveLocal) S.drive = driveLocal; }
    else { mesclarDentro(S, migrate(d)); if (driveLocal) S.drive = driveLocal; }
    S.prefs = S.prefs || seedState().prefs; S.meta = S.meta || {}; S.meta.primeiroUso = false; saveNow(); applyPrefs(); applyLayout(); renderRamos(); renderTree(); showView('dashboard'); toast('Backup importado', 'ok');
  } catch (e) { toast('Falha ao importar: ' + e.message, 'err'); } }; rd.readAsText(file);
}
async function vincularArquivo() {
  if (!window.showSaveFilePicker) { toast('Este navegador não permite vincular arquivo (use Chrome/Edge). Use o backup .json.', 'err'); return; }
  try { const h = await window.showSaveFilePicker({ suggestedName: 'vademecum-dados.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] }); fileHandle = h; if (!useLS) await DB.set('fileHandle', h); await saveNow(); S.meta.ultimoBackup = new Date().toISOString(); save(); renderConfig(); toast('Arquivo vinculado: cada alteração será gravada nele', 'ok'); } catch (e) { if (e.name !== 'AbortError') toast('Não foi possível vincular: ' + e.message, 'err'); }
}
async function reautorizarArquivo() { if (!fileHandle) return; try { const p = await fileHandle.requestPermission({ mode: 'readwrite' }); if (p === 'granted') { await saveNow(); toast('Gravação automática reativada', 'ok'); renderConfig(); } } catch (e) { toast(String(e), 'err'); } }
function renderConfig() {
  const V = $('#view-config'); const p = S.prefs; let nA = 0; S.leis.forEach(l => nA += artigosDe(l).length);
  V.innerHTML = `<h2 class="vt">Ajustes e backup</h2><p class="sub">Aparência, dados e segurança do acervo.</p>
    <div class="grid2">
    <div class="card p"><b>Leitura</b><div class="form" style="margin-top:10px"><label>Tema<div class="seg"><button data-tema="claro" class="${p.tema === 'claro' ? 'on' : ''}">Claro</button><button data-tema="escuro" class="${p.tema === 'escuro' ? 'on' : ''}">Escuro</button></div></label><label>Fonte do texto legal<div class="seg"><button data-fonte="serif" class="${p.fonte === 'serif' ? 'on' : ''}">Serifada</button><button data-fonte="sans" class="${p.fonte === 'sans' ? 'on' : ''}">Sem serifa</button></div></label><label>Tamanho da fonte: <span id="fs-lbl">${p.fs}px</span><input type="range" min="14" max="26" value="${p.fs}" id="fs-range"></label><label>Leiaute<div class="seg">${[['auto', 'Automático'], ['desktop', 'Computador'], ['mobile', 'Celular']].map(([k, l]) => `<button data-layout="${k}" class="${(p.layout || 'auto') === k ? 'on' : ''}">${l}</button>`).join('')}</div></label></div></div>
    <div class="card p"><b>Backup e arquivo de dados</b><div class="mini" style="margin:4px 0 10px;line-height:1.5">Os dados ficam gravados neste navegador (${useLS ? 'localStorage' : 'IndexedDB'}). Para não perder nada, exporte o .json periodicamente e guarde-o em nuvem; ou vincule um arquivo para gravação automática a cada alteração (Chrome/Edge).<br>Última gravação: <b>${typeof fmtDataHora === 'function' ? fmtDataHora(S.meta.salvoEm) : '—'}</b>.${S.meta.ultimoBackup ? `<br>Último backup .json: ${typeof fmtDataHora === 'function' ? fmtDataHora(S.meta.ultimoBackup) : fmtDate(S.meta.ultimoBackup)}.` : ''}${fileHandle ? `<br>Arquivo vinculado: <b>${esc(fileHandle.name)}</b> <button class="btn sm" id="cf-reaut">Reautorizar gravação</button>` : ''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cf-exp">${I.imp} Exportar backup (.json)</button><button class="btn" id="cf-imp-merge">Carregar backup e mesclar</button><button class="btn" id="cf-imp-rep">Carregar backup substituindo tudo</button><button class="btn" id="cf-link">${I.link} Vincular arquivo .json</button></div></div>
    <div class="card p"><b>Acervo</b><div class="mini" style="margin:4px 0 10px">${S.leis.length} leis · ${nA} artigos · ${S.ramos.length} ramos</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cf-ramos">Gerenciar ramos</button><button class="btn" id="cf-catalogo">Repor leis do catálogo inicial que foram excluídas</button><button class="btn" id="cf-tree">${p.tree ? 'Ocultar' : 'Mostrar'} lista lateral</button></div></div>
    <div class="card p"><b style="color:var(--err)">Zona de perigo</b><div class="mini" style="margin:4px 0 10px">Apaga tudo e recomeça com o catálogo inicial.</div><button class="btn danger" id="cf-reset">Apagar todos os dados</button></div></div>
    ${renderConfigIA()}
    ${guiaInstalacao()}
    <div class="card p" style="margin-top:12px"><b>Sobre</b><div class="mini" style="line-height:1.6;margin-top:4px">Vade Mecum Vitalício — arquivo único (HTML + JS), sem servidor e sem dependências externas; funciona offline. Os textos de amostra (CF, CTN, CC e CPC, poucos artigos) foram digitados sem consulta ao Planalto e devem ser conferidos e substituídos pela íntegra oficial via "Importar texto". Os links do Planalto cadastrados no catálogo podem mudar; edite-os na lei se necessário.</div></div>`;
  bindConfigIA(V);
  $$('[data-layout]', V).forEach(b => b.onclick = () => { p.layout = b.dataset.layout; save(); applyLayout(); renderConfig(); });
  $$('[data-tema]', V).forEach(b => b.onclick = () => { p.tema = b.dataset.tema; save(); applyPrefs(); renderConfig(); });
  $$('[data-fonte]', V).forEach(b => b.onclick = () => { p.fonte = b.dataset.fonte; save(); applyPrefs(); renderConfig(); });
  $('#fs-range').oninput = e => { p.fs = +e.target.value; $('#fs-lbl').textContent = p.fs + 'px'; applyPrefs(); save(); };
  if (!$('#cfg-drive', V)) { const dv = document.createElement('div'); dv.id = 'cfg-drive'; V.appendChild(dv); }
  if (typeof renderCardDrive === 'function') renderCardDrive();
  $('#cf-exp').onclick = exportBackup; $('#cf-link').onclick = vincularArquivo; if ($('#cf-reaut')) $('#cf-reaut').onclick = reautorizarArquivo;
  $('#cf-imp-merge').onclick = () => { $('#file-import').dataset.modo = 'merge'; $('#file-import').click(); };
  $('#cf-imp-rep').onclick = () => confirmar('Substituir tudo', 'Todos os dados atuais serão substituídos pelo conteúdo do arquivo importado.', () => { $('#file-import').dataset.modo = 'replace'; $('#file-import').click(); });
  $('#cf-ramos').onclick = modalRamos; $('#cf-tree').onclick = () => { p.tree = !p.tree; save(); applyPrefs(); renderConfig(); };
  $('#cf-catalogo').onclick = () => { let n = 0; for (const [sigla, nome, epigrafe, rs, url] of LEIS_SEED) if (!S.leis.some(l => l.sigla === sigla)) { S.leis.push({ id: uid(), sigla, nome, epigrafe, ementa: '', ramos: rs, url, itens: [], criadoEm: new Date().toISOString(), amostra: false }); n++; } save(); renderRamos(); renderTree(); toast(`${n} leis repostas`, 'ok'); renderConfig(); };
  $('#cf-reset').onclick = () => confirmar('Apagar todos os dados', 'Tem certeza? Todas as leis, artigos, notas e destaques serão apagados. Exporte um backup antes.', () => { S = seedState(); UI.leiId = null; UI.artId = null; saveNow(); applyPrefs(); renderRamos(); renderTree(); showView('dashboard'); });
}
/* ================= prefs / init ================= */
function applyPrefs() {
  const p = S.prefs; document.documentElement.dataset.theme = p.tema; document.documentElement.dataset.fonte = p.fonte; document.documentElement.style.setProperty('--fs', p.fs + 'px');
  $('#app').classList.toggle('rail-collapsed', !!p.rail); $('#app').classList.toggle('no-tree', !((UI.view === 'leitura' || UI.view === 'cadernos') && p.tree)); $('#btn-fonte').textContent = p.fonte === 'serif' ? 'Serif' : 'Sans';
}
function irPara(q) { // "CC 1225", "CPC art. 3", "1225"
  const m = q.trim().match(/^([A-Za-zÀ-ú0-9.]+)?\s*(?:art\.?\s*)?(\d+\s*[ºo°]?\s*(?:-\s*[A-Za-z]{1,2})?)\s*$/i); if (!m) return false;
  const sig = m[1] ? norm(m[1]) : null; const num = normNumero(m[2]);
  const lei = sig ? S.leis.find(l => norm(l.sigla) === sig) : (UI.leiId ? leiById(UI.leiId) : null); if (!lei) return false;
  const a = artigosDe(lei).find(x => normNumero(x.numero) === num); if (!a) { toast(`${lei.sigla}: art. ${num} não encontrado`, 'err'); return true; }
  openArt(lei.id, a.id); return true;
}
async function init() {
  if (window.__vmOauthOnly) return;
  S = await loadState();
  if (fileHandle) { try { const p = await fileHandle.queryPermission({ mode: 'readwrite' }); if (p !== 'granted') setTimeout(() => toast('Arquivo vinculado: vá em Ajustes e clique em "Reautorizar gravação"'), 1200); } catch (_) {} }
  /* o usuário precisa saber quando a rede de segurança entrou em ação, e quando ela não coube */
  if (emergenciaAplicada) setTimeout(() => toast('O programa foi fechado antes de terminar a gravação: o que estava em edição foi recuperado', 'ok'), 900);
  if (falhaMigracao) setTimeout(() => toast('Há dados gravados que não puderam ser abertos. Para não destruí-los, a gravação está suspensa — exporte um backup antes de continuar.', 'err'), 1200);
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) {}
  applyPrefs(); renderRamos();
  if (S.prefs.ultimo && findArt(S.prefs.ultimo.leiId, S.prefs.ultimo.artId)) { UI.leiId = S.prefs.ultimo.leiId; UI.artId = S.prefs.ultimo.artId; UI.openLeis.add(UI.leiId); }
  else if (S.prefs.ultimo && leiById(S.prefs.ultimo.leiId)) { UI.leiId = S.prefs.ultimo.leiId; UI.artId = null; UI.openLeis.add(UI.leiId); }
  renderTree(); showView(UI.leiId ? 'leitura' : 'dashboard');
  $$('#nav .navbtn').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('#btn-organizar').onclick = () => { if (UI.view === 'cadernos') { toast('A ordem dos cadernos segue as pastas', ''); return; } UI.reordenar = !UI.reordenar; if (UI.reordenar) UI.openLeis.clear(); $('#btn-organizar').classList.toggle('on', UI.reordenar); renderTree(); if (UI.reordenar) toast('Arraste as leis para reordenar; clique de novo no botão para sair', 'ok'); };
  $('#btn-organizar').oncontextmenu = e => { e.preventDefault(); modalOrganizarLeis(); };
  $('#btn-ordem').onclick = () => modalOrganizarLeis();
  $('#btn-ramos').onclick = modalRamos; $('#btn-nova-lei').onclick = () => UI.view === 'cadernos' ? modalCaderno({ tipo: 'caderno' }) : modalLei(); $('#btn-nova-pasta').onclick = () => modalCaderno({ tipo: 'pasta' });
  $('#file-cad').onchange = e => { const f = e.target.files[0]; const c = cadById(e.target.dataset.cad); if (f && c) importarArquivoCaderno(f, c); e.target.value = ''; };
  if (S.prefs.ultimoCad && cadById(S.prefs.ultimoCad)) UI.cadId = S.prefs.ultimoCad;
  $('#btn-rail').onclick = () => { S.prefs.rail = !S.prefs.rail; save(); applyPrefs(); };
  $('#btn-theme').onclick = () => { S.prefs.tema = S.prefs.tema === 'claro' ? 'escuro' : 'claro'; save(); applyPrefs(); };
  $('#btn-tree').onclick = () => { if (isMobile()) { if (UI.view !== 'leitura' && UI.view !== 'cadernos') showView('leitura'); $('#tree').classList.contains('show') ? closeDrawer() : openDrawer(); return; } S.prefs.tree = !S.prefs.tree; save(); if (UI.view !== 'leitura' && UI.view !== 'cadernos') showView('leitura'); applyPrefs(); };
  $('#btn-font-minus').onclick = () => { S.prefs.fs = Math.max(14, S.prefs.fs - 1); save(); applyPrefs(); };
  $('#btn-font-plus').onclick = () => { S.prefs.fs = Math.min(26, S.prefs.fs + 1); save(); applyPrefs(); };
  $('#btn-fonte').onclick = () => { S.prefs.fonte = S.prefs.fonte === 'serif' ? 'sans' : 'serif'; save(); applyPrefs(); };
  $('#btn-backup-quick').onclick = exportBackup;
  $('#modal-x').onclick = closeModal; $('#overlay').addEventListener('mousedown', e => { if (e.target === $('#overlay')) closeModal(); });
  $('#file-crono').onchange = e => { const f = e.target.files[0]; if (f) importarCronoAntigo(f); e.target.value = ''; };
  $('#file-import').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f, e.target.dataset.modo || 'merge'); e.target.value = ''; };
  const tf = $('#tree-filter'); tf.oninput = debounce(() => { UI.treeFilter = tf.value; renderTree(); }, 150); tf.onkeydown = e => { if (e.key === 'Enter' && UI.view === 'leitura') { if (irPara(tf.value)) { tf.value = ''; UI.treeFilter = ''; renderTree(); } } };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); $('#tree').classList.remove('show'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const g = $('#gsearch'); if (g && g.offsetParent) { g.focus(); g.select(); } else showView('busca'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (UI.view === 'leitura' && UI.dirty) salvarTexto(); else toast('Tudo salvo'); return; }
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && UI.view === 'leitura' && UI.artId) { e.preventDefault(); const v = vizinho(e.key === 'ArrowLeft' ? -1 : 1); if (v) openArt(UI.leiId, v.id); }
  });
  document.addEventListener('click', e => { const a = e.target.closest('a[data-ref]'); if (a && !a.closest('.edit')) { e.preventDefault(); const [l, ar] = a.dataset.ref.split(':'); openArt(l, ar); } });
  window.addEventListener('beforeunload', () => { if (UI.dirty) salvarTexto(true); if (typeof window._docFlush === 'function') window._docFlush(); salvarEmergencia(); try { saveNow(); } catch (_) {} });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (UI.dirty) salvarTexto(true); if (typeof window._docFlush === 'function') window._docFlush(); salvarEmergencia(); saveNow(); } });
  initBuscaGlobal();
  initAbas();
  initDrive();
  initMobile();
}
init().catch(e => { console.error(e); document.body.innerHTML = '<pre style="padding:20px">Erro ao iniciar: ' + esc(e.stack || e) + '</pre>'; });
</script>
