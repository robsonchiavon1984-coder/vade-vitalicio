@media (max-width:1100px){.app,.app.rail-collapsed{grid-template-columns:66px 290px 1fr}.rail .brand span,.rail .navbtn span,.rail .sec,.rail .ramos,.navbtn .kbd,.foot .lbl{display:none}.navbtn{justify-content:center}}
/* ---------- modo móvel (html.m) ---------- */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--gb);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--txt2);padding:5px 0 3px;border-radius:12px;position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--pri-txt);background:var(--pri-soft)}
.tabbar .badge{position:absolute;top:2px;right:18%;background:var(--err);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:0 5px}
.tree-bd{display:none;position:fixed;inset:0;background:rgba(5,8,20,.35);z-index:55;backdrop-filter:blur(2px)}
.tree-bd.show{display:block}
.tree-ramo{display:none;width:100%;margin-top:8px;border:1px solid var(--gb2);border-radius:10px;padding:8px 10px;background:var(--glass3);outline:none}
html.m .app,html.m .app.rail-collapsed,html.m .app.no-tree{display:block;padding:0;gap:0;height:100dvh}
html.m .rail{display:none}
html.m .main{position:fixed;inset:0;border-radius:0;border:0;box-shadow:none;padding-bottom:calc(60px + env(safe-area-inset-bottom));background:var(--glass2)}
html.m .tree,html.m .app.no-tree .tree{display:flex!important;position:fixed;top:0;left:0;bottom:0;width:min(88vw,380px);z-index:60;transform:translateX(-105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);border-radius:0 20px 20px 0;padding-top:env(safe-area-inset-top);background:var(--glass3)}
html.m .tree.show{transform:none}
html.m .tree .list{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
html.m .tree-ramo{display:block}
html.m .tabbar{display:flex}
html.m .topbar{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
html.m .topbar h1{font-size:15px}
html.m #btn-fonte,html.m #btn-backup-quick span{display:none}
html.m .reader{padding:14px 14px 40px}
html.m .view{padding:14px 14px 40px}
html.m .view h2.vt{font-size:21px}
html.m .grid4{grid-template-columns:1fr 1fr}
html.m .grid2,html.m .grid3{grid-template-columns:1fr}
html.m .dashrow{flex-direction:column}
html.m .rhead{flex-wrap:wrap}
html.m .rhead h2{font-size:19px}
html.m .rhead .acts{flex-basis:100%;justify-content:flex-end}
html.m .edit{padding:10px 2px 16px}
html.m .toolbar{gap:1px;padding:4px}
html.m .tb{width:34px;height:34px}
html.m .tbtxt{padding:0 8px}
html.m .artnav .btn{max-width:44%;font-size:12px}
html.m .form .row{flex-direction:column}
html.m .modal{width:100%;max-height:94vh;border-radius:20px 20px 0 0;animation:slideup .2s cubic-bezier(.2,.8,.2,1)}
html.m .overlay{padding:0;align-items:flex-end}
html.m .modal .mb{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
html.m .tabs{padding:3px}
html.m .tab{padding:7px 10px;font-size:13px}
html.m .msg{max-width:96%}
html.m .stat b{font-size:24px}
html.m .flash{padding:22px 16px}
html.m .bigsearch input{font-size:15px;padding:12px 12px 12px 42px}
html.m .filters select{max-width:100%}
html.m .toast{bottom:calc(72px + env(safe-area-inset-bottom));width:calc(100% - 32px);text-align:center}
html.m .ia-in{border-radius:14px}
html.m .sheet{display:flex;flex-direction:column;gap:4px}
.sheet button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px;color:var(--txt);width:100%;text-align:left}
.sheet button:hover,.sheet button:active{background:var(--glass2)}
.sheet button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet button .badge{margin-left:auto;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
@media print{body{overflow:visible;background:#fff}body:before{display:none}.rail,.tree,.topbar,.gsp,.toolbar,.palette,.tabs,.artnav,.savebar,.rhead .acts{display:none!important}.app{display:block;padding:0}.content{overflow:visible}.reader{padding:0}.edit{font-size:12pt}.card,.main{background:#fff;border:0;box-shadow:none}}

/* ---------- repertório de precedentes ---------- */
.segbar{display:inline-flex;border:1px solid var(--gb2);border-radius:11px;overflow:hidden;background:var(--glass2);padding:3px;gap:2px;margin:0 0 14px}
.segbar button{padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--txt2);border-radius:8px;transition:.12s}
.segbar button.on{background:var(--glass-hi);color:var(--pri-txt);font-weight:600;box-shadow:var(--shadow)}
[data-theme="escuro"] .segbar button.on{background:rgba(255,255,255,.12)}
.segbar .n{background:var(--pri-soft);color:var(--pri-txt);border-radius:99px;padding:0 7px;font-size:11px;margin-left:5px}
.prfil{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;padding:11px 12px;border:1px solid var(--gb2);border-radius:13px;background:var(--glass2);margin-bottom:12px}
.prfil label{display:flex;flex-direction:column;gap:3px}
.prfil label.gr{flex:1;min-width:190px}
.prfil label span{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);font-weight:700}
.prfil input,.prfil select{font:inherit;font-size:12.5px;color:var(--txt);background:var(--glass);border:1px solid var(--gb2);border-radius:8px;padding:6px 9px;outline:none;min-width:120px;max-width:260px}
.prfil label.gr input,.prfil label.gr select{max-width:none;width:100%}
.prfil input:focus,.prfil select:focus{border-color:var(--pri)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--txt2);border:1px solid var(--gb2);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--glass);white-space:nowrap}
.toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--gb2)}
.toggle.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-txt)}
.toggle.on .dot{background:var(--pri)}
.prlist{display:flex;flex-direction:column;gap:9px}
.prcard{border:1px solid var(--gb2);border-left:3px solid var(--cc,var(--pri));border-radius:12px;background:var(--glass2);padding:10px 13px;cursor:pointer;transition:.12s}
.prcard:hover{border-color:var(--gb);background:var(--glass-hi)}
.pr-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:5px}
.pr-num{font-size:14px;font-weight:700}
.sit{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.sit.julgado{background:rgba(16,185,129,.14);color:#047857;border-color:rgba(16,185,129,.35)}
.sit.afetado{background:rgba(245,158,11,.14);color:#b45309;border-color:rgba(245,158,11,.35)}
.sit.cancel{background:rgba(239,68,68,.13);color:#b91c1c;border-color:rgba(239,68,68,.3)}
.sit.neutro{background:var(--glass3);color:var(--txt3)}
[data-theme="escuro"] .sit.julgado{color:#6ee7b7}[data-theme="escuro"] .sit.afetado{color:#fcd34d}[data-theme="escuro"] .sit.cancel{color:#fca5a5}
.pr-star{margin-left:auto;color:var(--txt3);font-size:15px;line-height:1;padding:2px 5px;border-radius:7px}
.pr-star:hover{background:var(--glass3);color:#d97706}
.pr-star.on{color:#d97706}
.pr-tese{font-size:13px;line-height:1.55;color:var(--txt);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prcard.open .pr-tese{-webkit-line-clamp:unset;overflow:visible}
.pr-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pr-meta .mt{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--glass3);border:1px solid var(--gb2);color:var(--txt2)}
.pr-meta .mt:hover{border-color:var(--pri);color:var(--pri-txt)}
.pr-meta .mt.lei{background:var(--pri-soft);color:var(--pri-txt);border-color:transparent;font-weight:600}
.pr-ficha{display:none;margin-top:9px;border-top:1px dashed var(--gb2);padding-top:9px}
.prcard.open .pr-ficha{display:block}
.pr-row{margin-bottom:7px}
.pr-row .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);font-weight:700}
.pr-row .v{font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-top:1px}
.pr-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prleis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.prlei{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--gb2);border-radius:11px;background:var(--glass2);padding:10px 12px;text-align:left;transition:.12s;position:relative}
.prlei:hover{border-color:var(--pri);background:var(--glass-hi)}
.prlei b{font-size:14px}
.prlei .n{position:absolute;top:9px;right:11px;background:var(--pri-soft);color:var(--pri-txt);border-radius:99px;padding:1px 9px;font-size:11px;font-weight:600}
.prlei .mini{font-size:10.5px;color:var(--txt3);line-height:1.35}
.prlei .mini.nao{color:#b45309}
.prart{border:1px solid var(--gb2);border-radius:11px;background:var(--glass2);margin-bottom:8px;overflow:hidden}
.prart-h{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.prart-h:hover{background:var(--glass-hi)}
.prart-h .num{font-weight:700;font-size:13px;min-width:92px;color:var(--pri-txt)}
.prart-h .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prart-h .nao{flex:1;color:var(--txt3);font-style:italic}
.prart-h .n{background:var(--glass3);border:1px solid var(--gb2);border-radius:99px;padding:1px 9px;font-size:11px}
.prart-b{display:none;padding:4px 12px 11px;flex-direction:column;gap:8px}
.prart.open .prart-b{display:flex}
.drop{display:block;border:2px dashed var(--gb2);border-radius:13px;padding:26px 16px;text-align:center;color:var(--txt2);cursor:pointer;font-size:13px;transition:.12s}
.drop:hover,.drop.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-txt)}
.pk{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}
.pk input{width:100%;font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--gb2);border-radius:8px;background:var(--glass);color:var(--txt);margin-bottom:7px}
.pk-list{max-height:44vh;overflow:auto;border:1px solid var(--gb2);border-radius:10px}
.pk-list div{padding:7px 10px;border-bottom:1px solid var(--gb2);cursor:pointer}
.pk-list div:hover,.pk-list div.on{background:var(--pri-soft)}
.pk-list small{display:block;color:var(--txt3);font-size:11px}
.ia-parecer{border:1px solid var(--pri);background:var(--pri-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.ia-parecer h4{font-size:13px;margin:0 0 6px;color:var(--pri-txt);text-transform:uppercase;letter-spacing:.05em}
.ia-razao{font-size:11.5px;color:var(--txt2);background:var(--glass3);border:1px solid var(--gb2);border-radius:8px;padding:6px 10px;margin-top:7px}
.ia-sug{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:8px 10px;border:1px solid var(--gb2);border-radius:10px;background:var(--glass2);margin-bottom:7px}
.ia-sug b{font-size:12.5px}
.ia-sug .mini{color:var(--txt3)}
.titem.inst .n{background:var(--pri-soft);color:var(--pri-txt)}
.titem.inst span:first-child{font-style:italic}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- RAIL -->
  <aside class="rail glass">
    <div class="brand"><div class="logo">§</div><span>Vade Mecum<small>vitalício · estudos e anotações</small></span></div>

const TOMB_MAX = 4000, TOMB_DIAS = 365;

function podarLapides(st) {
  const t = (st.meta || {}).apagados; if (!t) return;
  const lim = Date.now() - TOMB_DIAS * 864e5;
  for (const k of Object.keys(t)) if (new Date(t[k] || 0).getTime() < lim) delete t[k];

/* ---------------- persistência ---------------- */
const DB = {
  name: 'vademecum-vitalicio', store: 'kv', db: null,
  open() { return new Promise((res, rej) => { if (!window.indexedDB) return rej('no idb'); const r = indexedDB.open(this.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(this.store); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { const t = this.db.transaction(this.store, 'readonly').objectStore(this.store).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction(this.store, 'readwrite').objectStore(this.store).put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
  /* lê e grava na mesma transação de escrita: é o que torna a gravação atômica entre abas.
     `fn` recebe o que está no disco e devolve { valor, incorporou }. */
  mesclarEGravar(k, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(this.store, 'readwrite');
      const os = tx.objectStore(this.store);
      const g = os.get(k);
      let incorporou = false;
      g.onsuccess = () => {
        let r;
        try { r = fn(g.result); } catch (e) { try { tx.abort(); } catch (_) {} return rej(e); }
        incorporou = !!(r && r.incorporou);
        const p = os.put(r ? r.valor : g.result, k);
        p.onerror = () => rej(p.error);
      };
      g.onerror = () => rej(g.error);
      tx.oncomplete = () => res(incorporou);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('transação cancelada'));
    });
  },
};
let S = null;            // estado global

let useLS = false;
async function loadState() {
  let base = null, cru = null;
  /* a leitura do banco e a migração são tentadas em separado: se a migração falhar,
     o problema não é o IndexedDB, e cair para localStorage apagaria o acervo real */
  try { await DB.open(); cru = await DB.get('state'); fileHandle = (await DB.get('fileHandle')) || null; }
  catch (e) { useLS = true; try { cru = JSON.parse(localStorage.getItem('vademecum-state')); } catch (_) { cru = null; } }
  if (cru) {
    try { base = migrate(cru); }
    catch (e) {
      console.error('falha ao migrar o estado gravado', e);
      falhaMigracao = e;
      try { localStorage.setItem('vademecum-estado-bruto', JSON.stringify(cru).slice(0, 4500000)); } catch (_) {}
      try { base = migrate(JSON.parse(JSON.stringify(cru))); } catch (_) { base = null; }
    }
  }

  const em = lerEmergencia();
  if (em && em.estado && em.rev >= ((base && base.meta && base.meta.rev) || 0)) {
    try { const rec = migrate(em.estado); if (base) { rec.meta.rev = Math.max(rec.meta.rev || 0, (base.meta || {}).rev || 0); } base = rec; emergenciaAplicada = true; } catch (_) {}
  }
  if (base && aplicarParcial(base)) emergenciaAplicada = true;
  if (base) limparEmergencia();   // só descarta a cópia de segurança quando há estado válido em mãos
  return base || migrate(seedState());
}
let falhaMigracao = null;
let emergenciaAplicada = false;

const saveNow = async () => {

      });

};
const save = debounce(saveNow, 500);
/* Rede de segurança: IndexedDB grava de forma assíncrona e uma gravação iniciada
   no fechamento da aba pode não terminar. Antes de sair, uma cópia é escrita em
   localStorage (gravação síncrona) e recuperada na abertura seguinte. */
const EMERG = 'vademecum-emergencia';
let emergCheia = false;
function salvarEmergencia() {
  if (falhaMigracao) return;
  const pacote = { ts: Date.now(), rev: (S.meta || {}).rev || 0, estado: S };
  try { localStorage.setItem(EMERG, JSON.stringify(pacote)); emergCheia = false; return true; }
  catch (_) {
    /* acervo maior que a cota do localStorage: grava só o que o usuário pode ter acabado de editar,
       e NUNCA apaga uma cópia anterior válida (era isso que deixava a rede de segurança inerte) */
    emergCheia = true;
    try { localStorage.setItem(EMERG + '-parcial', JSON.stringify({ ts: Date.now(), rev: pacote.rev, parcial: recorteEmEdicao() })); return true; } catch (__) {}
    return false;
  }
}
/* recorte pequeno com o registro em edição no momento — cabe na cota mesmo com o acervo cheio */
function recorteEmEdicao() {
  const r = { cadernos: [], artigos: [] };
  try {
    if (UI && UI.cadId) { const c = (S.cadernos || []).find(x => x.id === UI.cadId); if (c) r.cadernos.push(JSON.parse(JSON.stringify(c))); }
    if (UI && UI.artId) { const a = findArt(UI.leiId, UI.artId); if (a) r.artigos.push({ leiId: UI.leiId, art: JSON.parse(JSON.stringify(a)) }); }
  } catch (_) {}
  return r;
}
/* devolve ao acervo o recorte gravado às pressas, quando a cópia inteira não coube */
function aplicarParcial(base) {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(EMERG + '-parcial') || 'null'); } catch (_) { p = null; }
  if (!p || !p.parcial) return false;
  let mudou = false;
  const maisNovo = (a, b) => new Date(a || 0) > new Date(b || 0);
  try {
    for (const c of (p.parcial.cadernos || [])) { const i = (base.cadernos || []).findIndex(x => x.id === c.id); if (i >= 0 && maisNovo(c.atualizadoEm, base.cadernos[i].atualizadoEm)) { base.cadernos[i] = c; mudou = true; } }
    for (const { leiId, art } of (p.parcial.artigos || [])) {
      const l = (base.leis || []).find(x => x.id === leiId); if (!l) continue;

function limparEmergencia() { try { localStorage.removeItem(EMERG); localStorage.removeItem(EMERG + '-parcial'); } catch (_) {} }

/* ---------------- helpers de domínio ---------------- */
const leiById = id => S.leis.find(l => l.id === id);

const artLabel = a => 'Art. ' + a.numero;
const numKey = n => { const m = String(n).match(/^(\d+)\s*(?:º|o|°)?\s*-?\s*([A-Z]{0,2})/i); return m ? [parseInt(m[1], 10), (m[2] || '').toUpperCase()] : [1e9, String(n)]; };
const leisDoRamo = rid => rid ? S.leis.filter(l => l.ramos.includes(rid)) : S.leis;
function crumbsDe(lei, art) { const out = []; const stack = []; for (const it of lei.itens) { if (it.tipo === 'cab') { while (stack.length && stack[stack.length - 1].nivel >= it.nivel) stack.pop(); stack.push(it); } else if (it.id === art.id) return stack.map(c => c.rotulo + (c.titulo ? ' – ' + c.titulo : '')); } return out; }
function refsPendentes() { let n = 0; for (const l of S.leis) for (const a of artigosDe(l)) for (const u of a.atualizacoes) if (!u.visto) n++; return n; }
function normNumero(s) { s = String(s).trim().replace(/^art\.?\s*/i, '').replace(/[.,;:]+$/, '').replace(/\.(?=\d{3}\b)/g, ''); s = s.replace(/^(\d+)\s*(o|°)\b/i, '$1º'); if (/^[1-9]$/.test(s)) s += 'º'; return s.replace(/\s*-\s*/g, '-').toUpperCase().replace('º', 'º'); }

/* ---------------- parser de texto colado (Planalto) ---------------- */
const ROMANO = '[IVXLCDM]+(?:\\s*-\\s*[A-Z])?';
const ORDINAIS = 'PRIMEIR[OA]|SEGUND[OA]|TERCEIR[OA]|QUART[OA]|QUINT[OA]|SEXT[OA]|S[ÉE]TIM[OA]|OITAV[OA]|NON[OA]|D[ÉE]CIM[OA](?:\\s+(?:PRIMEIR[OA]|SEGUND[OA]|TERCEIR[OA]|QUART[OA]|QUINT[OA]))?|UND[ÉE]CIM[OA]|DUOD[ÉE]CIM[OA]';
const CABS = [
  [1, new RegExp('^(PARTE\\s+(?:GERAL|ESPECIAL|[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [1, /^(ATO\s+DAS\s+DISPOSI[CÇ][ÕO]ES\s+CONSTITUCIONAIS\s+TRANSIT[ÓO]RIAS)(?![A-Za-zÀ-ú])/i],
  [2, new RegExp('^(LIVRO\\s+(?:COMPLEMENTAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [3, new RegExp('^(T[IÍ]TULO\\s+(?:PRELIMINAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [4, new RegExp('^(CAP[IÍ]TULO\\s+(?:PRELIMINAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [6, new RegExp('^(SUBSE[CÇ][ÃA]O\\s+(?:[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [5, new RegExp('^(SE[CÇ][ÃA]O\\s+(?:[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [3, /^(DISPOSI[CÇ][ÕO]ES\s+(?:PRELIMINARES|GERAIS|FINAIS(?:\s+E\s+TRANSIT[ÓO]RIAS)?|TRANSIT[ÓO]RIAS(?:\s+E\s+FINAIS)?)|DISPOSI[CÇ][ÃA]O\s+(?:PRELIMINAR|FINAL|TRANSIT[ÓO]RIA))(?![A-Za-zÀ-ú])/i, true],
];
const NIVEL_NOME = { 1: 'Parte', 2: 'Livro', 3: 'Título', 4: 'Capítulo', 5: 'Seção', 6: 'Subseção' };
const RX_LIXO = /^(?:presid[êe]ncia da rep[úu]blica|casa civil|subchefia para assuntos jur[íi]dicos|secretaria[ -]geral(?: de governo)?|atos do poder \w+|texto (?:compilado|atualizado)|vig[êe]ncia|regulamento|regulamenta[çc][ãa]o|mensagem de veto|\(vide[^)]*\)|este texto n[ãa]o substitui.*|bras[íi]lia,?\s*(?:em|aos)?\s*\d.*|d\.?\s?o\.?\s?u\.?\b.*|p[áa]gina \d+(?: de \d+)?|\d{1,3}|sum[áa]rio|[íi]ndice)$/i;
/* reconhece um cabeçalho na linha; devolve {nivel, rotulo, titulo} ou null */
function matchCab(l) {
  if (!l || l.length > 160 || /^Art\.?\s*\d/i.test(l)) return null;
  for (const [nivel, rx, disp] of CABS) {
    const m = l.match(rx); if (!m) continue;
    const rotulo = m[1].replace(/\s+/g, ' ').replace(/\s*-\s*/g, '-').trim();
    let resto = l.slice(m[0].length).replace(/^\s*[-–—:.]\s*/, '').trim();

    if (resto && (/[;,]$/.test(resto) || (/\.$/.test(resto) && resto.split(/\s+/).length > 5) || resto.split(/\s+/).length > 22)) return null;

const RX_ART = /^Art\.?\s*(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:º|o|°|\.)?\s*(?:-\s*([A-Z]{1,2})\b)?\s*[.\-–:]?\s*/i;

    }

    if (a) { flush(); esperaTitulo = null; const num = a[1] + (parseInt(a[1], 10) < 10 && a[1].length === 1 ? 'º' : '') + (a[2] ? '-' + a[2].toUpperCase() : ''); cur = { numero: num, linhas: [l] }; continue; }
    if (esperaTitulo) { if (l.length <= 140 && !/^(§|Par[áa]grafo|[IVXLC]+\s*-|[a-z]\))/i.test(l)) { esperaTitulo.titulo = l.replace(/\s*\.$/, ''); esperaTitulo = null; continue; } esperaTitulo = null; }
    if (cur) cur.linhas.push(l);

}

<script>

/* intervalo [a,b) ocupado por um cabeçalho e por tudo que está sob ele */
function blocoRange(lei, idx) {
  const it = lei.itens[idx]; if (!it || it.tipo !== 'cab') return [idx, idx + 1];
  let j = idx + 1; while (j < lei.itens.length && !(lei.itens[j].tipo === 'cab' && lei.itens[j].nivel <= it.nivel)) j++;
  return [idx, j];
}
function moverBloco(lei, idx, dir) {
  const it = lei.itens[idx]; const [a, b] = blocoRange(lei, idx); const tam = b - a;
  if (dir < 0) {
    if (a === 0) return false;
    let p = a - 1; while (p >= 0 && !(lei.itens[p].tipo === 'cab' && lei.itens[p].nivel <= it.nivel)) p--;
    let s;
    if (p < 0) s = 0;                                   // nada acima: vai para o início da lei
    else if (lei.itens[p].nivel < it.nivel) {
      /* é o cabeçalho superior: o bloco sobe até logo depois dele, mas NUNCA por cima dos
         artigos que pendem diretamente desse cabeçalho — eles ficariam dentro desta seção */
      s = p + 1;
      while (s < a && lei.itens[s].tipo !== 'cab') s++;
    }
    else s = p;                                         // é o irmão anterior: passa por cima do bloco dele
    if (s >= a) return false;
    const bloco = lei.itens.splice(a, tam); lei.itens.splice(s, 0, ...bloco); return true;
  }
  if (b >= lei.itens.length) return false;
  const nx = lei.itens[b]; let e;
  if (nx.tipo !== 'cab') { e = b; while (e < lei.itens.length && lei.itens[e].tipo !== 'cab') e++; }
  else { if (nx.nivel < it.nivel) return false; e = blocoRange(lei, b)[1]; }
  const bloco = lei.itens.splice(a, tam); lei.itens.splice(e - tam, 0, ...bloco); return true;
}
function moverRange(lei, a, b, destIdx) {
  if (destIdx > a && destIdx < b) return false;
  const tam = b - a; const bloco = lei.itens.splice(a, tam);
  lei.itens.splice(destIdx > a ? destIdx - tam : destIdx, 0, ...bloco); return true;
}
function normalizarNiveis(lei) {
  let n = 0; for (const it of lei.itens) if (it.tipo === 'cab') { const m = matchCab(it.rotulo); if (m && m.nivel !== it.nivel) { it.nivel = m.nivel; n++; } }
  return n;
}
function faixaDe(lei, a, b) { const arts = lei.itens.slice(a, b).filter(x => x.tipo === 'art'); if (!arts.length) return ''; return arts.length === 1 ? artLabel(arts[0]) : `${artLabel(arts[0])} – ${artLabel(arts[arts.length - 1]).replace('Art. ', '')}`; }
function problemasEstrutura(lei) {
  const p = []; let anterior = null;
  lei.itens.forEach((it, i) => {
    if (it.tipo !== 'cab') return;
    const m = matchCab(it.rotulo);
    if (m && m.nivel !== it.nivel) p.push({ i, txt: `"${it.rotulo}" está no nível ${NIVEL_NOME[it.nivel] || it.nivel} mas deveria ser ${NIVEL_NOME[m.nivel]}.` });
    if (anterior && it.nivel > anterior.nivel + 1) p.push({ i, txt: `"${it.rotulo}" (${NIVEL_NOME[it.nivel] || it.nivel}) vem logo depois de "${anterior.rotulo}" (${NIVEL_NOME[anterior.nivel] || anterior.nivel}), pulando níveis.` });
    if (!it.titulo) p.push({ i, txt: `"${it.rotulo}" está sem título.` });
    const [a, b] = blocoRange(lei, i);
    if (!lei.itens.slice(a, b).some(x => x.tipo === 'art')) p.push({ i, txt: `"${it.rotulo}" não contém nenhum artigo.` });

      <div><b>Estrutura da lei</b><div class="mini" style="line-height:1.5">Organograma editável: insira, renomeie, mova, promova ou exclua Parte, Livro, Título, Capítulo, Seção e Subseção. Mover um cabeçalho leva junto tudo o que está sob ele.</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="st-topo">${I.plus} Cabeçalho no início</button><button class="btn sm" id="st-norm">Corrigir níveis</button>${probs.length ? `<button class="btn sm" id="st-prob">${probs.length} aviso${probs.length > 1 ? 's' : ''}</button>` : ''}</div></div>

function modalTiposJuris(depois) {

    title: 'Tipos de julgado', wide: true,

/* ---------- ordenação das leis ---------- */
const ORDENS = [['manual', 'Ordem definida por mim'], ['sigla', 'Sigla (A→Z)'], ['epigrafe', 'Epígrafe (A→Z)'], ['nome', 'Nome (A→Z)'], ['arts', 'Mais artigos primeiro'], ['recentes', 'Editadas recentemente']];
function ultimaEdicaoLei(l) { let m = ''; for (const a of artigosDe(l)) if (a.atualizadoEm && a.atualizadoEm > m) m = a.atualizadoEm; return m; }
function leisOrdenadas(lista) {
  const o = S.prefs.ordemLeis || 'manual'; const c = lista.slice();
  const cmp = (a, b) => String(a).localeCompare(String(b), 'pt-BR', { sensitivity: 'base' });
  if (o === 'sigla') c.sort((a, b) => cmp(a.sigla, b.sigla));
  else if (o === 'epigrafe') c.sort((a, b) => cmp(a.epigrafe, b.epigrafe));
  else if (o === 'nome') c.sort((a, b) => cmp(a.nome, b.nome));
  else if (o === 'arts') c.sort((a, b) => artigosDe(b).length - artigosDe(a).length || cmp(a.sigla, b.sigla));
  else if (o === 'recentes') c.sort((a, b) => (ultimaEdicaoLei(b) || '').localeCompare(ultimaEdicaoLei(a) || '') || cmp(a.sigla, b.sigla));
  return c;
}
function fixarOrdemAtual() { if ((S.prefs.ordemLeis || 'manual') === 'manual') return; S.leis = leisOrdenadas(S.leis); S.prefs.ordemLeis = 'manual'; }
function moverLei(srcId, dstId, depois) {
  if (srcId === dstId) return false;
  fixarOrdemAtual();
  const i = S.leis.findIndex(l => l.id === srcId); if (i < 0) return false;
  const [lei] = S.leis.splice(i, 1);
  let j = S.leis.findIndex(l => l.id === dstId); if (j < 0) { S.leis.splice(i, 0, lei); return false; }
  S.leis.splice(depois ? j + 1 : j, 0, lei); save(); return true;
}
function moverLeiPos(id, d) {
  fixarOrdemAtual();
  const ramo = S.prefs.ramoAtivo; const vis = leisDoRamo(ramo);
  const k = vis.findIndex(l => l.id === id); const alvo = vis[k + d]; if (!alvo) return false;
  return moverLei(id, alvo.id, d > 0);
}
function bindArrastarLeis(cont) {
  $$('.lei[data-lei]', cont).forEach(el => {
    const id = el.dataset.lei;
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('arrastando'); };
    el.ondragend = () => $$('.lei', cont).forEach(x => x.classList.remove('arrastando', 'dz-a', 'dz-b'));
    el.ondragover = e => { e.preventDefault(); const r = el.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; el.classList.toggle('dz-b', dep); el.classList.toggle('dz-a', !dep); };
    el.ondragleave = () => el.classList.remove('dz-a', 'dz-b');
    el.ondrop = e => { e.preventDefault(); const r = el.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; if (moverLei(e.dataTransfer.getData('text/plain'), id, dep)) { renderTree(); toast('Ordem atualizada', 'ok'); } };
  });
}
function modalOrganizarLeis() {
  const ramo = S.prefs.ramoAtivo;
  const linhas = () => leisOrdenadas(leisDoRamo(ramo)).map(l => `<div class="org-row" draggable="true" data-id="${l.id}"><span class="grip">⠿</span><span class="ico" style="background:${(ramoById(l.ramos[0]) || {}).cor || 'var(--txt3)'}">${esc(l.sigla.slice(0, 4))}</span><span class="t"><b>${esc(l.epigrafe)}</b><small>${esc(l.nome)}</small></span><span class="mini">${artigosDe(l).length} art.</span><span class="ops"><button class="ibtn" data-op="topo" title="Para o topo">⤒</button><button class="ibtn" data-op="cima" title="Subir">${I.up}</button><button class="ibtn" data-op="baixo" title="Descer">${I.down}</button><button class="ibtn" data-op="fim" title="Para o fim">⤓</button></span></div>`).join('');
  openModal({ title: 'Organizar as leis da coluna', wide: true,
    body: `<div class="form"><label>Critério de ordenação<select id="og-crit">${ORDENS.map(([v, l]) => `<option value="${v}" ${(S.prefs.ordemLeis || 'manual') === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="hint">Escolhendo um critério automático, a coluna passa a segui-lo. Arrastar uma lei ou usar as setas fixa a ordem como "definida por mim", preservando o arranjo atual.</span></label>
      <div class="hint">${ramo ? `Mostrando as leis de ${esc(ramoById(ramo).nome)}; a ordem vale para todo o acervo.` : 'Arraste pelo ⠿ ou use as setas. A ordem vale para a coluna e para o filtro por ramo.'}</div></div>
      <div class="org-list" id="og-list">${linhas()}</div>`,
    buttons: [{ label: 'Inverter ordem', cls: 'left', onClick: () => { fixarOrdemAtual(); S.leis.reverse(); save(); modalOrganizarLeis(); renderTree(); return false; } }, { label: 'Fechar', cls: 'pri', onClick: () => renderTree() }],
    onOpen: b => {
      const redes = () => { $('#og-list', b).innerHTML = linhas(); liga(); renderTree(); };
      const liga = () => {
        $$('.org-row', b).forEach(row => {
          const id = row.dataset.id;
          $$('[data-op]', row).forEach(bt => bt.onclick = () => {
            fixarOrdemAtual(); const op = bt.dataset.op;
            if (op === 'topo' || op === 'fim') { const i = S.leis.findIndex(l => l.id === id); const [l] = S.leis.splice(i, 1); op === 'topo' ? S.leis.unshift(l) : S.leis.push(l); save(); }
            else moverLeiPos(id, op === 'cima' ? -1 : 1);
            $('#og-crit', b).value = 'manual'; redes();
          });
          row.ondragstart = e => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; row.classList.add('arrastando'); };
          row.ondragend = () => { $$('.org-row', b).forEach(r => r.classList.remove('arrastando', 'dz-a', 'dz-b')); };
          row.ondragover = e => { e.preventDefault(); const r = row.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; row.classList.toggle('dz-b', dep); row.classList.toggle('dz-a', !dep); };
          row.ondragleave = () => row.classList.remove('dz-a', 'dz-b');
          row.ondrop = e => { e.preventDefault(); const r = row.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; if (moverLei(e.dataTransfer.getData('text/plain'), id, dep)) { $('#og-crit', b).value = 'manual'; redes(); } };
        });
      };
      liga();
      $('#og-crit', b).onchange = e => { S.prefs.ordemLeis = e.target.value; save(); redes(); };
    } });
}

const isoDe = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

const concursoById = id => S.concursos.find(c => c.id === id);

/* ================= motor do cronograma ================= */
const crPlanCache = new Map();
function crKey(c) {
  return c.start + '|' + c.end + '|' + c.discs.map(d => d.id + ':' + d.dow + ':' + (c.laws[d.id] || []).reduce((s, l) => s + (+l.qtd || 0), 0)).join(',');
}
function crPlan(c) {
  const k = crKey(c), hit = crPlanCache.get(c.id);
  if (hit && hit.k === k) return hit.p;
  const p = {};
  for (const d of c.discs) {
    const dates = [];
    if (dataOk(c.start) && dataOk(c.end) && c.start <= c.end) {
      let cur = c.start, guard = 0;
      // avança até o primeiro dia da semana correspondente, depois de 7 em 7
      while (pISO(cur).getDay() !== d.dow && cur <= c.end && guard++ < 8) cur = addDias(cur, 1);
      guard = 0;
      while (cur <= c.end && guard++ < 3000) { dates.push(cur); cur = addDias(cur, 7); }

    const total = (c.laws[d.id] || []).reduce((s, l) => s + (+l.qtd || 0), 0);
    const base = {};
    if (dates.length) { const b = Math.floor(total / dates.length), rem = total - b * dates.length; dates.forEach((dt, i) => { base[dt] = b + (i < rem ? 1 : 0); }); }
    p[d.id] = { dates, base, total };
  }
  crPlanCache.set(c.id, { k, p });

const crAdjOf = (c, disc, date) => c.adjust.filter(a => a.disc === disc && a.date === date);

  if (!temBase && !adjs.length) return null;
  return Math.max(0, (temBase ? pl.base[date] : 0) + adjs.reduce((s, a) => s + a.delta, 0));

  const set = new Set(pl.dates);
  for (const a of c.adjust) if (a.disc === disc) set.add(a.date);
  return Array.from(set).sort();

function crRead(c, disc, date) { const k = date + '|' + disc; return Object.prototype.hasOwnProperty.call(c.reads, k) ? c.reads[k] : null; }
function crVisivel(c, disc, date) { const t = crTarget(c, disc, date); if (t === null) return false; if (t > 0) return true; return crRead(c, disc, date) !== null || crAdjOf(c, disc, date).length > 0; }
function crPosAntes(c, disc, date) {
  const hoje = today(); let pos = 0;
  for (const dt of crDatas(c, disc)) {
    if (dt >= date) break;

function crSegmentos(c, disc, pos, count) {

  for (const l of (c.laws[disc] || [])) {
    const n = +l.qtd || 0; if (n <= 0) continue;
    if (p >= acc + n) { acc += n; continue; }
    const de = Math.max(p, acc) - acc + 1;
    const take = Math.min(n - de + 1, resta);
    if (take <= 0) break;
    segs.push({ nome: l.nome, de, ate: de + take - 1, take, est: l.est, total: n });
    resta -= take; p = acc + de - 1 + take; acc += n;
    if (resta <= 0) break;
  }
  return segs;
}
function crStatus(c, disc, date) {
  const t = today(), tgt = crTarget(c, disc, date);
  if (tgt === null) return null;
  const r = crRead(c, disc, date);
  const saiu = c.adjust.some(a => a.disc === disc && a.date === date && a.delta < 0);
  if (r !== null) {
    if (r >= tgt) return saiu ? 'redist' : 'done';
    if (r > 0) return 'partial';
    return date < t ? 'missed' : (date === t ? 'today' : 'future');
  }
  if (saiu && tgt === 0) return 'redist';
  if (date < t) return tgt === 0 ? 'done' : 'missed';
  if (date === t) return 'today';
  return 'future';
}
function crStats(c, disc) {
  const pl = crPlan(c)[disc] || { total: 0 }; const t = today();
  let lido = 0, prev = 0, fora = 0;
  const noPlano = new Set(crDatas(c, disc));
  for (const dt of noPlano) { const r = crRead(c, disc, dt); if (r !== null) lido += r; if (dt < t) prev += crTarget(c, disc, dt) || 0; }
  /* leituras registradas em datas que saíram do plano (troca de dia da semana ou do período)
     continuam valendo como progresso: senão a barra voltaria a zero e o "atraso" explodiria */
  const suf = '|' + disc;
  for (const k of Object.keys(c.reads || {})) if (k.endsWith(suf) && !noPlano.has(k.slice(0, k.length - suf.length))) fora += +c.reads[k] || 0;
  lido = Math.min(pl.total || (lido + fora), lido + fora);
  return { total: pl.total, lido, prev, fora, atraso: Math.max(0, prev - lido) };
}
function crTotais(c) {
  let total = 0, lido = 0, atraso = 0;
  for (const d of c.discs) { const s = crStats(c, d.id); total += s.total; lido += s.lido; atraso += s.atraso; }
  const rest = dataOk(c.end) ? Math.max(0, diasEntre(today(), c.end)) : 0;
  return { total, lido, atraso, rest, pct: total ? Math.round(100 * lido / total) : 0, ritmo: rest > 0 ? Math.ceil((total - lido) / rest) : 0 };
}
const CR_CHIP = { done: ['ok', 'Concluído'], partial: ['warn', 'Parcial'], missed: ['err', 'Pendente'], today: ['hoje', 'Hoje'], future: ['fut', 'Programado'], redist: ['redist', 'Redistribuído'] };

function crSetRead(c, disc, date, val) {
  const k = date + '|' + disc;
  if (val === null || val === '' || isNaN(val)) delete c.reads[k]; else c.reads[k] = Math.max(0, Math.round(+val));
  crTouch(c); save();
}
function crRedistribuir(c, disc, date, nDias) {
  const tgt = crTarget(c, disc, date); if (tgt === null) return false;
  const pend = tgt - (crRead(c, disc, date) || 0);
  if (pend <= 0) { toast('Não há pendências neste bloco', 'err'); return false; }
  const grp = uid();
  c.adjust.push({ id: uid(), grp, disc, date, delta: -pend, from: date });
  const b = Math.floor(pend / nDias), rem = pend - b * nDias;
  for (let i = 0; i < nDias; i++) { const parte = b + (i < rem ? 1 : 0); if (parte > 0) c.adjust.push({ id: uid(), grp, disc, date: addDias(date, i + 1), delta: parte, from: date }); }
  crTouch(c); save(); return true;
}
function crDesfazerGrupo(c, grp) { c.adjust = c.adjust.filter(a => a.grp !== grp); crTouch(c); save(); }

/* ---- ligação entre o item do cronograma e a lei do vade mecum ---- */
let crIdxLeis = null, crIdxRev = -1;
const crChave = txt => { const m = norm(txt).replace(/\./g, '').match(/(\d{2,6})\s*[\/\-]\s*(\d{4})/); return m ? m[1] + '/' + m[2] : null; };
function crIndice() {
  if (crIdxLeis && crIdxRev === S.leis.length) return crIdxLeis;
  crIdxLeis = { chave: {}, nome: [] };
  for (const l of S.leis) {
    const k = crChave(l.epigrafe + ' ' + l.nome);
    if (k && !crIdxLeis.chave[k]) crIdxLeis.chave[k] = l.id;
    crIdxLeis.nome.push([norm(l.nome), l.id]);
  }
  crIdxRev = S.leis.length;
  return crIdxLeis;
}
function crAcharLei(nome) {
  const ix = crIndice(), k = crChave(nome);
  if (k && ix.chave[k]) return ix.chave[k];
  const n = norm(nome);
  const cand = ix.nome.filter(([nm]) => nm.length > 8 && (n.includes(nm) || nm.includes(n.split('—')[0].trim())));
  return cand.length === 1 ? cand[0][1] : null;
}

/* ================= eventos e agenda ================= */
function crEventosDoDia(dt) {
  const ev = [];
  for (const co of S.concursos) {
    if (co.status === 'arquivado') continue;
    if (co.insc.abertura === dt) ev.push({ tipo: 'inscricao', cor: CR_TIPO_COR.inscricao, titulo: 'Abertura das inscrições', co });
    if (co.insc.fim === dt) ev.push({ tipo: 'inscricao', cor: CR_TIPO_COR.inscricao, titulo: 'ÚLTIMO DIA de inscrição', co, urgente: true });
    for (const f of co.fases) if (f.data === dt) ev.push({ tipo: f.tipo, cor: CR_TIPO_COR[f.tipo] || CR_TIPO_COR.outro, titulo: f.nome || CR_TIPO_NOME(f.tipo), co, fase: f, hora: f.hora, local: f.local, feito: f.feito });
  }
  for (const e of S.agenda) if (e.data === dt) ev.push({ tipo: e.tipo, cor: CR_TIPO_COR[e.tipo] || CR_TIPO_COR.outro, titulo: e.titulo, hora: e.hora, evento: e, feito: e.feito, co: e.concursoId ? concursoById(e.concursoId) : null });
  return ev.sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
}
function crBlocosDoDia(dt, cronoId) {
  const out = [];
  for (const c of S.cronos) {
    if (cronoId && c.id !== cronoId) continue;
    for (const d of c.discs) if (crVisivel(c, d.id, dt)) out.push({ crono: c, disc: d, alvo: crTarget(c, d.id, dt), lido: crRead(c, d.id, dt), st: crStatus(c, d.id, dt) });
  }
  return out;
}
function crProximosPrazos(dias = 90) {
  const t = today(), lim = addDias(t, dias); const out = [];
  for (const co of S.concursos) {
    if (co.status === 'arquivado') continue;
    const push = (data, titulo, tipo, extra) => { if (dataOk(data) && data >= t && data <= lim) out.push(Object.assign({ data, titulo, tipo, co }, extra || {})); };
    push(co.insc.abertura, 'Abertura das inscrições', 'inscricao');
    push(co.insc.fim, 'Último dia de inscrição', 'inscricao', { urgente: true });
    for (const f of co.fases) if (!f.feito) push(f.data, f.nome || CR_TIPO_NOME(f.tipo), f.tipo, { fase: f });
  }
  for (const e of S.agenda) if (!e.feito && dataOk(e.data) && e.data >= t && e.data <= lim) out.push({ data: e.data, titulo: e.titulo, tipo: e.tipo, evento: e, co: e.concursoId ? concursoById(e.concursoId) : null });
  return out.sort((a, b) => a.data.localeCompare(b.data));
}
function crProximaProva(co) {
  const t = today();
  const ds = co.fases.filter(f => f.tipo === 'prova' && dataOk(f.data) && f.data >= t).map(f => f).sort((a, b) => a.data.localeCompare(b.data));
  return ds[0] || null;
}
function crProximoEventoGeral() {
  const p = crProximosPrazos(3650).filter(x => x.tipo === 'prova');
  return p[0] || crProximosPrazos(3650)[0] || null;
}

function badgeConcursos() {

/* ================= calendário ================= */
function crCalendarioHTML(y, m, opts = {}) {
  const hoje = today(), first = new Date(y, m, 1), nd = new Date(y, m + 1, 0).getDate();
  const off = (first.getDay() + 6) % 7; // semana começa na segunda
  let h = `<div class="cal-nav"><button class="btn sm ghost" data-cal="-1">‹</button><b>${MESES_PT[m][0].toUpperCase() + MESES_PT[m].slice(1)} de ${y}</b><button class="btn sm ghost" data-cal="1">›</button><button class="btn sm ghost" data-cal="0">hoje</button></div><div class="cal">`;
  for (const d of ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom']) h += `<div class="cal-dow">${d}</div>`;
  for (let i = 0; i < off; i++) h += '<div class="cal-c off"></div>';
  for (let d = 1; d <= nd; d++) {
    const dt = isoDe(new Date(y, m, d));
    const blocos = crBlocosDoDia(dt, opts.cronoId), evs = opts.semEventos ? [] : crEventosDoDia(dt);
    let pts = '';
    for (const b of blocos.slice(0, 6)) pts += `<i class="pt ${b.st}" title="${esc(b.disc.nome)} — ${nfBR.format(b.alvo)} ${unidNome(b.crono.unidade)}"></i>`;
    if (blocos.length > 6) pts += `<i class="pt mais">+</i>`;
    let evh = '';
    for (const e of evs.slice(0, 2)) evh += `<span class="cal-ev" style="background:${e.cor}20;color:${e.cor};border-color:${e.cor}55" title="${esc(e.titulo)}">${esc((e.hora ? e.hora + ' ' : '') + e.titulo)}</span>`;
    if (evs.length > 2) evh += `<span class="cal-ev mais">+${evs.length - 2}</span>`;
    h += `<div class="cal-c${dt === hoje ? ' hoje' : ''}${blocos.length || evs.length ? '' : ' vazio'}" data-dia="${dt}"><span class="n">${d}</span>${evh}${pts ? `<div class="pts">${pts}</div>` : ''}</div>`;
  }
  h += '</div>';
  if (!opts.semLegenda) h += `<div class="cal-leg"><span><i class="pt done"></i>concluído</span><span><i class="pt partial"></i>parcial</span><span><i class="pt missed"></i>pendente</span><span><i class="pt today"></i>hoje</span><span><i class="pt future"></i>programado</span><span><i class="pt redist"></i>redistribuído</span></div>`;
  return h;
}
function crBindCalendario(root, estado, redesenhar) {
  $$('[data-cal]', root).forEach(b => b.onclick = () => {
    const v = +b.dataset.cal;
    if (v === 0) { const t = new Date(); estado.y = t.getFullYear(); estado.m = t.getMonth(); }

/* ================= bloco de estudo ================= */
function crBlocoHTML(c, disc, date, compact) {
  const d = crDisc(c, disc), tgt = crTarget(c, disc, date);
  if (tgt === null) return '';
  const st = crStatus(c, disc, date), r = crRead(c, disc, date);
  const pos = crPosAntes(c, disc, date), segs = crSegmentos(c, disc, pos, tgt);
  const cob = segs.reduce((s, x) => s + x.take, 0), chip = CR_CHIP[st] || CR_CHIP.future;
  const stats = crStats(c, disc), un = unidNome(c.unidade), pend = tgt - (r || 0);
  let barras = segs.map(s => `<span style="width:${cob ? 100 * s.take / cob : 0}%"></span>`).join('');
  let lista = segs.map(s => {
    const rot = s.take >= s.total ? 'integral' : (s.de === s.ate ? `parte ${s.de} de ${nfBR.format(s.total)}` : `partes ${nfBR.format(s.de)} a ${nfBR.format(s.ate)} de ${nfBR.format(s.total)}`);
    const lid = crAcharLei(s.nome);
    return `<li><span>${lid ? `<a class="lnk" data-lei="${lid}" title="abrir esta lei no vade mecum">${esc(s.nome)}</a>` : esc(s.nome)}${s.est ? ' <i class="est" title="quantidade estimada">~</i>' : ''}</span><b>${rot} · ${nfBR.format(s.take)} ${un}</b></li>`;
  }).join('');
  if (!segs.length && tgt > 0) lista = `<li><span class="mini">Lista desta disciplina concluída até o fim.</span></li>`;
  if (tgt === 0) lista = `<li><span class="mini">Bloco redistribuído — nada pendente neste dia.</span></li>`;
  const acoes = compact ? '' : `<div class="blk-act" data-blk="${c.id}|${disc}|${date}">
      <span class="mini">Concluídas:</span><input type="number" min="0" class="inp num" data-role="lido" value="${r === null ? '' : r}" placeholder="${tgt}">
      <button class="btn sm" data-op="salvar">Salvar</button>
      <button class="btn sm pri" data-op="tudo">Concluir</button>
      ${r !== null ? '<button class="btn sm ghost" data-op="limpar">Limpar</button>' : ''}
      ${pend > 0 && date <= today() ? `<span class="mini">Adiar ${nfBR.format(pend)} ${un} em</span><select class="inp" data-role="ndias" style="width:82px"><option>1</option><option>2</option><option>3</option><option selected>5</option><option>7</option></select><button class="btn sm" data-op="redist">Redistribuir</button>` : ''}</div>`;
  return `<div class="blk st-${st}">
    <div class="blk-top"><b>${esc(d ? d.nome : disc)}</b><span class="mini">${esc(c.nome)}</span><span class="chip ${chip[0]}">${chip[1]}</span></div>
    <div class="blk-meta"><b>${nfBR.format(tgt)}</b> ${un}${r !== null ? ` · lidas hoje: <b>${nfBR.format(r)}</b>` : ''} · posição ${nfBR.format(Math.min(pos, stats.total))}/${nfBR.format(stats.total)}</div>
    <div class="blk-bar">${barras || '<span style="width:100%"></span>'}</div>
    <ul class="blk-list">${lista}</ul>${acoes}</div>`;
}
function crBindBlocos(root, depois) {
  $$('[data-lei]', root).forEach(a => a.onclick = e => { e.stopPropagation(); closeModal(); openLeiHome(a.dataset.lei); });
  $$('[data-blk]', root).forEach(box => {
    const [cid, disc, date] = box.dataset.blk.split('|'); const c = cronoById(cid); if (!c) return;
    const inp = $('[data-role="lido"]', box);
    $$('[data-op]', box).forEach(b => b.onclick = () => {
      const op = b.dataset.op;
      if (op === 'salvar') crSetRead(c, disc, date, inp.value === '' ? null : inp.value);
      else if (op === 'tudo') crSetRead(c, disc, date, crTarget(c, disc, date));
      else if (op === 'limpar') crSetRead(c, disc, date, null);

      if (depois) depois();

  });
}

    buttons: [{ label: 'Cancelar' }, ...(fase ? [{ label: 'Excluir', cls: 'danger', onClick: () => { registrarExclusao(fase.id); co.fases = co.fases.filter(x => x.id !== fase.id); co.atualizadoEm = new Date().toISOString(); save(); renderConcursos(); } }] : []), {
      label: 'Salvar', cls: 'pri', onClick: () => {

}

    <div class="card stat"><b>${nfBR.format(tt.lido)}</b><span>concluídas (${tt.pct}%)</span></div>

    h += `<div class="lrow d7"><div class="nm"><b>${fmtBR(dt)}</b><small>${DIAS_SEM[pISO(dt).getDay()]}</small></div>
      <div class="mini" style="font-size:13px">${bs.map(d => `${esc(d.nome)} <b>(${nfBR.format(crTarget(c, d.id, dt))})</b>`).join(' · ') || 'sem estudo programado'}</div>

  return h + '</div></div>';
}

/* ---- gráfico semanal ---- */
function crDesenharGrafico(c) {
  const cv = $('#crChart'); if (!cv || !cv.parentElement) return;
  const W = Math.max(300, cv.parentElement.getBoundingClientRect().width - 4), H = 200, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!dataOk(c.start) || !dataOk(c.end) || c.start > c.end) return;
  let ws = addDias(c.start, -((pISO(c.start).getDay() + 6) % 7));
  const semanas = []; let guard = 0;
  while (ws <= c.end && guard++ < 200) {
    const we = addDias(ws, 6); let plano = 0, lido = 0;
    for (const d of c.discs) for (const dt of crDatas(c, d.id)) if (dt >= ws && dt <= we) { plano += crTarget(c, d.id, dt) || 0; const r = crRead(c, d.id, dt); if (r !== null) lido += r; }
    semanas.push({ ws, plano, lido }); ws = addDias(ws, 7);
  }
  if (!semanas.length) return;
  const max = Math.max(1, ...semanas.map(w => Math.max(w.plano, w.lido)));
  const cs = getComputedStyle(document.documentElement);
  const cor1 = (cs.getPropertyValue('--pri-soft') || '').trim() || 'rgba(99,102,241,.2)';
  const cor2 = (cs.getPropertyValue('--pri') || '').trim() || '#4f46e5';
  const cLin = (cs.getPropertyValue('--line') || '').trim() || '#ddd', cTxt = (cs.getPropertyValue('--txt3') || '').trim() || '#888';
  const pl = 46, pb = 22, pt = 8, cw = (W - pl - 8) / semanas.length;
  ctx.font = '10px ui-monospace,monospace'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = pt + (H - pt - pb) * (1 - g / 4);
    ctx.strokeStyle = cLin; ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(W - 4, y); ctx.stroke();
    ctx.fillStyle = cTxt; ctx.fillText(nfBR.format(Math.round(max * g / 4)), 2, y + 3);
  }
  const t = today(), passo = Math.ceil(semanas.length / 9);
  semanas.forEach((w, i) => {
    const x = pl + i * cw, bw = Math.max(3, cw * .62);
    ctx.fillStyle = cor1; ctx.fillRect(x + (cw - bw) / 2, H - pb - (H - pt - pb) * (w.plano / max), bw, (H - pt - pb) * (w.plano / max));
    ctx.fillStyle = cor2; ctx.fillRect(x + (cw - bw) / 2, H - pb - (H - pt - pb) * (w.lido / max), bw, (H - pt - pb) * (w.lido / max));
    if (i % passo === 0) { ctx.fillStyle = cTxt; ctx.fillText(fmtBRc(w.ws), x + 1, H - 6); }
    if (w.ws <= t && addDias(w.ws, 6) >= t) { ctx.fillStyle = cor2; ctx.fillRect(x + (cw - bw) / 2, H - pb + 2, bw, 2); }
  });
}

<script>
/* =====================================================================
   PARTE 10 — vínculos abaixo do artigo: referências no texto (com edição

const refsMan = a => { if (!a.refsMan) a.refsMan = []; return a.refsMan; };
const refsOff = a => { if (!a.refsOff) a.refsOff = []; return a.refsOff; };

/* ---- detecção automática no texto do artigo ---- */
function refsDetectadas(lei, art) {
  const txt = plain(art.texto), out = [];
  const vistos = new Set();
  const arts = artigosDe(lei);
  const acha = bruto => {
    const n = normNumero(String(bruto).replace(/\.(?=\d{3}\b)/g, ''));   // 1.723 → 1723, sem confundir com "art. 1."
    const t = arts.find(a => normNumero(a.numero) === n);
    if (t && t.id !== art.id && normNumero(t.numero) !== normNumero(art.numero) && !vistos.has('a:' + t.id)) { vistos.add('a:' + t.id); out.push({ k: 'a:' + t.id, tipo: 'art', lei, art: t }); }
  };
  /* "art. 5º", "art. 1.723", "arts. 186 e 187", "arts. 1.784, 1.785 e 1.786", "art. 980-A" */
  const rx = /\bart(?:igo)?s?\.?\s*((?:\d{1,3}(?:\.\d{3})*|\d+)\s*(?:º|o|°)?(?:\s*-\s*[A-Za-z])?(?:\s*(?:,|e|a)\s*(?:\d{1,3}(?:\.\d{3})*|\d+)\s*(?:º|o|°)?(?:\s*-\s*[A-Za-z])?)*)/gi;
  let m;
  while ((m = rx.exec(txt))) {
    const lista = m[1].split(/\s*(?:,|\be\b|\ba\b)\s*/i).filter(Boolean);
    for (const p of lista) { const g = p.match(/^(\d{1,3}(?:\.\d{3})*|\d+)\s*(?:º|o|°)?(?:\s*-\s*([A-Za-z]))?/); if (g) acha(g[1] + (g[2] ? '-' + g[2].toUpperCase() : '')); }
  }
  const rl = /\b(Lei(?:\s+Complementar)?|Decreto-Lei|Decreto)\s+n?\.?\s*º?\s*([\d.]+)/gi;
  while ((m = rl.exec(txt))) {
    const num = m[2].replace(/\./g, '');
    if (num.length < 3) continue;
    const tipoCit = norm(m[1]);
    const l = S.leis.find(x => {
      if (x.id === lei.id) return false;
      const ep = norm(x.epigrafe).replace(/\./g, '');
      if (!new RegExp('(^|\\D)' + num + '(\\D|$)').test(ep)) return false;   // fronteira: 4657 não casa com 14657
      if (tipoCit.startsWith('decreto-lei')) return ep.includes('decreto-lei');
      if (tipoCit.startsWith('lei complementar')) return ep.includes('complementar');
      if (tipoCit === 'decreto') return ep.includes('decreto') && !ep.includes('decreto-lei');
      return ep.includes('lei') && !ep.includes('decreto-lei');
    });
    if (l && !vistos.has('l:' + l.id)) { vistos.add('l:' + l.id); out.push({ k: 'l:' + l.id, tipo: 'lei', lei: l }); }
  }
  return out;
}

function purgarVinculosMortos() {

    if (Array.isArray(a.refsMan)) { const antes = a.refsMan.length; a.refsMan = a.refsMan.filter(r => r.artId ? vivoArt(r.leiId, r.artId) : !!leiById(r.leiId)); n += antes - a.refsMan.length; }

      <button class="btn sm" data-vp="lado" title="Abrir na divisão de tela, ao lado">◨ ao lado</button><button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Abrir lei</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
      <div class="vp-corpo"><p class="mini">${arts.length ? `${nfBR.format(arts.length)} artigos cadastrados.` : 'Texto ainda não importado.'}${l.ementa ? ' ' + esc(l.ementa) : ''}</p>
      ${arts.slice(0, 3).map(a => `<p><b>${esc(artLabel(a))}</b> ${esc(plain(a.texto).replace(/^Art\.?\s*[\d.ºo°\-A-Z]+\.?\s*/i, '').slice(0, 180))}…</p>`).join('')}</div>`;
  }
  const a = al.art, l = al.lei, cr = crumbsDe(l, a);
  return `<div class="vp-head"><b>${esc(l.sigla)}, ${esc(artLabel(a))}</b><span class="mini">${esc(l.epigrafe)}</span>
      ${a.estrelas ? `<span style="color:var(--star)">${'★'.repeat(a.estrelas)}</span>` : ''}${a.status !== 'vigente' ? `<span class="status ${a.status}">${a.status}</span>` : ''}<span style="flex:1"></span>
      <button class="btn sm" data-vp="lado" title="Abrir na divisão de tela, ao lado">◨ ao lado</button><button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Abrir artigo</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
    ${cr.length ? `<div class="crumbs vp-crumbs">${cr.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}
    ${al.obs ? `<div class="vp-obs">${esc(al.obs)}</div>` : ''}
    <div class="vp-corpo leitura">${sanitizeHtml(a.texto) || '<div class="empty">Artigo sem texto.</div>'}</div>
    ${temNota(a) ? `<div class="vp-extra"><b>Notas</b>${notasHtml(a)}</div>` : ''}
    ${temJuris(a) ? `<div class="vp-extra"><b>Jurisprudência</b>${jurisHtml(a)}</div>` : ''}`;
}
function abrirAlvo(al) {
  if (!al) return;
  if (al.tipo === 'prec') { UI.vprev = null; modalPrecedente(al.prec); return; }
  if (al.tipo === 'cab') { UI.vprev = null; const a0 = al.arts[0]; if (a0) openArt(al.lei.id, a0.id); else openLeiHome(al.lei.id); return; }
  if (al.tipo === 'jur') { UI.vprev = null; openArt(al.lei.id, al.art.id, 'juris'); UI.jurisId = al.jur.id; renderReader(); return; }   // openArt zera jurisId ao trocar de artigo
  if (al.tipo === 'cad') openCad(al.cad.id);
  else if (al.tipo === 'lei') openLeiHome(al.lei.id);
  else openArt(al.lei.id, al.art.id);
}
function janelaPreview(lei, art, k) {
  const al = alvoDaChave(lei, art, k);
  openModal({
    title: al ? (al.tipo === 'prec' ? precCurto(al.prec) : al.tipo === 'cab' ? al.lei.sigla + ', ' + al.cab.rotulo : al.tipo === 'jur' ? al.jur.titulo : al.tipo === 'cad' ? al.cad.titulo : al.tipo === 'lei' ? al.lei.epigrafe : `${al.lei.sigla}, ${artLabel(al.art)}`) : 'Referência',
    wide: true, body: `<div class="vprev solta">${previewHTML(al)}</div>`,
    buttons: [{ label: 'Fechar' }, { label: 'Abrir', cls: 'pri', onClick: () => abrirAlvo(al) }],
    onOpen: b => $$('[data-vp]', b).forEach(x => x.onclick = () => { if (x.dataset.vp === 'abrir') { closeModal(); abrirAlvo(al); } else closeModal(); }),
  });
}

/* evita cadastrar duas vezes o mesmo alvo */
function refJaExiste(lei, art, leiId, artId) {
  if (artId && refsDetectadas(lei, art).some(r => r.tipo === 'art' && r.art.id === artId && !refsOff(art).includes(r.k))) return true;
  if (!artId && refsDetectadas(lei, art).some(r => r.tipo === 'lei' && r.lei.id === leiId && !refsOff(art).includes(r.k))) return true;
  return refsMan(art).some(r => (r.artId || null) === (artId || null) && r.leiId === leiId);
}
const correlacaoJaExiste = (art, d) => (art.links || []).some(k => (k.artId || null) === (d.artId || null) && (k.cadId || null) === (d.cadId || null) && (k.cabId || null) === (d.cabId || null) && (k.leiId || null) === (d.leiId || null));

/* ---- bloco de vínculos ---- */
function renderVinculos(lei, art) {
  const el = $('#vinc'); if (!el) return;
  const refs = refsDoArtigo(lei, art);
  const back = refBy(art.id), cads = refByCad(art.id);
  const ocultas = refsOff(art).length;
  const chip = (k, rot, extra, tit) => `<span class="chip vchip ${UI.vprev === k ? 'on' : ''}" data-k="${k}" title="${esc(tit || rot)}">${esc(rot)}${extra || ''}</span>`;
  let h = `<div class="vsec"><span class="vlab">Referências no texto</span>
      ${refs.map(r => chip(r.k, refRotulo(r), `<button class="x" data-rm="${r.k}" title="Remover esta referência">×</button>`, plain(r.tipo === 'art' ? r.art.texto : r.lei.nome).slice(0, 160))).join('') || '<span class="mini">nenhuma detectada</span>'}
      <button class="btn sm ghost" id="vr-add" title="Acrescentar uma referência que o programa não detectou">+ referência</button>
      ${ocultas ? `<button class="btn sm ghost" id="vr-rest" title="Trazer de volta as referências que você removeu">restaurar ${ocultas}</button>` : ''}</div>
    <div class="vsec"><span class="vlab">Correlações</span>
      ${art.links.map((k, i) => {
        const rm = `${k.obs ? ' <i class="ob">·</i>' : ''}<button class="x" data-dl="${i}" title="Remover correlação">×</button>`;
        if (k.cadId) { const c = cadById(k.cadId); return c ? chip('c:' + i, '≡ ' + c.titulo, rm, (k.obs ? k.obs + ' — ' : '') + 'caderno · ' + plain(c.conteudo).slice(0, 150)) : `<span class="chip vchip quebrada">caderno excluído<button class="x" data-dl="${i}">×</button></span>`; }
        if (k.cabId) { const c = acharCab(k.leiId, k.cabId); return c ? `<span class="chip vchip cab ${UI.vprev === 'c:' + i ? 'on' : ''}" data-k="c:${i}" title="${esc((k.obs ? k.obs + ' — ' : '') + c.lei.epigrafe + ' · ' + cabRotulo(c) + ' · ' + plural(c.arts.length, 'artigo'))}">${esc(c.lei.sigla + ', ' + c.cab.rotulo)}${rm}</span>` : `<span class="chip vchip quebrada">divisão excluída<button class="x" data-dl="${i}">×</button></span>`; }
        const f = findArt(k.leiId, k.artId);
        return f ? chip('c:' + i, `${f.lei.sigla}, ${artLabel(f.art)}`, rm, (k.obs ? k.obs + ' — ' : '') + plain(f.art.texto).slice(0, 160)) : `<span class="chip vchip quebrada">vínculo quebrado<button class="x" data-dl="${i}">×</button></span>`;
      }).join('') || '<span class="mini">nenhuma cadastrada</span>'}
      <button class="btn sm ghost" id="vc-add" title="Vincular este artigo a outro artigo ou a um caderno de estudos">+ correlação</button></div>
    <div class="vsec"><span class="vlab">Precedentes</span>
      ${precsDoArtigo(art.id).map(pr => `<span class="chip vchip prec ${UI.vprev === 'p:' + pr.id ? 'on' : ''}" data-k="p:${pr.id}" style="--tc:${tipoJurisCor(pr.tipo)}" title="${esc(tipoJurisNome(pr.tipo) + ' — ' + (pr.titulo || '') + ' ' + (pr.tese || '').slice(0, 140))}">${esc(precCurto(pr))}<button class="x" data-pdl="${pr.id}" title="Desvincular deste artigo">×</button></span>`).join('') || '<span class="mini">nenhum vinculado</span>'}
      <button class="btn sm ghost" id="vp-add" title="Vincular um tema, súmula ou enunciado do repositório">+ precedente</button></div>
    <div class="vsec"><span class="vlab">Jurisprudência</span>
      ${jurisDe(art).filter(j => jurisCheia(j)).map(j => true ? `<span class="chip vchip juris ${UI.vprev === 'j:' + j.id ? 'on' : ''}" data-k="j:${j.id}" style="--tc:${tipoJurisCor(j.tipo)}" title="${esc(tipoJurisNome(j.tipo) + ' — ' + (plain(j.conteudo).slice(0, 150) || 'sem conteúdo'))}"><i class="tj"></i>${esc(tipoJurisAbrev(j.tipo))}${j.titulo && j.titulo !== 'Julgado' && !/^Julgado \d+$/.test(j.titulo) ? ` <b class="jt">${esc(j.titulo)}</b>` : ''}${jurisCheia(j) ? '' : ' <i class="vz">vazio</i>'}</span>` : '').join('') || '<span class="mini">nenhum julgado registrado</span>'}
      <button class="btn sm ghost" id="vj-add" title="Registrar um julgado na aba Jurisprudência">+ julgado</button></div>`;
  if (back.length || cads.length) h += `<div class="vsec"><span class="vlab">Citado em</span>
      ${back.map(b => chip('b:' + b.lei.id + '|' + b.art.id, `${b.lei.sigla}, ${artLabel(b.art)}`, '', (b.obs ? b.obs + ' — ' : '') + plain(b.art.texto).slice(0, 160))).join('')}
      ${cads.map(c => chip('d:' + c.id, c.titulo, '', plain(c.conteudo).slice(0, 160))).join('')}</div>`;
  const al = UI.vprev ? alvoDaChave(lei, art, UI.vprev) : null;
  h += `<div class="vprev" id="vprev" ${UI.vprev ? '' : 'hidden'}>${UI.vprev ? previewHTML(al) : ''}</div>`;
  el.innerHTML = h;

  $$('.vchip', el).forEach(c => c.onclick = e => {
    if (e.target.closest('.x')) return;
    UI.vprev = UI.vprev === c.dataset.k ? null : c.dataset.k;
    renderVinculos(lei, art);
    if (UI.vprev) { const p = $('#vprev'); if (p) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  });
  $$('[data-rm]', el).forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.rm;
    if (k.startsWith('m:')) art.refsMan = refsMan(art).filter(x => 'm:' + x.id !== k);
    else if (!refsOff(art).includes(k)) refsOff(art).push(k);
    if (UI.vprev === k) UI.vprev = null;
    art.atualizadoEm = new Date().toISOString();
    save(); renderVinculos(lei, art);
  });
  $$('[data-dl]', el).forEach(b => b.onclick = e => { e.stopPropagation(); if (typeof flushDirty === 'function') flushDirty(); art.links.splice(+b.dataset.dl, 1); art.atualizadoEm = new Date().toISOString(); UI.vprev = null; save(); renderReader(); renderTree(); });
  const rest = $('#vr-rest', el); if (rest) rest.onclick = () => { art.refsOff = []; art.atualizadoEm = new Date().toISOString(); save(); renderVinculos(lei, art); };
  $('#vr-add', el).onclick = () => modalRefManual(lei, art);
  $('#vc-add', el).onclick = () => modalCorrelacao(lei, art);
  $$('[data-pdl]', el).forEach(b => b.onclick = e => { e.stopPropagation(); const pr = precById(b.dataset.pdl); if (pr) { precDesligar(pr, art.id); if (UI.vprev === 'p:' + pr.id) UI.vprev = null; renderVinculos(lei, art); } });
  $('#vp-add', el).onclick = () => pickPrecedente(pr => { precLigar(pr, lei.id, art.id); renderVinculos(lei, art); toast('Precedente vinculado', 'ok'); }, lei.ramos[0]);
  $('#vj-add', el).onclick = () => { const nv = novoJulgado({ titulo: 'Julgado ' + (jurisDe(art).length + 1) }); (art.jurisList = art.jurisList || []).push(nv); UI.jurisId = nv.id; art.atualizadoEm = new Date().toISOString(); save(); openArt(lei.id, art.id, 'juris'); };
  const pv = $('#vprev', el);
  if (pv) $$('[data-vart]', pv).forEach(x => x.onclick = () => { const [li, ai] = x.dataset.vart.split('|'); openArt(li, ai); });
  if (pv) $$('[data-vp]', pv).forEach(x => x.onclick = () => {
    const op = x.dataset.vp;
    if (op === 'abrir') abrirAlvo(al);
    else if (op === 'lado') {
      const a = al;
      if (a && typeof verAoLado === 'function') verAoLado(
        a.tipo === 'cad' ? { tipo: 'cad', cadId: a.cad.id }
        : a.tipo === 'prec' ? { tipo: 'prec', precId: a.prec.id }
        : a.tipo === 'cab' ? { tipo: 'cab', leiId: a.lei.id, cabId: a.cab.id }
        : a.tipo === 'lei' ? { tipo: 'lei', leiId: a.lei.id }
        : { tipo: 'art', leiId: a.lei.id, artId: a.art.id });
    }
    else if (op === 'janela') { const k = UI.vprev; UI.vprev = null; renderVinculos(lei, art); janelaPreview(lei, art, k); }
    else { UI.vprev = null; renderVinculos(lei, art); }
  });
}
function modalCorrelacao(lei, art) {
  const vincular = (dados, rot) => openModal({
    title: 'Observação da correlação',
    body: `<div class="form"><p class="hint" style="margin:0">${esc(rot)}</p><label>Por que se relacionam? (opcional)<input type="text" id="lk-obs" placeholder="ex.: regra geral × exceção; caderno com o resumo do tema"></label></div>`,
    buttons: [{ label: 'Cancelar' }, { label: 'Vincular', cls: 'pri', onClick: () => { if (correlacaoJaExiste(art, dados)) { toast('Esta correlação já existe neste artigo'); return; } art.links.push(Object.assign({ obs: $('#lk-obs').value.trim() }, dados)); art.atualizadoEm = new Date().toISOString(); save(); renderVinculos(lei, art); renderTree(); toast('Correlação adicionada', 'ok'); } }],
  });
  const cads = S.cadernos.filter(c => c.tipo === 'caderno');
  openModal({
    title: 'Nova correlação',
    body: `<div class="form"><p class="hint" style="margin:0">Ligue este artigo a outro dispositivo, a uma divisão inteira da lei (título, capítulo, seção), a um precedente do repositório ou a um caderno de estudos. A correlação aparece nos dois lados: aqui em etiqueta e, no caderno, em “Artigos que citam este caderno”.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cl-art">Artigo de lei</button><button class="btn" id="cl-cab">Título, capítulo ou seção</button><button class="btn" id="cl-prec">Precedente ou súmula${precs().length ? ` (${precs().length})` : ''}</button><button class="btn" id="cl-cad" ${cads.length ? '' : 'disabled title="Nenhum caderno criado ainda"'}>Caderno de estudos${cads.length ? ` (${cads.length})` : ''}</button></div></div>`,
    buttons: [{ label: 'Cancelar' }],
    onOpen: b => {
      $('#cl-art', b).onclick = () => { closeModal(); pickArtigo(r => vincular({ leiId: r.lei.id, artId: r.art.id }, `${r.lei.sigla}, ${artLabel(r.art)}`)); };
      $('#cl-cab', b).onclick = () => { closeModal(); pickCabecalho(c => vincular({ leiId: c.lei.id, cabId: c.cab.id }, `${c.lei.sigla}, ${cabRotulo(c)} — ${plural(c.arts.length, 'artigo')}${c.faixa ? ' (' + c.faixa + ')' : ''}`), lei.id); };
      $('#cl-prec', b).onclick = () => { closeModal(); pickPrecedente(pr => { precLigar(pr, lei.id, art.id); renderVinculos(lei, art); toast('Precedente vinculado', 'ok'); }, lei.ramos[0]); };
      const bc = $('#cl-cad', b); if (!cads.length) return;
      bc.onclick = () => {
        closeModal();
        openModal({
          title: 'Escolher caderno', wide: true,
          body: `<div class="form"><label>Caderno<input type="text" id="cd-f" placeholder="filtrar por título, ramo ou conteúdo…"></label><div class="pick" id="cd-list"></div></div>`,
          buttons: [{ label: 'Cancelar' }],
          onOpen: bb => {
            const des = () => {
              const f = norm($('#cd-f', bb).value);
              $('#cd-list', bb).innerHTML = cads.filter(c => !f || norm(c.titulo + ' ' + ((ramoById(c.ramo) || {}).nome || '') + ' ' + plain(c.conteudo).slice(0, 4000)).includes(f)).slice(0, 200)
                .map(c => `<div data-id="${c.id}"><b>${esc(c.titulo)}</b><small>${esc((ramoById(c.ramo) || {}).nome || 'sem ramo')} — ${esc(plain(c.conteudo).slice(0, 90) || 'caderno vazio')}</small></div>`).join('') || '<div class="empty">Nenhum caderno</div>';
              $$('#cd-list div[data-id]', bb).forEach(d => d.onclick = () => { const c = cadById(d.dataset.id); closeModal(); vincular({ cadId: c.id }, `Caderno “${c.titulo}”`); });
            };
            $('#cd-f', bb).oninput = des; des();
          },
        });
      };
    },
  });
}
function modalRefManual(lei, art) {
  openModal({
    title: 'Acrescentar referência',
    body: `<div class="form"><p class="hint" style="margin:0">O programa lê o texto do artigo e reconhece sozinho as remissões a outros artigos da mesma lei e a leis do acervo. Aqui você acrescenta o que ele não detectou — inclusive remissões a artigos de outras leis — e o “×” em cada etiqueta remove o que ele reconheceu por engano.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="rf-art">Escolher um artigo</button><button class="btn" id="rf-lei">Referir uma lei inteira</button></div></div>`,
    buttons: [{ label: 'Cancelar' }],
    onOpen: b => {
      $('#rf-art', b).onclick = () => { closeModal(); pickArtigo(r => { if (refJaExiste(lei, art, r.lei.id, r.art.id)) { toast('Esta referência já consta do artigo'); return; } refsMan(art).push({ id: uid(), leiId: r.lei.id, artId: r.art.id }); art.atualizadoEm = new Date().toISOString(); save(); renderVinculos(lei, art); toast('Referência acrescentada', 'ok'); }); };

        closeModal();
        openModal({
          title: 'Referir uma lei inteira', wide: true,

          buttons: [{ label: 'Cancelar' }],
          onOpen: bb => {
            const des = () => {
              const f = norm($('#rf-f', bb).value);
              $('#rf-list', bb).innerHTML = S.leis.filter(l => !f || norm(l.sigla + ' ' + l.nome + ' ' + l.epigrafe).includes(f)).slice(0, 200).map(l => `<div data-id="${l.id}"><b>${esc(l.sigla)}</b><small>${esc(l.epigrafe)} — ${esc(l.nome)}</small></div>`).join('') || '<div class="empty">Nenhuma lei</div>';
              $$('#rf-list div[data-id]', bb).forEach(d => d.onclick = () => { if (refJaExiste(lei, art, d.dataset.id, null)) { toast('Esta referência já consta do artigo'); return; } refsMan(art).push({ id: uid(), leiId: d.dataset.id, artId: null }); art.atualizadoEm = new Date().toISOString(); save(); closeModal(); renderVinculos(lei, art); toast('Referência acrescentada', 'ok'); });
            };
            $('#rf-f', bb).oninput = des; des();
          },
        });
      };
    },
  });
}

<script>
/* =====================================================================
   PARTE 11 — pesquisa permanente no topo: procura em todo o acervo e
   identifica trechos colados (texto de lei, julgado, nota ou caderno)
   ===================================================================== */
const normG = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim();
function palavrasDe(txt) {
  const o = [], w = [];
  // textos copiados do Planalto costumam vir sem espaço depois de ":", ";" e ")" — separa para não colar duas palavras
  const bruto = String(txt || '').replace(/([:;.,)\]])(?=[A-Za-zÀ-ÿ0-9])/g, '$1 ');
  for (const p of bruto.split(/\s+/)) { const n = normG(p); if (n) { o.push(p); w.push(n.replace(/ /g, '')); } }
  return { o, w };
}
function shingles(ws, n = 3) { const s = new Set(); for (let i = 0; i + n <= ws.length; i++) s.add(ws.slice(i, i + n).join(' ')); return s; }

/* ---------- índice do acervo ---------- */
let GIDX = null, GIDX_REV = -1, GIDX_N = 0;
/* assinatura barata do que o índice cobre: só reconstrói quando algum texto mudou de fato */
function gAssinatura() {
  let h = 0, n = 0;
  const mix = v => { h = (h * 33 + (v || 0)) | 0; };
  for (const l of S.leis) { n += l.itens.length; mix(l.itens.length); mix((l.epigrafe || '').length); mix(Date.parse(l.atualizadoEm || 0) / 60000 | 0); mix(((l.notasDoc || {}).conteudo || '').length);
    for (const a of l.itens) { if (a.tipo !== 'art') continue; mix((a.texto || '').length); mix(Date.parse(a.atualizadoEm || 0) / 60000 | 0); mix((a.notasList || []).length); mix((a.jurisList || []).length); } }
  for (const c of S.cadernos) { mix((c.conteudo || '').length); mix(Date.parse(c.atualizadoEm || 0) / 60000 | 0); }
  for (const p of (S.precedentes || [])) { mix((p.tese || '').length); mix(Date.parse(p.atualizadoEm || 0) / 60000 | 0); }
  return h + ':' + n;
}
function gIndice(forcar) {
  if (GIDX && !forcar && GIDX_REV === gAssinatura()) return GIDX;
  const ix = [];
  const add = (o) => { const p = palavrasDe(o.txt); if (!p.w.length) return; ix.push(Object.assign(o, { o: p.o, w: p.w, n: p.w.join(' ') })); };
  for (const l of S.leis) {
    add({ k: 'lei', leiId: l.id, tipo: 'Lei', rot: l.epigrafe, sub: l.sigla + ' — ' + l.nome, txt: `${l.epigrafe} ${l.nome} ${l.sigla} ${l.ementa || ''}` });
    for (const a of artigosDe(l)) {
      add({ k: 'art', leiId: l.id, artId: a.id, tipo: 'Artigo', rot: `${l.sigla}, ${artLabel(a)}`, sub: l.epigrafe, txt: plain(a.texto) });
      for (const nt of notasDe(a)) if (plain(nt.conteudo).trim()) add({ k: 'nota', leiId: l.id, artId: a.id, subId: nt.id, tipo: 'Nota', rot: nt.titulo || 'Nota', sub: `${l.sigla}, ${artLabel(a)}`, txt: plain(nt.conteudo) });
      for (const j of jurisDe(a)) if (plain(j.conteudo).trim()) add({ k: 'juris', leiId: l.id, artId: a.id, subId: j.id, tipo: tipoJurisAbrev(j.tipo), cor: tipoJurisCor(j.tipo), rot: j.titulo || 'Julgado', sub: `${l.sigla}, ${artLabel(a)}`, txt: plain(j.conteudo) });
    }
    if (l.notasDoc && plain(l.notasDoc.conteudo).trim()) add({ k: 'leinota', leiId: l.id, tipo: 'Nota da lei', rot: 'Notas', sub: l.epigrafe, txt: plain(l.notasDoc.conteudo) });
  }
  for (const pr of (S.precedentes || [])) add({ k: 'prec', precId: pr.id, tipo: tipoJurisAbrev(pr.tipo), cor: tipoJurisCor(pr.tipo), rot: precCurto(pr), sub: (ramoById(pr.ramo) || {}).nome || '', txt: `${precRotulo(pr)} ${pr.tese} ${pr.orgao} ${pr.fonte} ${(pr.tags || []).join(' ')}` });

}

/* ---------- busca ---------- */
function gProcurar(q) {
  const qp = palavrasDe(q), qw = qp.w;
  if (!qw.length) return { modo: null, res: [] };
  const ix = gIndice();
  const identificar = qw.length >= 6;
  if (!identificar) {
    const alvo = qw.join(' '), res = [];
    const casa = n => { let i = n.indexOf(alvo); while (i >= 0) { const antes = i === 0 || n[i - 1] === ' ', depois = i + alvo.length === n.length || n[i + alvo.length] === ' '; if (antes && depois) return i; i = n.indexOf(alvo, i + 1); } return -1; };
    for (const d of ix) {
      const i = casa(d.n);
      if (i < 0) continue;
      const pos = d.n.slice(0, i).split(' ').length - 1;
      res.push({ d, cob: 1, exato: true, ini: Math.max(0, pos), fim: Math.min(d.w.length - 1, pos + qw.length - 1), marcadas: new Set(Array.from({ length: qw.length }, (_, k) => pos + k)) });
      if (res.length > 400) break;
    }
    res.sort((a, b) => ordemTipo(a.d.k) - ordemTipo(b.d.k) || a.d.w.length - b.d.w.length);
    return { modo: 'texto', res: res.slice(0, 40), total: res.length };
  }
  const qs = shingles(qw);
  if (!qs.size) return { modo: 'texto', res: [], total: 0 };
  const amostra = [...qs], sondas = [];
  const passo = Math.max(1, Math.floor(amostra.length / 12));
  for (let i = 0; i < amostra.length; i += passo) sondas.push(amostra[i]);
  if (!sondas.includes(amostra[amostra.length - 1])) sondas.push(amostra[amostra.length - 1]);
  let cand = ix.filter(d => sondas.some(t => d.n.includes(t)));
  if (!cand.length) {
    /* reserva: nenhuma sonda casou (texto ainda não importado). Exige mais de uma palavra longa
       e limita o conjunto, senão em acervo grande isto varreria tudo a cada tecla */
    const longas = [...new Set(qw)].filter(w => w.length > 6).sort((a, b) => b.length - a.length).slice(0, 5);
    if (longas.length) {
      const min = ix.length > 2000 ? 2 : 1;
      cand = [];
      for (const d of ix) { let c = 0; for (const w of longas) if (d.n.includes(w)) c++; if (c >= Math.min(min, longas.length)) cand.push(d); if (cand.length >= 600) break; }
    } else cand = [];
  }
  const res = [];
  for (const d of cand) {
    const marcadas = new Set(); let hit = 0;
    const ds = new Map();
    for (let i = 0; i + 3 <= d.w.length; i++) { const t = d.w[i] + ' ' + d.w[i + 1] + ' ' + d.w[i + 2]; if (!ds.has(t)) ds.set(t, i); }
    for (const t of qs) { const i = ds.get(t); if (i !== undefined) { hit++; marcadas.add(i); marcadas.add(i + 1); marcadas.add(i + 2); } }
    if (!hit) continue;
    const cob = hit / qs.size;
    if (cob < 0.12) continue;
    const idx = [...marcadas].sort((a, b) => a - b);
    res.push({ d, cob, exato: d.n.includes(qw.join(' ')), ini: idx[0], fim: idx[idx.length - 1], marcadas });
  }
  res.sort((a, b) => b.cob - a.cob || (b.exato ? 1 : 0) - (a.exato ? 1 : 0) || ordemTipo(a.d.k) - ordemTipo(b.d.k));
  return { modo: 'trecho', res: res.slice(0, 25), total: res.length, qw };
}
const ordemTipo = k => ({ art: 0, juris: 1, prec: 2, nota: 3, cad: 4, lei: 5, leinota: 6 }[k] ?? 9);
function gTrecho(r, margem = 10) {
  const d = r.d, ini = Math.max(0, r.ini - margem), fim = Math.min(d.o.length - 1, r.fim + margem);
  let h = ini > 0 ? '… ' : '';
  for (let i = ini; i <= fim; i++) h += (r.marcadas.has(i) ? `<mark>${esc(d.o[i])}</mark>` : esc(d.o[i])) + ' ';
  return h.trim() + (fim < d.o.length - 1 ? ' …' : '');
}

/* ---------- painel ---------- */
let gTimer = null;
function gAbrir() { const p = $('#gspanel'); if (p) p.hidden = false; }
function gFechar() { const p = $('#gspanel'); if (p) p.hidden = true; UI.gSel = -1; }
function gRender() {
  const q = $('#gsearch').value, p = $('#gspanel');
  if (!q.trim()) { p.innerHTML = `<div class="gsp-dica"><b>Pesquisa em todo o acervo</b><span>Digite uma palavra ou expressão para procurar no texto das leis, nas notas, nos julgados e nos cadernos. <b>Cole um trecho inteiro</b> — de um acórdão, de uma petição, de um resumo — e o programa aponta de onde ele é e o quanto confere com o texto registrado aqui.</span></div>`; gAbrir(); return; }

    + `<div class="gsp-foot"><span><kbd>↑</kbd><kbd>↓</kbd> percorrer · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> fechar</span><button class="btn sm ghost" id="gsp-full">Abrir na Pesquisa</button></div>`;
  $$('.gsp-i', p).forEach(el => el.onclick = e => { if (e.target.closest('[data-cmp]')) return; gIr(+el.dataset.i); });
  $$('[data-cmp]', p).forEach(b => b.onclick = e => { e.stopPropagation(); gComparar(+b.dataset.cmp); });
  $$('[data-lado]', p).forEach(b => b.onclick = e => {

    gFechar();
    if (typeof verAoLado !== 'function') return;
    if (d.k === 'prec') verAoLado({ tipo: 'prec', precId: d.precId });
    else if (d.k === 'cad') verAoLado({ tipo: 'cad', cadId: d.cadId });
    else if (d.k === 'lei' || d.k === 'leinota') verAoLado({ tipo: 'lei', leiId: d.leiId });
    else verAoLado({ tipo: 'art', leiId: d.leiId, artId: d.artId });

}
function gIr(i) {
  const r = UI.gRes[i]; if (!r) return;
  const d = r.d; gFechar();
  if (d.k === 'prec') { UI.precQ = precCurto(precById(d.precId) || {}); UI.precRamo = ''; UI.precTipo = ''; showView('precedentes'); return; }
  if (d.k === 'cad') { openCad(d.cadId); return; }
  if (d.k === 'lei' || d.k === 'leinota') { openLeiHome(d.leiId); if (d.k === 'leinota') { UI.leiTab = 'notas'; renderReader(); } return; }

  openArt(d.leiId, d.artId, d.k === 'nota' ? 'notas' : d.k === 'juris' ? 'juris' : 'leitura');

function gSelecionar(d) {

/* ---------- comparação palavra por palavra ---------- */
function diffPalavras(a, b) {
  const n = a.length, m = b.length, LIM = 600;
  if (n > LIM || m > LIM) { a = a.slice(0, LIM); b = b.slice(0, LIM); }
  const A = a.length, B = b.length;
  const dp = Array.from({ length: A + 1 }, () => new Uint16Array(B + 1));
  for (let i = A - 1; i >= 0; i--) for (let j = B - 1; j >= 0; j--) dp[i][j] = normG(a[i]) === normG(b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < A && j < B) {
    if (normG(a[i]) === normG(b[j])) { out.push(['=', a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['-', a[i]]); i++; }
    else { out.push(['+', b[j]]); j++; }
  }
  while (i < A) out.push(['-', a[i++]]);
  while (j < B) out.push(['+', b[j++]]);
  return out;
}
function gComparar(i) {

  const d = r.d, colado = palavrasDe($('#gsearch').value).o;
  const ini = Math.max(0, r.ini - 3), fim = Math.min(d.o.length - 1, r.fim + 3);
  const registrado = d.o.slice(ini, fim + 1);
