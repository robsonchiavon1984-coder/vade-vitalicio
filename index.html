<title>Vade Mecum Vitalício</title>
<style>
:root{
  --bg:#eef0f7; --txt:#171a2b; --txt2:#4f566b; --txt3:#8087a0;
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.34); --glass3:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.85);
  --gb:rgba(255,255,255,.7); --gb2:rgba(120,130,170,.18); --line:rgba(110,120,160,.16); --line2:rgba(110,120,160,.3);
  --panel:rgba(255,255,255,.62); --panel2:rgba(255,255,255,.45);
  --pri:#4f46e5; --pri2:#6366f1; --pri-soft:rgba(99,102,241,.14); --pri-txt:#3730a3;
  --ok:#15803d; --ok-soft:rgba(34,197,94,.14); --warn:#b45309; --warn-soft:rgba(245,158,11,.16); --err:#dc2626; --err-soft:rgba(239,68,68,.13);
  --star:#f59e0b; --shadow:0 1px 1px rgba(20,24,60,.04),0 10px 30px -10px rgba(20,24,60,.18); --shadow2:0 20px 60px -20px rgba(20,24,60,.35);
  --r:18px; --fs:18px; --lh:1.75; --blur:blur(28px) saturate(170%);
  --read-font:"Source Serif Pro","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --blob1:#c7d2fe; --blob2:#fbcfe8; --blob3:#a5f3fc; --blob4:#fde68a;
}
[data-theme="escuro"]{
  --bg:#0b0d16; --txt:#e8eaf3; --txt2:#aab0c4; --txt3:#6f7691;
  --glass:rgba(24,27,42,.55); --glass2:rgba(24,27,42,.4); --glass3:rgba(30,33,52,.7); --glass-hi:rgba(255,255,255,.08);
  --gb:rgba(255,255,255,.1); --gb2:rgba(255,255,255,.07); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --panel:rgba(28,31,48,.62); --panel2:rgba(255,255,255,.05);
  --pri:#8b8cf7; --pri2:#a5a6ff; --pri-soft:rgba(139,140,247,.16); --pri-txt:#c7c8ff;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14); --err:#f87171; --err-soft:rgba(248,113,113,.14);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.6); --shadow2:0 20px 60px -20px rgba(0,0,0,.8);
  --blob1:#312e81; --blob2:#4a044e; --blob3:#164e63; --blob4:#3f2f0b;
}
[data-fonte="sans"]{ --read-font:var(--ui); }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-10%;z-index:-2;pointer-events:none;background:
  radial-gradient(45% 40% at 8% 5%,var(--blob1) 0%,transparent 70%),
  radial-gradient(40% 35% at 95% 15%,var(--blob2) 0%,transparent 70%),
  radial-gradient(45% 45% at 70% 95%,var(--blob3) 0%,transparent 70%),
  radial-gradient(30% 30% at 25% 90%,var(--blob4) 0%,transparent 70%),var(--bg);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2%,2%,0) scale(1.06)}}
@media (prefers-reduced-motion:reduce){body:before{animation:none}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pri);text-decoration:none}
::selection{background:#c7d2fe;color:#111}
[hidden]{display:none!important}
select option{color:#111;background:#fff}
[data-theme="escuro"] select option{color:#eee;background:#1c1f30}
.app{display:grid;grid-template-columns:236px 330px 1fr;grid-template-rows:calc(100vh - 20px);height:100vh;gap:10px;padding:10px}
.app.rail-collapsed{grid-template-columns:66px 330px 1fr}
.app.no-tree{grid-template-columns:236px 1fr}
.app.no-tree .tree{display:none}
.app.rail-collapsed.no-tree{grid-template-columns:66px 1fr}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);border-radius:var(--r)}
/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7 60%,#ec4899);display:grid;place-items:center;color:#fff;font-weight:800;flex:none;box-shadow:0 6px 16px -4px rgba(99,102,241,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.brand small{display:block;font-weight:500;color:var(--txt3);font-size:11px}
.rail nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;color:var(--txt2);font-weight:500;text-align:left;width:100%;position:relative;transition:.15s}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--glass2);color:var(--txt)}
.navbtn.active{background:var(--glass3);color:var(--pri-txt);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.navbtn .badge{margin-left:auto;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center}
.navbtn .kbd{margin-left:auto;font-size:10px;color:var(--txt3);border:1px solid var(--line2);border-radius:5px;padding:0 4px}
.rail .sec{padding:12px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3);display:flex;align-items:center;justify-content:space-between}
.rail .ramos{overflow:auto;flex:1;padding:0 10px 10px;min-height:0}
.ramobtn{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;color:var(--txt2);width:100%;text-align:left;font-size:13px;transition:.12s}
.ramobtn:hover{background:var(--glass2);color:var(--txt)}
.ramobtn.active{background:var(--glass3);color:var(--pri-txt);font-weight:600;box-shadow:var(--shadow)}
.ramobtn .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.ramobtn .n{margin-left:auto;font-size:11px;color:var(--txt3)}
.rail .foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.rail-collapsed .rail .brand span,.rail-collapsed .rail .navbtn span,.rail-collapsed .rail .sec,.rail-collapsed .rail .ramos,.rail-collapsed .navbtn .kbd,.rail-collapsed .foot .lbl{display:none}
.rail-collapsed .navbtn{justify-content:center;padding:10px}
.rail-collapsed .navbtn .badge{position:absolute;top:2px;right:6px}
/* ---------- tree ---------- */
.tree{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tree .top{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.tree .top h2{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.search{position:relative}
.search input{width:100%;border:1px solid var(--gb2);background:var(--glass2);border-radius:11px;padding:8px 10px 8px 32px;outline:none;transition:.15s}
.search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft);background:var(--glass3)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2}
.tree .list{overflow:auto;flex:1;padding:6px 8px 40px}
.lei{border-radius:12px;margin-bottom:2px}
.lei-h{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;cursor:pointer;transition:.12s}
.lei-h:hover{background:var(--glass2)}
.lei.open>.lei-h,.lei.cur>.lei-h{background:var(--glass3);box-shadow:var(--shadow)}
.lei-h .chev{width:14px;height:14px;stroke:var(--txt3);fill:none;stroke-width:2.2;flex:none;transition:transform .15s;padding:1px;border-radius:4px}
.lei-h .chev:hover{background:var(--pri-soft);stroke:var(--pri)}
.lei.open>.lei-h .chev{transform:rotate(90deg)}
.lei-h .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--txt3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -2px rgba(0,0,0,.4)}
.lei-h .t{flex:1;min-width:0}
.lei-h .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lei-h .t small{display:block;color:var(--txt3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lei-h .cnt{font-size:10.5px;color:var(--txt3);white-space:nowrap}
.lei-body{padding:2px 0 6px 10px}
.grp{margin-left:6px;border-left:1px solid var(--line2)}
.grp-h{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;cursor:pointer;color:var(--txt2);font-size:12px;font-weight:600;letter-spacing:.2px;border-radius:0 9px 9px 0}
.grp-h:hover{background:var(--glass2);color:var(--txt)}
.grp-h .chev{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none;transition:transform .15s}
.grp.open>.grp-h .chev{transform:rotate(90deg)}
.grp-h .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-h .lbl small{display:block;font-weight:500;color:var(--txt3);font-size:11px;text-transform:none;white-space:normal;line-height:1.25}
.grp-h .cnt{font-size:10.5px;color:var(--txt3);font-weight:500}
.grp-h .gedit{opacity:0;width:14px;height:14px;stroke:var(--txt3);fill:none;stroke-width:2;flex:none}
.grp-h:hover .gedit{opacity:1}
.grp-b{display:none}
.grp.open>.grp-b{display:block}
.artrow{display:flex;align-items:flex-start;gap:8px;padding:6px 8px 6px 14px;margin-left:6px;cursor:pointer;border-left:2px solid transparent;border-radius:0 9px 9px 0;transition:.12s}
.artrow:hover{background:var(--glass2)}
.artrow.active{background:var(--glass3);border-left-color:var(--pri);box-shadow:var(--shadow)}
.artrow .num{font-weight:700;font-size:12px;white-space:nowrap;color:var(--txt);min-width:52px}
.artrow.revogado .num{text-decoration:line-through;color:var(--txt3)}
.artrow .snip{flex:1;color:var(--txt3);font-size:11.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.artrow .st{font-size:10px;color:var(--star);white-space:nowrap;letter-spacing:-1px}
.artrow .nt{width:12px;height:12px;stroke:var(--pri);fill:none;stroke-width:2;flex:none;margin-top:2px}
.empty{color:var(--txt3);font-size:12.5px;padding:12px 14px;line-height:1.5}
.empty a{cursor:pointer}
/* cadernos tree */
.cnode{margin-left:0}
.cnode .cnode{margin-left:14px;border-left:1px solid var(--line2)}
.crow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:0 10px 10px 0;cursor:pointer;color:var(--txt2);font-size:13px;transition:.12s;border-left:2px solid transparent}
.crow:hover{background:var(--glass2);color:var(--txt)}
.crow.active{background:var(--glass3);color:var(--pri-txt);border-left-color:var(--pri);box-shadow:var(--shadow)}
.crow .chev{width:12px;height:12px;stroke:var(--txt3);fill:none;stroke-width:2.2;flex:none;transition:transform .15s}
.cnode.open>.crow .chev{transform:rotate(90deg)}
.crow .cico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.crow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.crow .st{font-size:10px;color:var(--star);letter-spacing:-1px}
.crow .cnt{font-size:10.5px;color:var(--txt3)}
.cnode>.cb{display:none}
.cnode.open>.cb{display:block}
.crow .gedit{opacity:0;width:14px;height:14px;stroke:var(--txt3);fill:none;stroke-width:2;flex:none}
.crow:hover .gedit{opacity:1}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--glass2)}
.topbar h1{font-size:14px;margin:0;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow:auto;min-height:0}
.view{display:none;padding:18px 22px 60px;max-width:1080px;margin:0 auto}
.view.active{display:block}
.view h2.vt{font-size:24px;margin:4px 0 4px;font-weight:800;letter-spacing:-.4px}
.view p.sub{margin:0 0 18px;color:var(--txt2)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gb2);background:var(--glass3);border-radius:11px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--txt);white-space:nowrap;transition:.15s;box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn:hover{background:var(--glass-hi);border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
[data-theme="escuro"] .btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:linear-gradient(180deg,var(--pri2),var(--pri));border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px rgba(79,70,229,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--txt2);box-shadow:none}
.btn.ghost:hover{background:var(--glass2);color:var(--txt);transform:none;box-shadow:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.ibtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--txt2);transition:.12s}
.ibtn:hover{background:var(--glass3);color:var(--txt);box-shadow:var(--shadow)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* reader */
.reader{max-width:980px;margin:0 auto;padding:22px 26px 80px}
.rhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.rhead .t{flex:1;min-width:0}
.rhead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;cursor:pointer}
.rhead h2:hover{color:var(--pri-txt)}
.rhead h2 small{font-weight:500;color:var(--txt3);font-size:13px;margin-left:8px}
.rhead .ementa{color:var(--txt2);font-size:13px;margin-top:3px;line-height:1.45}
.rhead .acts{display:flex;gap:4px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--glass2);border:1px solid var(--gb2);color:var(--txt2)}
.chip.ramo{color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.chip.tag{background:var(--pri-soft);color:var(--pri-txt);border-color:transparent;cursor:pointer}
.chip.tag .x{opacity:.5;font-weight:800;margin-left:2px}
.chip.tag .x:hover{opacity:1}
.chip.amostra{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tabs{display:flex;gap:2px;margin:14px 0 0;overflow-x:auto;background:var(--glass2);border:1px solid var(--gb2);border-radius:13px;padding:4px}
.tab{padding:7px 13px;border-radius:9px;color:var(--txt2);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.tab:hover{color:var(--txt);background:var(--glass2)}
.tab.active{color:var(--pri-txt);background:var(--glass-hi);font-weight:600;box-shadow:var(--shadow)}
[data-theme="escuro"] .tab.active{background:rgba(255,255,255,.12)}
.tab .n:empty{display:none}
.tab .n{background:var(--glass3);border:1px solid var(--gb2);border-radius:99px;font-size:10.5px;padding:0 6px;color:var(--txt2)}
.tab .n.hot{background:var(--err);color:#fff;border-color:transparent}
.pane{display:none;padding-top:14px}
.pane.active{display:block}
.card{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:16px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.card.p{padding:16px 18px}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:6px 8px;background:var(--glass3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:13px;position:sticky;top:0;z-index:5;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.tb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--txt2);font-weight:700;font-size:13px;position:relative;transition:.12s}
.tb:hover{background:var(--glass-hi);color:var(--txt);box-shadow:var(--shadow)}
[data-theme="escuro"] .tb:hover{background:rgba(255,255,255,.12)}
.tb.on{background:var(--pri-soft);color:var(--pri-txt)}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb u{text-decoration:underline}.tb s{text-decoration:line-through}.tb i{font-style:italic;font-family:Georgia,serif}
.tsep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.tbtxt{height:30px;border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--txt2);font-weight:500;font-size:12.5px;transition:.12s}
.tbtxt:hover{background:var(--glass-hi);color:var(--txt);box-shadow:var(--shadow)}
[data-theme="escuro"] .tbtxt:hover{background:rgba(255,255,255,.12)}
.tbtxt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtxt.save{background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 6px 16px -6px rgba(79,70,229,.7)}
.tbtxt.save:hover{filter:brightness(1.07)}
.tbtxt.save.clean{background:transparent;color:var(--txt3);box-shadow:none;border:1px solid var(--gb2)}
.palette{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 10px;margin-top:4px;background:var(--glass3);border:1px solid var(--gb);border-radius:11px}
.palette .lbl{width:22px;height:22px;display:grid;place-items:center;color:var(--txt3)}
.palette .lbl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.sw{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);cursor:pointer;transition:transform .1s;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.sw:hover{transform:scale(1.2)}
.sw.none{background:transparent;position:relative;border:1.5px solid var(--txt3)}
.sw.none:after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;background:var(--txt3);transform:rotate(-45deg)}
/* article */
.artbox{padding:8px 4px 0}
.artmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.artmeta .crumbs{font-size:11.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;flex-basis:100%}
.artmeta .crumbs span+span:before{content:"›";margin:0 6px;color:var(--line2)}
.artnum{font-size:15px;font-weight:800;letter-spacing:.2px}
.stars{display:inline-flex;gap:1px}
.stars button{font-size:19px;line-height:1;color:var(--line2);transition:.1s;padding:0 1px}
.stars button.on{color:var(--star);text-shadow:0 0 8px rgba(245,158,11,.45)}
.stars button:hover{transform:scale(1.15)}
.stars.sm button{font-size:13px}
.status{font-size:11px;font-weight:700;border-radius:7px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.status.vigente{background:var(--ok-soft);color:var(--ok)}
.status.revogado{background:var(--err-soft);color:var(--err)}
.status.vetado{background:var(--warn-soft);color:var(--warn)}
.status.alterado{background:var(--warn-soft);color:var(--warn)}
.status select{border:0;background:transparent;font-weight:700;font-size:11px;text-transform:uppercase;cursor:pointer;color:inherit;outline:none}
.edit{outline:none;min-height:120px;padding:14px 6px 20px;font-family:var(--read-font);font-size:var(--fs);line-height:var(--lh);color:var(--txt);word-wrap:break-word;border-radius:12px;transition:.15s}
.edit:focus{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--gb2)}
.edit.revogado{text-decoration:line-through;color:var(--txt3)}
.edit p{margin:0 0 .55em}
.edit a[data-ref]{color:var(--pri);border-bottom:1px dotted var(--pri);cursor:pointer}
.edit a[data-ref]:hover{background:var(--pri-soft)}
.edit mark{background:#fff3a3;padding:0 1px;border-radius:2px}
[data-theme="escuro"] .edit span[style*="background-color"]:not([style*=" color:"]):not([style^="color:"]){color:#111}
.edit ul,.edit ol{padding-left:1.4em}
.edit blockquote{border-left:3px solid var(--line2);margin:0;padding:2px 12px;color:var(--txt2)}
.edit h1,.edit h2,.edit h3{font-family:var(--ui);letter-spacing:-.3px;margin:.9em 0 .4em;line-height:1.25}
.edit h1{font-size:1.5em}.edit h2{font-size:1.25em}.edit h3{font-size:1.08em}
.edit table{border-collapse:collapse;font-size:.9em}.edit td,.edit th{border:1px solid var(--line2);padding:4px 8px}
.edit img{max-width:100%;border-radius:8px}
.edit.notes{font-size:calc(var(--fs) - 2px);min-height:220px}
.edit.cad{min-height:400px}
.edit[contenteditable="true"]:empty:before{content:attr(data-ph);color:var(--txt3);font-style:italic;font-family:var(--ui);font-size:14px}
.tags-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.tags-line input{border:1px dashed var(--line2);border-radius:99px;padding:2px 10px;background:transparent;font-size:12px;outline:none;width:150px}
.tags-line input:focus{border-color:var(--pri);border-style:solid;background:var(--glass3)}
.refs{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--txt3)}
.refs .chip{cursor:pointer}
.refs .chip:hover{border-color:var(--pri);color:var(--pri-txt)}
.artnav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.artnav .cur{font-weight:700;font-size:13px}
.artnav .btn{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.savebar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt3);margin-top:6px;min-height:18px}
.savebar .dirty{color:var(--warn);font-weight:600}
.savebar .saved{color:var(--ok);font-weight:600}
/* lists / cards */
.uplist{display:flex;flex-direction:column;gap:10px}
.upcard{border-left:4px solid var(--warn);padding:12px 14px}
.upcard.visto{opacity:.65;border-left-color:var(--line2)}
.upcard .h{display:flex;gap:8px;align-items:flex-start}
.upcard .h b{flex:1;font-weight:600;line-height:1.35}
.upcard .h time{font-size:11.5px;color:var(--txt3);white-space:nowrap}
.upcard .k{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.upcard .txt{font-size:13px;color:var(--txt2);line-height:1.5;margin-top:4px}
.upcard .txt.old{border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;font-family:var(--read-font);color:var(--txt);white-space:pre-wrap}
.upcard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bdg{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--txt3)}
.bdg.incluido{background:#2563eb}.bdg.alterado{background:#d97706}.bdg.revogado{background:#dc2626}.bdg.edicao{background:#64748b}.bdg.renumerado{background:#7c3aed}.bdg.correcao{background:#0d9488}
.linklist{display:flex;flex-direction:column;gap:6px}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--gb);border-radius:13px;background:var(--panel);transition:.15s}
.linkrow .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.linkrow .t{flex:1;min-width:0}
.linkrow .t b{display:block;font-size:13.5px}
.linkrow .t small{display:block;color:var(--txt3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .t em{color:var(--txt2);font-style:normal;font-size:12px;display:block;margin-top:2px}
.linkrow:hover{border-color:var(--pri);transform:translateY(-1px);box-shadow:var(--shadow)}
.linkrow.go{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,var(--pri),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--txt3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.result{padding:12px 14px;cursor:pointer;transition:.15s}
.result:hover{border-color:var(--pri);transform:translateY(-1px)}
.result .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.result .h b{font-size:13.5px}
.result .h small{color:var(--txt3)}
.result .snip{font-size:13px;color:var(--txt2);line-height:1.5;white-space:pre-line}
.result .snip mark,.hl{background:#fde68a;color:#111;padding:0 2px;border-radius:2px}
.result .where{font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.4px;color:var(--pri-txt);background:var(--pri-soft);border-radius:6px;padding:1px 6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.filters select,.filters input[type=text]{border:1px solid var(--gb2);border-radius:10px;padding:7px 10px;background:var(--glass3);outline:none}
.filters label{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:4px}
.bigsearch{position:relative;margin:8px 0 6px}
.bigsearch input{width:100%;border:1px solid var(--gb);background:var(--glass3);backdrop-filter:var(--blur);border-radius:16px;padding:14px 16px 14px 46px;font-size:16px;outline:none;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.bigsearch input:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.bigsearch svg{position:absolute;left:16px;top:16px;width:20px;height:20px;stroke:var(--txt3);fill:none;stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--gb2);border-radius:11px;overflow:hidden;background:var(--glass2);padding:3px;gap:2px}
.seg button{padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--txt2);border-radius:8px;transition:.12s}
.seg button.on{background:var(--glass-hi);color:var(--pri-txt);font-weight:600;box-shadow:var(--shadow)}
[data-theme="escuro"] .seg button.on{background:rgba(255,255,255,.12)}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagbig{border:1px solid var(--gb);background:var(--panel);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;transition:.15s}
.tagbig:hover{border-color:var(--pri);color:var(--pri-txt);transform:translateY(-1px)}
.tagbig .n{background:var(--pri-soft);color:var(--pri-txt);border-radius:99px;font-size:11px;padding:1px 7px}
/* flashcard */
.flash{max-width:720px;margin:20px auto;text-align:center;padding:36px 30px}
.flash .lei{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);font-weight:700}
.flash .num{font-size:30px;font-weight:800;margin:6px 0 4px}
.flash .cr{color:var(--txt2);font-size:13px;margin-bottom:18px}
.flash .body{font-family:var(--read-font);font-size:var(--fs);line-height:var(--lh);text-align:left;padding:14px 0;border-top:1px dashed var(--line2)}
.flash .acts{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--txt2)}
.form input[type=text],.form input[type=url],.form input[type=date],.form input[type=number],.form input[type=password],.form select,.form textarea{border:1px solid var(--gb2);border-radius:10px;padding:8px 10px;background:var(--glass3);outline:none;font-weight:400;color:var(--txt);width:100%}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.form textarea{min-height:110px;resize:vertical;font-family:var(--ui)}
.form textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:220px}
.form .row{display:flex;gap:10px}
.form .row>*{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px;font-weight:400}
.checks label{flex-direction:row;align-items:center;gap:5px;border:1px solid var(--gb2);border-radius:99px;padding:3px 10px 3px 6px;font-size:12px;font-weight:500;cursor:pointer;background:var(--glass2)}
.checks label:has(input:checked){background:var(--pri-soft);border-color:var(--pri);color:var(--pri-txt)}
.hint{font-size:12px;color:var(--txt3);font-weight:400;line-height:1.45}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,30,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.modal{background:var(--glass3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--shadow2),inset 0 1px 0 var(--glass-hi);width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
[data-theme="escuro"] .modal{background:rgba(24,27,42,.85)}
.modal.wide{width:min(960px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px 10px}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:6px 20px 16px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line)}
.modal .mf .left{margin-right:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,22,40,.85);backdrop-filter:blur(12px);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;z-index:99;pointer-events:none;box-shadow:var(--shadow2);border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:rgba(21,128,61,.9)}.toast.err{background:rgba(220,38,38,.9)}
.pick{max-height:280px;overflow:auto;border:1px solid var(--gb2);border-radius:11px;margin-top:6px;background:var(--glass2)}
.pick div{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.pick div:hover,.pick div.sel{background:var(--pri-soft);color:var(--pri-txt)}
.pick div small{color:var(--txt3);margin-left:6px}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
.kbdlist kbd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--glass3)}
.ramo-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ramo-row input[type=text]{flex:1;border:1px solid transparent;border-radius:6px;padding:4px 8px;background:transparent}
.ramo-row input[type=text]:focus{border-color:var(--pri);background:var(--glass3);outline:none}
.ramo-row input[type=color]{width:26px;height:26px;border:0;background:none;padding:0;cursor:pointer}
.mini{font-size:12px;color:var(--txt3)}
.dashrow{display:flex;gap:12px;margin-top:14px}
.dashrow>.card{flex:1;min-width:0}
.dash-list a{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--txt);cursor:pointer}
.dash-list a:last-child{border-bottom:0}
.dash-list a b{font-size:13px}
.dash-list a small{color:var(--txt3);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.warnbox{background:var(--warn-soft);border:1px solid rgba(245,158,11,.4);color:#7c4a03;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.5}
[data-theme="escuro"] .warnbox{color:#fbd38d}
/* lei home */
.lhome .hero{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.lhome .hero .card{flex:1;min-width:220px}
.sumario{padding:6px 4px}
.snode{margin-left:0}
.snode .snode{margin-left:16px;border-left:1px solid var(--line2);padding-left:4px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13px;transition:.12s}
.srow:hover{background:var(--glass3)}
.srow .chev{width:12px;height:12px;stroke:var(--txt3);fill:none;stroke-width:2.2;flex:none;transition:transform .15s}
.snode.open>.srow .chev{transform:rotate(90deg)}
.srow .rot{font-weight:700;letter-spacing:.3px;font-size:12px;text-transform:uppercase;color:var(--txt)}
.srow .tit{color:var(--txt2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cnt{font-size:11px;color:var(--txt3);white-space:nowrap}
.srow .rng{font-size:11px;color:var(--pri-txt);background:var(--pri-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.snode>.sb{display:none}
.snode.open>.sb{display:block}
.sart{display:flex;gap:8px;align-items:baseline;padding:4px 8px 4px 28px;font-size:12.5px;cursor:pointer;border-radius:8px;color:var(--txt2)}
.sart:hover{background:var(--glass3);color:var(--txt)}
.sart b{color:var(--txt);white-space:nowrap}
.sart span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sart .st{color:var(--star);font-size:10px;letter-spacing:-1px}
.sart svg{width:12px;height:12px;stroke:var(--pri);fill:none;stroke-width:2;flex:none}

/* ================= editor de documentos (cadernos) ================= */
.docbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px;background:var(--glass3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:13px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);position:sticky;top:0;z-index:6;margin-bottom:8px}
.docbar.tblbar{top:52px;z-index:5;background:var(--pri-soft)}
.dsel{border:1px solid var(--gb2);background:var(--glass2);border-radius:8px;padding:5px 6px;font-size:12.5px;outline:none;max-width:160px;color:var(--txt)}
.dsel:focus{border-color:var(--pri)}
.dsel.fam{min-width:118px}.dsel.esp{width:96px}.dsel.zoom{width:78px}.dsel.tam{width:74px;text-align:center}
.dnum{width:54px;text-align:center;border:1px solid var(--gb2);background:var(--glass2);border-radius:8px;padding:5px 4px;font-size:12.5px;outline:none;color:var(--txt)}
.tamgrp{display:flex;align-items:center;gap:2px}
.docwrap{display:grid;grid-template-columns:218px 1fr;gap:12px;align-items:start}
.docwrap.sem-nav{grid-template-columns:1fr}
.docwrap.sem-nav .docnav{display:none}
.docnav [data-h].aqui{background:var(--pri-soft);color:var(--pri-txt);font-weight:700}
.folha .piscando{animation:pisca 1.2s ease}
@keyframes pisca{0%,100%{background:transparent}20%,60%{background:var(--pri-soft)}}
.docnav{position:sticky;top:60px;max-height:calc(100vh - 320px);overflow:auto;background:var(--glass2);border:1px solid var(--gb2);border-radius:12px;padding:10px}
.dnh{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px;font-size:13px}
.dnl{display:flex;flex-direction:column;gap:1px}
.dnl a{display:block;padding:4px 7px;border-radius:7px;font-size:12.5px;color:var(--txt2);cursor:pointer;line-height:1.3;border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis}
.dnl a:hover{background:var(--glass3);color:var(--pri-txt);border-left-color:var(--pri)}
.dnl a.n1{font-weight:700;color:var(--txt)}
.dnl a.n2{margin-left:10px}.dnl a.n3{margin-left:20px;font-size:12px}.dnl a.n4{margin-left:30px;font-size:11.5px}
.docmain{min-width:0}
.folha-area{overflow:auto;background:var(--glass2);border:1px solid var(--gb2);border-radius:12px;padding:14px;max-height:calc(100vh - 335px);min-height:320px}
.docz{width:max-content;margin:0 auto}
.regua{margin:0 auto 8px}
.rbar{position:relative;height:20px;background:var(--glass3);border:1px solid var(--gb2);border-radius:5px}
.rmarg{position:absolute;top:0;bottom:0;background:rgba(120,130,170,.25)}
.tick{position:absolute;top:11px;bottom:2px;width:1px;background:var(--txt3);opacity:.35}
.tick.maj{top:6px;opacity:.6}
.tick i{position:absolute;left:2px;top:-7px;font-style:normal;font-size:8px;color:var(--txt3)}
.rm{position:absolute;width:0;height:0;cursor:ew-resize;z-index:2;margin-left:-5px}
.rm-first{top:0;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--pri)}
.rm-left,.rm-right{bottom:0;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid var(--pri)}
.folha-wrap{position:relative}
.folha{background:#fff;color:#111;box-shadow:0 6px 28px rgba(20,24,60,.22);outline:none;box-sizing:border-box;position:relative;z-index:1}
.papel-tema .folha{background:var(--panel);color:var(--txt);backdrop-filter:blur(10px)}
.guias{position:absolute;inset:0;pointer-events:none;z-index:2}
.guia{position:absolute;left:0;right:0;border-top:1px dashed rgba(99,102,241,.55)}
.guia span{position:absolute;right:5px;top:2px;font-size:8px;color:var(--pri);background:var(--glass3);padding:0 3px;border-radius:3px}
.docstatus{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt3);padding:8px 4px 0}
.docstatus span:last-child{margin-left:auto}
.folha p{margin:0 0 6pt}
.folha h1,.folha h2,.folha h3,.folha h4,.folha h5{font-family:inherit;margin:12pt 0 6pt;line-height:1.25;font-weight:700}
.folha h1{font-size:1.45em}.folha h2{font-size:1.25em}.folha h3{font-size:1.1em}.folha h4{font-size:1em;font-style:italic}
.folha blockquote{margin:0 0 6pt 4cm;font-size:.85em;border:0;padding:0;color:inherit}
.folha pre{font-family:Consolas,ui-monospace,monospace;font-size:.9em;background:rgba(0,0,0,.05);padding:6pt;border-radius:4px;white-space:pre-wrap;margin:0 0 6pt}
.folha table{border-collapse:collapse;margin:6pt 0;max-width:100%}
.folha table.dtab td,.folha table.dtab th{border:.75pt solid #555;padding:3pt 5pt;vertical-align:top}
.folha table.dtab.sb td,.folha table.dtab.sb th{border:none}
.folha th{background:rgba(0,0,0,.06);font-weight:700}
.folha ul,.folha ol{margin:0 0 6pt;padding-left:1.2cm}
.folha a[data-ref]{color:#1d4ed8;border-bottom:1px dotted #1d4ed8;cursor:pointer}
.papel-tema .folha a[data-ref]{color:var(--pri)}
.folha img{max-width:100%;height:auto}
.folha .quebra-pag{border-top:1px dashed #aaa;color:#999;font-size:8pt;text-align:center;margin:8pt 0;user-select:none}
.folha .sumario-doc{border:.75pt solid #ccc;padding:8pt 12pt;margin:0 0 8pt}
.folha .sumario-doc p{margin:0 0 2pt}
.folha .sumario-doc .st{font-weight:700;text-align:center;margin-bottom:6pt}
.folha .sumario-doc .s2{margin-left:.7cm}.folha .sumario-doc .s3{margin-left:1.4cm}.folha .sumario-doc .s4{margin-left:2.1cm}
.tbgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:280px}
.tbgrid span{aspect-ratio:1;border:1px solid var(--line2);border-radius:2px;cursor:pointer}
.tbgrid span.on{background:var(--pri-soft);border-color:var(--pri)}
.palgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.palgrid .pg{height:30px;border-radius:7px;border:1px solid var(--line2);cursor:pointer}
.palgrid .pg:hover{transform:scale(1.1)}
.simgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.simgrid button{height:36px;border:1px solid var(--gb2);border-radius:8px;font-size:16px;background:var(--glass2)}
.simgrid button:hover{background:var(--pri-soft)}
.reader.wide{max-width:1580px;padding:16px 18px 30px}
.docwrap:fullscreen{background:var(--bg);padding:14px;overflow:auto}
.docwrap:fullscreen .folha-area{max-height:calc(100vh - 40px)}
.docwrap:-webkit-full-screen{background:var(--bg);padding:14px;overflow:auto}
html.m .docwrap{grid-template-columns:1fr}
html.m .docnav{position:static;max-height:200px}
html.m .folha-area{max-height:none;padding:8px}
html.m .docbar{position:static;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:5px 6px}
html.m .docbar>*{flex:none}
html.m .dsel{max-width:110px}
html.m .dsel.fam{min-width:96px}
html.m .docbar.tblbar{top:auto}
@media print{.docbar,.docnav,.regua,.guias,.docstatus{display:none!important}.folha-area{max-height:none;overflow:visible;padding:0;background:none;border:0}.docz{zoom:1!important;width:auto}.docwrap{display:block}.folha{box-shadow:none;width:auto!important;min-height:0!important;padding:0!important;background:#fff!important;color:#000!important}}

/* notas múltiplas */
.notabar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.notatabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.notatab{border:1px solid var(--gb2);background:var(--glass2);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--txt2);border-left:3px solid var(--c,var(--pri));transition:.12s;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notatab:hover{background:var(--glass3);color:var(--txt)}
.notatab.on{background:var(--glass-hi);color:var(--txt);box-shadow:var(--shadow)}
[data-theme="escuro"] .notatab.on{background:rgba(255,255,255,.12)}
.notatab i{font-style:normal;font-weight:400;opacity:.45}
.notatab.add{border-left-color:transparent;border-style:dashed;color:var(--pri-txt)}
.notatab.add svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-1px}
.notaops{display:flex;gap:1px;flex:none}
.notaops .ibtn{width:28px;height:28px;border-radius:7px}
.notaops .ibtn svg{width:14px;height:14px}
/* reordenação das leis */
.lei .grip{color:var(--txt3);cursor:grab;font-size:13px;width:14px;text-align:center;flex:none}
.lei.org .lei-h{cursor:grab}
.lei.arrastando{opacity:.4}
.lei.dz-a{box-shadow:inset 0 3px 0 var(--pri)}
.lei.dz-b{box-shadow:inset 0 -3px 0 var(--pri)}
.ibtn.on{background:var(--pri-soft);color:var(--pri-txt)}
.org-list{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:3px;margin-top:10px}
.org-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--gb2);border-radius:10px;background:var(--glass2)}
.org-row .grip{cursor:grab;color:var(--txt3)}
.org-row .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:10px;flex:none}
.org-row .t{flex:1;min-width:0}
.org-row .t b{display:block;font-size:13px}
.org-row .t small{display:block;color:var(--txt3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-row .ops{display:flex;gap:1px}
.org-row .ops .ibtn{width:26px;height:26px}
.org-row .ops .ibtn svg{width:14px;height:14px}
.org-row.arrastando{opacity:.4}
.org-row.dz-a{border-top:3px solid var(--pri)}
.org-row.dz-b{border-bottom:3px solid var(--pri)}
/* editor em modo contínuo */
.docwrap.cont .folha-area{max-height:none;min-height:0;padding:0;background:transparent;border:0;overflow:visible}
.docwrap.cont .folha{box-shadow:none;border:1px solid var(--gb2);border-radius:12px;background:var(--panel);color:var(--txt)}
.docwrap.cont .docz{width:auto}
.docwrap.cont .docnav{top:56px;max-height:60vh}
/* editor de estrutura */
.stlist{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.strow,.strun{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;margin-left:calc(var(--d) * 16px);transition:.12s;border:1px solid transparent}
.strow{background:var(--glass2)}
.strow:hover,.strun:hover{background:var(--glass3);border-color:var(--gb2)}
.strow.aviso{border-color:rgba(245,158,11,.5)}
.strow .lvl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--pri);border-radius:5px;padding:2px 5px;flex:none;opacity:.85}
.strow[style*="--d:0"] .lvl{background:#4f46e5}.strow[style*="--d:1"] .lvl{background:#7c3aed}.strow[style*="--d:2"] .lvl{background:#0891b2}.strow[style*="--d:3"] .lvl{background:#059669}.strow[style*="--d:4"] .lvl{background:#b45309}.strow[style*="--d:5"] .lvl{background:#be123c}
.strow .txt{flex:1;min-width:0;font-size:13px;line-height:1.35}
.strow .txt b{font-weight:700}
.strow .txt span{color:var(--txt2)}
.strow .txt em{display:block;font-style:normal;font-size:11px;color:var(--warn);margin-top:2px}
.strow .rng{font-size:11px;color:var(--pri-txt);background:var(--pri-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.strow .cnt{font-size:11px;color:var(--txt3);white-space:nowrap}
.strow .acts,.strun .acts{display:flex;gap:1px;flex:none;opacity:.35;transition:.12s}
.strow:hover .acts,.strun:hover .acts,html.m .strow .acts,html.m .strun .acts{opacity:1}
.strow .acts .ibtn{width:26px;height:26px;border-radius:7px;font-size:13px}
.strow .acts .ibtn svg{width:14px;height:14px}
.strun{font-size:12.5px;color:var(--txt2);border-left:2px dashed var(--line2)}
.strun .ico{color:var(--txt3);font-size:14px}
.strun .txt{flex:1;min-width:0}
html.m .strow,html.m .strun{flex-wrap:wrap;margin-left:calc(var(--d) * 9px)}
html.m .strow .txt,html.m .strun .txt{flex-basis:100%;order:2}
html.m .strow .acts,html.m .strun .acts{order:3;margin-left:auto}
/* IA */
.ia-wrap{display:flex;flex-direction:column;gap:10px}
.ia-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ia-bar select{border:1px solid var(--gb2);border-radius:10px;padding:6px 10px;background:var(--glass3);outline:none;font-size:12.5px;max-width:320px}
.ia-presets{display:flex;flex-wrap:wrap;gap:6px}
.ia-chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{padding:12px 14px;border-radius:16px;max-width:92%;line-height:1.55;font-size:14px;position:relative}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 20px -10px rgba(79,70,229,.7)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--gb);border-bottom-left-radius:6px;backdrop-filter:blur(14px)}
.msg.ai .meta{font-size:10.5px;color:var(--txt3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.msg.ai .body p{margin:0 0 .6em}.msg.ai .body p:last-child{margin:0}
.msg.ai .body ul,.msg.ai .body ol{padding-left:1.3em;margin:.3em 0}
.msg.ai .body h1,.msg.ai .body h2,.msg.ai .body h3{font-size:1.02em;margin:.7em 0 .3em}
.msg.ai .body code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--glass2);padding:0 4px;border-radius:4px}
.msg.ai .body pre{background:var(--glass2);padding:8px 10px;border-radius:8px;overflow:auto;font-size:.85em}
.msg.ai .body table{border-collapse:collapse;font-size:.92em;margin:.4em 0}.msg.ai .body td,.msg.ai .body th{border:1px solid var(--line2);padding:3px 8px}
.msg.ai .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.msg.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.ia-in{display:flex;gap:8px;align-items:flex-end;background:var(--glass3);border:1px solid var(--gb);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.ia-in textarea{flex:1;border:0;background:transparent;outline:none;resize:none;min-height:24px;max-height:160px;font-family:var(--ui);line-height:1.45;padding:4px 0}
.ia-in .btn.pri{border-radius:12px}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ia-ctx{font-size:11.5px;color:var(--txt3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ia-ctx label{display:flex;gap:4px;align-items:center;cursor:pointer}
/* ---------- parte 9: concursos, cronograma e calendário ---------- */
.inp{border:1px solid var(--gb2);border-radius:10px;padding:8px 10px;background:var(--glass3);outline:none;font-weight:400;color:var(--txt);font-family:var(--ui);font-size:13px;width:100%}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp.num{text-align:right}
.inp.flat{border-color:transparent;background:transparent;padding:5px 6px;border-radius:7px}
.inp.flat:hover{background:var(--glass2)}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow>label{flex:1;min-width:140px}
.fs{border:1px solid var(--gb2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fs legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);padding:0 5px}
.vhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.vhead>div:first-child{flex:1;min-width:220px}
.vhead .vt,.vhead .sub{margin-bottom:2px}
.sech{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.sech .mini{text-transform:none;letter-spacing:0;font-weight:500}
.rowbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card.co{display:flex;flex-direction:column;gap:9px;border-top:3px solid var(--cc,var(--pri))}
.co-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-top b{font-size:14.5px}
.co .cd{display:flex;align-items:center;gap:12px;background:var(--glass2);border-radius:12px;padding:10px 12px}
.co .cd b{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--pri-txt)}
.co .cd span{font-size:12px;color:var(--txt2);line-height:1.4}
.co .cd i{color:var(--txt3);font-style:normal;font-size:11.5px}
.co .cd.sem{color:var(--txt3);font-size:12.5px}
.alerta{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600}
.card.stat.alerta b{background:none;color:var(--warn);-webkit-text-fill-color:var(--warn)}
.fases{display:flex;flex-direction:column;gap:3px}
.fase{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:9px;cursor:pointer;font-size:12.5px}
.fase:hover{background:var(--glass2)}
.fase i{width:8px;height:8px;border-radius:50%;flex:none}
.fase b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fase span{color:var(--txt2);font-variant-numeric:tabular-nums}
.fase small{color:var(--txt3)}
.fase.feito{opacity:.5;text-decoration:line-through}
.co .obs{white-space:pre-wrap;line-height:1.5;border-left:2px solid var(--line2);padding-left:9px}
.co-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.hoje{background:var(--pri-soft);color:var(--pri-txt);border-color:transparent}
.chip.fut{background:var(--glass2);color:var(--txt3)}
.chip.redist{background:rgba(14,165,233,.15);color:#0369a1;border-color:transparent}
.chip.st-inscrito,.chip.st-estudando{background:var(--pri-soft);color:var(--pri-txt);border-color:transparent}
.chip.st-concluido{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.st-arquivado{opacity:.6}
.pbar{height:7px;border-radius:99px;background:var(--glass2);overflow:hidden;border:1px solid var(--gb2)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:99px}
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(140px,1.3fr) minmax(80px,1fr) auto auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.d7{grid-template-columns:130px 1fr auto}
.lrow .nm b{font-size:13px;display:block}
.lrow .nm small{color:var(--txt3);font-size:11.5px}
.lrow .pc{font-variant-numeric:tabular-nums;white-space:nowrap}
/* blocos de estudo */
.blk{background:var(--panel);border:1px solid var(--gb);border-left:3px solid var(--txt3);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.blk.st-done{border-left-color:var(--ok)}
.blk.st-partial{border-left-color:var(--warn)}
.blk.st-missed{border-left-color:var(--err)}
.blk.st-today{border-left-color:var(--pri)}
.blk.st-redist{border-left-color:#0ea5e9}
.blk-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.blk-top b{font-size:14px}
.blk-meta{font-size:12px;color:var(--txt2);margin-top:3px}
.blk-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;margin:8px 0;background:var(--glass2);gap:1px}
.blk-bar span{background:linear-gradient(180deg,var(--pri2),var(--pri));opacity:.85}
.blk-bar span:nth-child(2n){opacity:.55}
.blk-list{list-style:none;display:flex;flex-direction:column;gap:3px;margin:0;padding:0}
.blk-list li{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.blk-list li:last-child{border-bottom:0}
.blk-list li span{flex:1;min-width:0}
.blk-list li b{color:var(--txt2);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.blk-list .lnk{color:var(--pri-txt);cursor:pointer;border-bottom:1px dotted var(--line2)}
.blk-list .lnk:hover{border-bottom-style:solid}
.blk-list .est{color:var(--warn);font-style:normal;font-weight:700}
.blk-act{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.blk-act input[type=number]{width:84px}
/* calendário */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-nav b{flex:1;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);text-align:center;padding-bottom:2px}
.cal-c{min-height:64px;border:1px solid var(--gb2);border-radius:10px;padding:4px 5px;background:var(--glass2);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:.12s;overflow:hidden}
.cal-c:hover{background:var(--glass-hi);border-color:var(--line2);transform:translateY(-1px)}
.cal-c.off{border:0;background:transparent;cursor:default;min-height:0}
.cal-c.vazio{opacity:.55}
.cal-c.hoje{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft) inset}
.cal-c .n{font-size:12px;font-weight:700;color:var(--txt2);font-variant-numeric:tabular-nums}
.cal-c.hoje .n{color:var(--pri-txt)}
.cal-ev{display:block;font-size:9.5px;font-weight:700;border:1px solid;border-radius:5px;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.cal-ev.mais{border-color:var(--line2);color:var(--txt3);background:transparent}
.cal-c .pts{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.pt{width:7px;height:7px;border-radius:50%;background:var(--txt3);display:inline-block;flex:none}
.pt.done{background:var(--ok)}.pt.partial{background:var(--warn)}.pt.missed{background:var(--err)}
.pt.today{background:var(--pri)}.pt.future{background:var(--line2)}.pt.redist{background:#0ea5e9}
.pt.mais{width:auto;height:auto;border-radius:4px;font-size:8px;font-weight:700;color:var(--txt3);background:transparent;line-height:1}
.cal-leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--txt3);align-items:center}
.cal-leg span{display:flex;align-items:center;gap:4px}
.pto{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.agrow{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start}
.ev-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ev{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-left:3px solid var(--pri);background:var(--glass2);border-radius:10px;padding:8px 11px;font-size:13px}
.ev b{flex:1;min-width:120px}
/* itens e pesos */
.discbox{border:1px solid var(--gb2);border-radius:13px;margin-bottom:7px;overflow:hidden;background:var(--panel2)}
.discbox .disc-hd{display:flex;align-items:baseline;gap:10px;padding:10px 13px;cursor:pointer;flex-wrap:wrap}
.discbox .disc-hd:hover{background:var(--glass2)}
.discbox .disc-hd b{font-size:13.5px}
.discbox .disc-hd .mini{margin-left:auto}
.discbox .disc-bd{display:none}
.discbox.open .disc-bd{display:block;border-top:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:2px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .acts{white-space:nowrap;text-align:right}
.dash-list a .pto{margin-right:2px}
@media (max-width:900px){.agrow{grid-template-columns:1fr}.cal-c{min-height:52px}}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,var(--pri-soft),transparent 70%),var(--panel);border:1px solid var(--gb);border-radius:16px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.hero .hd-cd{display:flex;align-items:baseline;gap:6px}
.hero .hd-cd b{font-size:40px;font-weight:800;letter-spacing:-1.6px;line-height:1;background:linear-gradient(135deg,var(--pri),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .hd-cd span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3)}
.hero .hd-tx{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.hero .hd-tx b{font-size:14.5px}
.hero .hd-tx span{font-size:12.5px;color:var(--txt2);line-height:1.45}
.hero.vazio{background:var(--panel)}
.dashgrid{display:grid;grid-template-columns:minmax(340px,1.15fr) minmax(300px,1fr);gap:12px;align-items:start;margin-top:14px}
.dashgrid .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.dashgrid .blk{margin-bottom:8px}
@media (max-width:1080px){.dashgrid{grid-template-columns:1fr}}
.tcols{columns:4 200px;column-gap:20px}
.tgrp{break-inside:avoid;display:block;margin:0 0 16px}
.tgrp h4{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--pri-txt);background:var(--pri-soft);border-radius:6px;padding:2px 7px;display:inline-block;margin-bottom:4px}
.titem{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:8px;cursor:pointer;font-size:13px;transition:.12s;break-inside:avoid}
.titem:hover{background:var(--glass3);color:var(--pri-txt);box-shadow:var(--shadow)}
.titem>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .n{background:var(--glass2);color:var(--txt3);border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 6px;flex:none}
.titem:hover .n{background:var(--pri-soft);color:var(--pri-txt)}
.tcols.simples{columns:4 180px}
.tramo{margin-bottom:20px}
.tramo h3{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.tramo h3 .dot{width:10px;height:10px;border-radius:50%;flex:none}
.tramo h3 .mini{margin-left:auto;font-weight:500}
@media (max-width:760px){.tcols{columns:1}}
/* ---------- parte 10: vínculos abaixo do artigo ---------- */
.vinc{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.vsec{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px}
.vlab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--txt3);margin-right:2px;flex:0 0 auto;min-width:112px}
.vsec .mini{color:var(--txt3)}
.vchip{cursor:pointer;padding-right:3px;transition:.14s;max-width:340px}
.vchip:hover{border-color:var(--pri);color:var(--pri-txt);background:var(--glass3)}
.vchip.on{background:var(--pri);color:#fff;border-color:transparent;box-shadow:0 4px 12px -5px rgba(79,70,229,.8)}
.vchip.on .x{color:rgba(255,255,255,.75)}
.vchip.quebrada{color:var(--err);border-color:var(--err);cursor:default}
.vchip .ob{color:var(--warn);font-style:normal;font-weight:800}
.vchip .x{opacity:0;margin-left:2px;padding:0 4px;border-radius:6px;font-weight:800;color:var(--txt3);line-height:1}
.vchip:hover .x{opacity:1}
.vchip .x:hover{background:var(--err-soft);color:var(--err)}
.vsec .btn.sm{font-size:11.5px;padding:3px 8px}
.vprev{border:1px solid var(--gb);background:var(--panel);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);margin-top:3px;animation:vpin .18s ease}
@keyframes vpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.vp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.vp-head b{font-size:14px}
.vp-crumbs{margin-bottom:6px;font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-family:var(--ui)}
.vp-crumbs span+span:before{content:"›";margin:0 6px;color:var(--line2)}
.vp-obs{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:5px 9px;margin-bottom:8px}
.vp-corpo{font-family:var(--read-font);font-size:calc(var(--fs) - 1px);line-height:1.6;max-height:340px;overflow:auto;color:var(--txt)}
.vp-corpo p{margin:0 0 8px}
.vp-corpo table{border-collapse:collapse}
.vp-corpo td,.vp-corpo th{border:1px solid var(--line2);padding:4px 7px}
.vp-extra{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2);font-size:13px;line-height:1.55}
.vp-extra>b{font-family:var(--ui);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3)}
.vprev.solta .vp-corpo{max-height:52vh}
@media (max-width:760px){.vlab{min-width:100%;margin-bottom:-2px}.vchip{max-width:100%}}
.vchip.juris{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.vchip.juris .tj{width:7px;height:7px;border-radius:2px;background:var(--tc);display:inline-block;margin-right:2px;flex:none}
.vchip.juris .jt{font-weight:500;opacity:.85}
.vchip.juris .vz{font-style:italic;opacity:.6;font-weight:500}
.vchip.juris:hover{background:color-mix(in srgb,var(--tc) 20%,transparent);border-color:var(--tc)}
.vchip.juris.on{background:var(--tc);color:#fff;border-color:transparent}
.vchip.juris.on .tj{background:rgba(255,255,255,.85)}
.notatab .tj{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px;flex:none;vertical-align:middle}
.jr-tipo{width:auto;max-width:210px;font-size:11.5px;padding:4px 7px;border-radius:8px;border-color:var(--c);color:var(--c);font-weight:600}
.tj-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding-right:2px}
.tj-row{display:flex;gap:7px;align-items:center}
.tj-row .inp{padding:5px 8px;font-size:12.5px}
.tj-vinc{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--txt2);white-space:nowrap;cursor:pointer;font-weight:500}
/* ---------- parte 11: pesquisa permanente ---------- */
.gsbox{position:relative;flex:1;max-width:560px;min-width:150px;display:flex;align-items:center;gap:6px;border:1px solid var(--gb2);background:var(--glass3);border-radius:12px;padding:0 8px;transition:.15s}
.gsbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft);background:var(--glass-hi)}
.gsbox .lupa{width:15px;height:15px;stroke:var(--txt3);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.gsbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--ui);font-size:13px;color:var(--txt);padding:7px 0}
.gsbox input::-webkit-search-cancel-button{display:none}
.gsbox #gs-x{opacity:0;font-size:12px;color:var(--txt3);flex:none}
.gsbox:focus-within #gs-x{opacity:1}
.gsp{position:absolute;top:calc(100% + 7px);left:-60px;right:-20px;z-index:60;background:linear-gradient(var(--glass-hi),var(--glass-hi)),var(--bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:16px;box-shadow:var(--shadow2);overflow:hidden;animation:vpin .16s ease;max-height:min(620px,72vh);display:flex;flex-direction:column}
.gsp-head{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--glass2)}
.gsp-head b{font-size:12.5px}
.gsp-head span{font-size:11.5px;color:var(--txt3)}
.gsp-dica{padding:14px 16px;font-size:12.5px;line-height:1.55;color:var(--txt2)}
.gsp-dica b{display:block;color:var(--txt);font-size:13px;margin-bottom:3px}
.gsp-dica span b{display:inline;font-size:inherit;margin:0}
.gsp-list{overflow:auto;padding:4px}
.gsp-i{padding:8px 11px;border-radius:11px;cursor:pointer;border-bottom:1px solid var(--line)}
.gsp-i:last-child{border-bottom:0}
.gsp-i:hover,.gsp-i.sel{background:var(--glass-hi);box-shadow:var(--shadow)}
.gsp-t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.gsp-t b{font-size:13px}
.gsp-t .chip.tp{font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.gsp-s{font-size:12.5px;line-height:1.5;color:var(--txt2);font-family:var(--read-font);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gsp-s mark{background:var(--pri-soft);color:var(--pri-txt);border-radius:3px;padding:0 1px;font-weight:600}
.gsp-foot{padding:7px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:11px;color:var(--txt3);background:var(--glass2)}
.gsp-foot>span{flex:1;display:flex;align-items:center;gap:4px}
.gsp-foot kbd{font-family:ui-monospace,Menlo,monospace;font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:var(--glass3)}
.cmp-cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cmp-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt3);margin-bottom:9px}
.cmp-leg i{font-style:normal;margin-right:3px}
.cmp-txt{font-family:var(--read-font);font-size:14.5px;line-height:1.75;max-height:48vh;overflow:auto;padding:12px 14px;border:1px solid var(--gb2);border-radius:12px;background:var(--glass2)}
.cmp-txt .ctx{color:var(--txt3);opacity:.65}
.cmp-leg i.ctx{font-style:normal;color:var(--txt3)}
.df.del{background:rgba(239,68,68,.16);color:var(--err);border-radius:3px;padding:0 2px;text-decoration:line-through}
.df.add{background:rgba(34,197,94,.18);color:var(--ok);border-radius:3px;padding:0 2px}
html.m .gsbox{display:none}
@media (max-width:1000px){.gsbox{max-width:none}.gsbox input{font-size:12.5px}}
/* ---------- parte 12: abas e divisão de tela ---------- */
.abasbar{display:flex;align-items:center;gap:8px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--glass2);flex:none}
.abas-rol{display:flex;align-items:flex-end;gap:3px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:0}
.abas-rol::-webkit-scrollbar{height:4px}
.abas-dir{display:flex;align-items:center;gap:5px;flex:none;padding-bottom:5px}
.aba{display:flex;align-items:center;gap:6px;max-width:210px;min-width:92px;padding:7px 8px 8px 10px;border:1px solid transparent;border-bottom:0;border-radius:11px 11px 0 0;font-size:12.5px;color:var(--txt2);cursor:pointer;flex:none;transition:.12s;position:relative;top:1px}
.aba:hover{background:var(--glass2);color:var(--txt)}
.aba.on{background:var(--glass-hi);border-color:var(--gb2);color:var(--pri-txt);font-weight:600;box-shadow:0 -2px 8px -4px rgba(20,24,60,.2)}
.aba.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--glass-hi)}
.aba .ic{font-size:12px;opacity:.7;flex:none}
.aba .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aba .x{opacity:0;border-radius:6px;width:17px;height:17px;line-height:1;font-size:14px;color:var(--txt3);flex:none}
.aba:hover .x,.aba.on .x{opacity:1}
.aba .x:hover{background:var(--err-soft);color:var(--err)}
.aba.arrastando{opacity:.4}
.aba.dz{box-shadow:inset 3px 0 0 var(--pri)}
.aba-add{flex:none;width:26px;height:26px;border-radius:9px;color:var(--txt3);font-size:17px;line-height:1;align-self:center;margin-left:2px}
.aba-add:hover{background:var(--glass3);color:var(--pri-txt)}
.palco{flex:1;display:flex;min-height:0;min-width:0}
.palco>.content{flex:1;min-width:0}
.divisor{flex:none;width:7px;cursor:col-resize;background:linear-gradient(90deg,transparent 2px,var(--line) 3px,var(--line) 4px,transparent 5px);transition:.15s}
.divisor:hover{background:linear-gradient(90deg,transparent 1px,var(--pri) 2px,var(--pri) 5px,transparent 6px)}
.p2{flex:0 0 42%;min-width:240px;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line);background:var(--panel2)}
.p2-bar{display:flex;align-items:center;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--glass2);flex:none}
.p2-busca{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--gb2);background:var(--glass3);border-radius:10px;padding:0 8px}
.p2-busca:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}

.p2-busca input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--ui);font-size:12.5px;color:var(--txt);padding:6px 0}
.p2-res{position:absolute;top:calc(100% + 5px);left:-4px;right:-4px;z-index:50;background:linear-gradient(var(--glass-hi),var(--glass-hi)),var(--bg);border:1px solid var(--gb);border-radius:12px;box-shadow:var(--shadow2);max-height:320px;overflow:auto;padding:4px}
.p2-res a{display:block;padding:6px 9px;border-radius:9px;cursor:pointer;font-size:12.5px}
.p2-res a:hover{background:var(--glass2)}
.p2-res a b{display:block}
.p2-res a span{color:var(--txt3);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p2-cab{padding:10px 12px 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.p2-cab b{font-size:14px}
.p2-corpo{flex:1;overflow:auto;padding:6px 14px 30px;font-family:var(--read-font);font-size:calc(var(--fs) - 2px);line-height:1.6}
.p2-corpo.doc p{margin:0 0 8px}
.p2-corpo table{border-collapse:collapse}.p2-corpo td,.p2-corpo th{border:1px solid var(--line2);padding:4px 7px}
.p2-lista{display:flex;flex-direction:column;font-family:var(--ui)}
.p2-lista a{display:flex;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line)}
.p2-lista a:hover{background:var(--glass3);color:var(--pri-txt)}
.p2-lista a b{flex:none;min-width:62px}
.p2-lista a span{color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.m .abasbar{padding:4px 6px 0}
html.m .aba{min-width:76px;max-width:150px;font-size:12px}
html.m .abas-dir #aba-split,html.m .abas-dir #aba-dup{display:none}
@media print{.abasbar,.divisor,.p2{display:none!important}}
.sync{font-size:11px;white-space:nowrap}
.sync.ok{color:var(--ok)}
.sync.err{color:var(--err);font-weight:700}
#cfg-drive code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--glass2);border-radius:4px;padding:0 4px;word-break:break-all}
#cfg-drive a{color:var(--pri-txt);text-decoration:underline}
.card.prec{border-top:3px solid var(--cc)}
.prec-tese{font-size:12.5px;line-height:1.55;color:var(--txt2);border-left:2px solid var(--cc);padding-left:9px;white-space:pre-wrap;max-height:130px;overflow:auto}
.vchip.prec{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.vchip.prec.on{background:var(--tc);color:#fff;border-color:transparent}
.vchip.cab{border-style:dashed}
.vp-arts{display:flex;flex-direction:column;gap:2px;margin-top:6px}
