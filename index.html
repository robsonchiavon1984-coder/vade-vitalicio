    meta: { ultimoBackup: null, criadoEm: new Date().toISOString(), primeiroUso: true, rev: 0 },
  };
}

/* ---------------- persistência ---------------- */
const DB = {
  name: 'vademecum-vitalicio', store: 'kv', db: null,
  open() { return new Promise((res, rej) => { if (!window.indexedDB) return rej('no idb'); const r = indexedDB.open(this.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(this.store); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { const t = this.db.transaction(this.store, 'readonly').objectStore(this.store).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction(this.store, 'readwrite').objectStore(this.store).put(v, k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
};
let S = null;            // estado global
let fileHandle = null;   // File System Access API (arquivo vinculado)
let useLS = false;
async function loadState() {
  let base = null;
  try { await DB.open(); const st = await DB.get('state'); fileHandle = (await DB.get('fileHandle')) || null; if (st) base = migrate(st); }
  catch (e) { useLS = true; try { const st = JSON.parse(localStorage.getItem('vademecum-state')); if (st) base = migrate(st); } catch (_) {} }
  // recupera o que ficou pendente se a aba foi fechada antes de a gravação terminar
  const em = lerEmergencia();
  if (em && em.estado && em.rev >= ((base && base.meta && base.meta.rev) || 0)) {
    try { const rec = migrate(em.estado); if (base) { rec.meta.rev = Math.max(rec.meta.rev || 0, (base.meta || {}).rev || 0); } base = rec; emergenciaAplicada = true; } catch (_) {}
  }
  limparEmergencia();
  return base || migrate(seedState());
}
let emergenciaAplicada = false;
const saveNow = async () => {
  const el = $('#save-state'); el.textContent = 'salvando…';
  try {
    if (!useLS && DB.db && typeof mesclarDentro === 'function') {
      try {
        const st = await DB.get('state');
        if (st && ((st.meta || {}).rev || 0) > (S.meta.rev || 0)) {
          const base = migrate(st); mesclarDentro(base, S);
          base.prefs = S.prefs; if (base.ia && S.ia) base.ia.chaves = S.ia.chaves;
          base.meta.rev = (st.meta || {}).rev || 0; base.meta.ultimoBackup = S.meta.ultimoBackup || base.meta.ultimoBackup;
          S = base; if (typeof renderRamos === 'function') { renderRamos(); renderTree(); }
          toast('Alterações feitas em outra aba foram incorporadas');
        }
      } catch (_) {}
    }
    S.meta.rev = (S.meta.rev || 0) + 1;
    if (useLS) localStorage.setItem('vademecum-state', JSON.stringify(S)); else await DB.set('state', S);
    if (fileHandle) { try { if ((await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted') { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(sanitizeState(S))); await w.close(); } } catch (e) { console.warn('arquivo vinculado', e); } }
    limparEmergencia();
    el.textContent = 'salvo ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    if (typeof avisarOutrasAbas === 'function') avisarOutrasAbas();
  } catch (e) { el.textContent = 'ERRO ao salvar'; console.error(e); toast('Erro ao salvar os dados: ' + e, 'err'); }
};
const save = debounce(saveNow, 500);
/* Rede de segurança: IndexedDB grava de forma assíncrona e uma gravação iniciada
   no fechamento da aba pode não terminar. Antes de sair, uma cópia é escrita em
   localStorage (gravação síncrona) e recuperada na abertura seguinte. */
const EMERG = 'vademecum-emergencia';
function salvarEmergencia() {
  try { localStorage.setItem(EMERG, JSON.stringify({ ts: Date.now(), rev: (S.meta || {}).rev || 0, estado: S })); } catch (_) { try { localStorage.removeItem(EMERG); } catch (__) {} }
}
function limparEmergencia() { try { localStorage.removeItem(EMERG); } catch (_) {} }
function lerEmergencia() { try { const v = localStorage.getItem(EMERG); return v ? JSON.parse(v) : null; } catch (_) { return null; } }

/* ---------------- helpers de domínio ---------------- */
const leiById = id => S.leis.find(l => l.id === id);
const ramoById = id => S.ramos.find(r => r.id === id);
const artigosDe = lei => lei.itens.filter(i => i.tipo === 'art');
const findArt = (leiId, artId) => { const l = leiById(leiId); if (!l) return null; const a = l.itens.find(i => i.id === artId && i.tipo === 'art'); return a ? { lei: l, art: a } : null; };
const artLabel = a => 'Art. ' + a.numero;
const numKey = n => { const m = String(n).match(/^(\d+)\s*(?:º|o|°)?\s*-?\s*([A-Z]{0,2})/i); return m ? [parseInt(m[1], 10), (m[2] || '').toUpperCase()] : [1e9, String(n)]; };
const leisDoRamo = rid => rid ? S.leis.filter(l => l.ramos.includes(rid)) : S.leis;
function crumbsDe(lei, art) { const out = []; const stack = []; for (const it of lei.itens) { if (it.tipo === 'cab') { while (stack.length && stack[stack.length - 1].nivel >= it.nivel) stack.pop(); stack.push(it); } else if (it.id === art.id) return stack.map(c => c.rotulo + (c.titulo ? ' – ' + c.titulo : '')); } return out; }
function refsPendentes() { let n = 0; for (const l of S.leis) for (const a of artigosDe(l)) for (const u of a.atualizacoes) if (!u.visto) n++; return n; }
function normNumero(s) { s = String(s).trim().replace(/^art\.?\s*/i, '').replace(/[.,;:]+$/, '').replace(/\.(?=\d{3}\b)/g, ''); s = s.replace(/^(\d+)\s*(o|°)\b/i, '$1º'); if (/^[1-9]$/.test(s)) s += 'º'; return s.replace(/\s*-\s*/g, '-').toUpperCase().replace('º', 'º'); }

/* ---------------- parser de texto colado (Planalto) ---------------- */
const ROMANO = '[IVXLCDM]+(?:\\s*-\\s*[A-Z])?';
const ORDINAIS = 'PRIMEIR[OA]|SEGUND[OA]|TERCEIR[OA]|QUART[OA]|QUINT[OA]|SEXT[OA]|S[ÉE]TIM[OA]|OITAV[OA]|NON[OA]|D[ÉE]CIM[OA](?:\\s+(?:PRIMEIR[OA]|SEGUND[OA]|TERCEIR[OA]|QUART[OA]|QUINT[OA]))?|UND[ÉE]CIM[OA]|DUOD[ÉE]CIM[OA]';
const CABS = [
  [1, new RegExp('^(PARTE\\s+(?:GERAL|ESPECIAL|[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [1, /^(ATO\s+DAS\s+DISPOSI[CÇ][ÕO]ES\s+CONSTITUCIONAIS\s+TRANSIT[ÓO]RIAS)(?![A-Za-zÀ-ú])/i],
  [2, new RegExp('^(LIVRO\\s+(?:COMPLEMENTAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [3, new RegExp('^(T[IÍ]TULO\\s+(?:PRELIMINAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [4, new RegExp('^(CAP[IÍ]TULO\\s+(?:PRELIMINAR|[ÚU]NICO|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [6, new RegExp('^(SUBSE[CÇ][ÃA]O\\s+(?:[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [5, new RegExp('^(SE[CÇ][ÃA]O\\s+(?:[ÚU]NICA|' + ORDINAIS + '|' + ROMANO + '))(?![A-Za-zÀ-ú])', 'i')],
  [3, /^(DISPOSI[CÇ][ÕO]ES\s+(?:PRELIMINARES|GERAIS|FINAIS(?:\s+E\s+TRANSIT[ÓO]RIAS)?|TRANSIT[ÓO]RIAS(?:\s+E\s+FINAIS)?)|DISPOSI[CÇ][ÃA]O\s+(?:PRELIMINAR|FINAL|TRANSIT[ÓO]RIA))(?![A-Za-zÀ-ú])/i, true],
];
const NIVEL_NOME = { 1: 'Parte', 2: 'Livro', 3: 'Título', 4: 'Capítulo', 5: 'Seção', 6: 'Subseção' };
const RX_LIXO = /^(?:presid[êe]ncia da rep[úu]blica|casa civil|subchefia para assuntos jur[íi]dicos|secretaria[ -]geral(?: de governo)?|atos do poder \w+|texto (?:compilado|atualizado)|vig[êe]ncia|regulamento|regulamenta[çc][ãa]o|mensagem de veto|\(vide[^)]*\)|este texto n[ãa]o substitui.*|bras[íi]lia,?\s*(?:em|aos)?\s*\d.*|d\.?\s?o\.?\s?u\.?\b.*|p[áa]gina \d+(?: de \d+)?|\d{1,3}|sum[áa]rio|[íi]ndice)$/i;
/* reconhece um cabeçalho na linha; devolve {nivel, rotulo, titulo} ou null */
function matchCab(l) {
  if (!l || l.length > 160 || /^Art\.?\s*\d/i.test(l)) return null;
  for (const [nivel, rx, disp] of CABS) {
    const m = l.match(rx); if (!m) continue;
    const rotulo = m[1].replace(/\s+/g, ' ').replace(/\s*-\s*/g, '-').trim();
    let resto = l.slice(m[0].length).replace(/^\s*[-–—:.]\s*/, '').trim();
    // linha de texto corrido que apenas começa com a palavra (ex.: "Seção II do Capítulo I aplica-se…")
    if (resto && (/[;,]$/.test(resto) || (/\.$/.test(resto) && resto.split(/\s+/).length > 5) || resto.split(/\s+/).length > 22)) return null;
    return { nivel, rotulo, titulo: resto.replace(/\s*\.$/, ''), disp: !!disp };
  }
  return null;
}
const RX_ART = /^Art\.?\s*(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:º|o|°|\.)?\s*(?:-\s*([A-Z]{1,2})\b)?\s*[.\-–:]?\s*/i;
const fixOrd = l => l.replace(/(\b(?:Arts?|arts?|§|§§)\.?\s*\d+(?:\.\d{3})*)\s+[oº°](?=\s|$|[,.;)])/g, '$1º').replace(/(\d)\s+º/g, '$1º');
function parseTexto(txt) {
  const linhas = txt.replace(/\r/g, '').replace(/\u00a0/g, ' ').split('\n')
    .map(l => fixOrd(l.trim().replace(/\s{2,}/g, ' '))).filter(l => l && !RX_LIXO.test(l));
  const itens = []; let cur = null; let esperaTitulo = null;
  const flush = () => { if (cur) { itens.push(novoArtigo(cur.numero, cur.linhas.map(l => `<p>${esc(l)}</p>`).join(''))); cur = null; } };
  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i];
    const c = matchCab(l);
    if (c) {
      // "DISPOSIÇÕES GERAIS" logo abaixo de um cabeçalho sem título é o título dele, não um novo cabeçalho
      if (esperaTitulo && c.disp && !c.titulo) { esperaTitulo.titulo = c.rotulo; esperaTitulo = null; continue; }
      flush(); const cab = novoCab(c.nivel, c.rotulo, c.titulo); itens.push(cab); esperaTitulo = c.titulo ? null : cab; continue;
    }
    const a = l.match(RX_ART);
    if (a) { flush(); esperaTitulo = null; const num = a[1] + (parseInt(a[1], 10) < 10 && a[1].length === 1 ? 'º' : '') + (a[2] ? '-' + a[2].toUpperCase() : ''); cur = { numero: num, linhas: [l] }; continue; }
    if (esperaTitulo) { if (l.length <= 140 && !/^(§|Par[áa]grafo|[IVXLC]+\s*-|[a-z]\))/i.test(l)) { esperaTitulo.titulo = l.replace(/\s*\.$/, ''); esperaTitulo = null; continue; } esperaTitulo = null; }
    if (cur) cur.linhas.push(l);
  }
  flush(); return itens;
}

/* intervalo [a,b) ocupado por um cabeçalho e por tudo que está sob ele */
function blocoRange(lei, idx) {
  const it = lei.itens[idx]; if (!it || it.tipo !== 'cab') return [idx, idx + 1];
  let j = idx + 1; while (j < lei.itens.length && !(lei.itens[j].tipo === 'cab' && lei.itens[j].nivel <= it.nivel)) j++;
  return [idx, j];
}
function moverBloco(lei, idx, dir) {
  const it = lei.itens[idx]; const [a, b] = blocoRange(lei, idx); const tam = b - a;
  if (dir < 0) {
    if (a === 0) return false;
    let p = a - 1; while (p >= 0 && !(lei.itens[p].tipo === 'cab' && lei.itens[p].nivel <= it.nivel)) p--;
    let s;
    if (p < 0) s = 0;                                   // nada acima: vai para o início da lei
    else if (lei.itens[p].nivel < it.nivel) s = p + 1;  // é o cabeçalho superior: sobe só até logo abaixo dele
    else s = p;                                         // é o irmão anterior: passa por cima do bloco dele
    if (s >= a) return false;
    const bloco = lei.itens.splice(a, tam); lei.itens.splice(s, 0, ...bloco); return true;

  if (nx.tipo !== 'cab') { e = b; while (e < lei.itens.length && lei.itens[e].tipo !== 'cab') e++; }
  else { if (nx.nivel < it.nivel) return false; e = blocoRange(lei, b)[1]; }

}
function moverRange(lei, a, b, destIdx) {

}
function normalizarNiveis(lei) {

}
function faixaDe(lei, a, b) { const arts = lei.itens.slice(a, b).filter(x => x.tipo === 'art'); if (!arts.length) return ''; return arts.length === 1 ? artLabel(arts[0]) : `${artLabel(arts[0])} – ${artLabel(arts[arts.length - 1]).replace('Art. ', '')}`; }

    if (anterior && it.nivel > anterior.nivel + 1) p.push({ i, txt: `"${it.rotulo}" (${NIVEL_NOME[it.nivel] || it.nivel}) vem logo depois de "${anterior.rotulo}" (${NIVEL_NOME[anterior.nivel] || anterior.nivel}), pulando níveis.` });
    if (!it.titulo) p.push({ i, txt: `"${it.rotulo}" está sem título.` });

function renderPaneEstrutura(lei) {

      <div><b>Estrutura da lei</b><div class="mini" style="line-height:1.5">Organograma editável: insira, renomeie, mova, promova ou exclua Parte, Livro, Título, Capítulo, Seção e Subseção. Mover um cabeçalho leva junto tudo o que está sob ele.</div></div>

    <div class="mini" style="margin-top:10px;line-height:1.6">Dica: "Corrigir níveis" reajusta a hierarquia pelo tipo do rótulo (Parte acima de Livro, Livro acima de Título, e assim por diante), útil depois de importar um texto em que o organograma saiu torto.</div>`;

  if ($('#st-prob')) $('#st-prob').onclick = () => openModal({ title: 'Avisos sobre a estrutura', body: `<div class="mini" style="line-height:1.7">${probs.map(x => '• ' + esc(x.txt)).join('<br>')}</div><p class="hint" style="margin-top:10px">São apenas indícios de que a importação pode ter interpretado mal o texto; nem todo aviso é erro (há leis com capítulo sem título ou sem artigos próprios).</p>`, buttons: [{ label: 'Fechar', cls: 'pri' }] });
}
function excluirCabecalho(lei, idx) {
  const it = lei.itens[idx]; const [a, b] = blocoRange(lei, idx); const nA = lei.itens.slice(a, b).filter(x => x.tipo === 'art').length;

/* ---------- localizar e substituir ---------- */
function acharTodos(ed, termo, sens) {
  const out = []; if (!termo) return out;
  const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); const q = sens ? termo : termo.toLowerCase();
  let n; while ((n = w.nextNode())) { const t = sens ? n.data : n.data.toLowerCase(); let i = t.indexOf(q); while (i >= 0) { const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length); out.push(r); i = t.indexOf(q, i + q.length); } }
  return out;
}
function modalBuscar(ed, persist) {
  let achados = [], k = -1;
  openModal({ title: 'Localizar e substituir', body: `<div class="form"><div class="row"><label>Localizar<input type="text" id="bs-q" placeholder="texto a procurar"></label><label>Substituir por<input type="text" id="bs-r" placeholder="(opcional)"></label></div>
      <label class="checks"><label><input type="checkbox" id="bs-cs"> diferenciar maiúsculas de minúsculas</label></label><div class="mini" id="bs-info">Digite para localizar.</div></div>`,
    buttons: [{ label: 'Fechar' }, { label: 'Substituir todos', onClick: () => {
        const q = $('#bs-q').value; if (!q) return false; const rs = acharTodos(ed, q, $('#bs-cs').checked); const novo = $('#bs-r').value;
        for (let i = rs.length - 1; i >= 0; i--) { rs[i].deleteContents(); if (novo) rs[i].insertNode(document.createTextNode(novo)); }
        persist(); toast(`${rs.length} ocorrência${rs.length === 1 ? '' : 's'} substituída${rs.length === 1 ? '' : 's'}`, 'ok'); return false;
      } }, { label: 'Localizar próximo', cls: 'pri', onClick: () => {
        const q = $('#bs-q').value; if (!q) return false;
        achados = acharTodos(ed, q, $('#bs-cs').checked); if (!achados.length) { $('#bs-info').textContent = 'Nada encontrado.'; return false; }
        k = (k + 1) % achados.length; const r = achados[k]; const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        const el = r.startContainer.parentElement; if (el) el.scrollIntoView({ block: 'center' });
        $('#bs-info').textContent = `Ocorrência ${k + 1} de ${achados.length}.`; return false;
      } }],
    onOpen: b => { $('#bs-q', b).oninput = debounce(() => { const n = acharTodos(ed, $('#bs-q').value, $('#bs-cs').checked).length; k = -1; $('#bs-info').textContent = $('#bs-q').value ? `${n} ocorrência${n === 1 ? '' : 's'} no documento.` : 'Digite para localizar.'; }, 250); } });
}

img{max-width:100%}`;

function modalExportarDoc(c, ed, D) {
  const baixar = (nome, conteudo, mime) => { const bl = new Blob([conteudo], { type: mime }); const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); };
  const doc = (extra) => `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(c.titulo)}</title><style>${cssDoc(D)}${extra || ''}</style></head><body>${ed.innerHTML}</body></html>`;
  const nomeBase = c.titulo.replace(/[\\/:*?"<>|]/g, '-').slice(0, 60) || 'caderno';
  openModal({ title: 'Exportar documento', body: `<div class="sheet">
      <button data-x="word"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>Word (.doc) — abre no Microsoft Word mantendo fonte, tabelas e margens</button>

    onOpen: b => { $$('[data-x]', b).forEach(x => x.onclick = () => {
      const k = x.dataset.x; closeModal();
      if (k === 'word') baixar(nomeBase + '.doc', '﻿' + doc(), 'application/msword');
      else if (k === 'html') baixar(nomeBase + '.html', doc(), 'text/html');

    }); } });
}

];
const tiposJuris = () => { if (!Array.isArray(S.tiposJuris) || !S.tiposJuris.length) S.tiposJuris = TIPOS_JURIS_SEED.map(([id, nome, abrev, cor, v]) => ({ id, nome, abrev, cor, vinc: !!v })); return S.tiposJuris; };

function modalTiposJuris(depois) {

    title: 'Tipos de julgado', wide: true,

          $('[data-a]', row).onchange = e => { t.abrev = e.target.value.trim() || t.nome; save(); };

}

/* ---------- ordenação das leis ---------- */
const ORDENS = [['manual', 'Ordem definida por mim'], ['sigla', 'Sigla (A→Z)'], ['epigrafe', 'Epígrafe (A→Z)'], ['nome', 'Nome (A→Z)'], ['arts', 'Mais artigos primeiro'], ['recentes', 'Editadas recentemente']];
function ultimaEdicaoLei(l) { let m = ''; for (const a of artigosDe(l)) if (a.atualizadoEm && a.atualizadoEm > m) m = a.atualizadoEm; return m; }
function leisOrdenadas(lista) {
  const o = S.prefs.ordemLeis || 'manual'; const c = lista.slice();
  const cmp = (a, b) => String(a).localeCompare(String(b), 'pt-BR', { sensitivity: 'base' });
  if (o === 'sigla') c.sort((a, b) => cmp(a.sigla, b.sigla));
  else if (o === 'epigrafe') c.sort((a, b) => cmp(a.epigrafe, b.epigrafe));
  else if (o === 'nome') c.sort((a, b) => cmp(a.nome, b.nome));
  else if (o === 'arts') c.sort((a, b) => artigosDe(b).length - artigosDe(a).length || cmp(a.sigla, b.sigla));
  else if (o === 'recentes') c.sort((a, b) => (ultimaEdicaoLei(b) || '').localeCompare(ultimaEdicaoLei(a) || '') || cmp(a.sigla, b.sigla));
  return c;
}
function fixarOrdemAtual() { if ((S.prefs.ordemLeis || 'manual') === 'manual') return; S.leis = leisOrdenadas(S.leis); S.prefs.ordemLeis = 'manual'; }
function moverLei(srcId, dstId, depois) {
  if (srcId === dstId) return false;
  fixarOrdemAtual();
  const i = S.leis.findIndex(l => l.id === srcId); if (i < 0) return false;
  const [lei] = S.leis.splice(i, 1);
  let j = S.leis.findIndex(l => l.id === dstId); if (j < 0) { S.leis.splice(i, 0, lei); return false; }
  S.leis.splice(depois ? j + 1 : j, 0, lei); save(); return true;
}
function moverLeiPos(id, d) {
  fixarOrdemAtual();
  const ramo = S.prefs.ramoAtivo; const vis = leisDoRamo(ramo);
  const k = vis.findIndex(l => l.id === id); const alvo = vis[k + d]; if (!alvo) return false;
  return moverLei(id, alvo.id, d > 0);
}
function bindArrastarLeis(cont) {
  $$('.lei[data-lei]', cont).forEach(el => {
    const id = el.dataset.lei;
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('arrastando'); };
    el.ondragend = () => $$('.lei', cont).forEach(x => x.classList.remove('arrastando', 'dz-a', 'dz-b'));
    el.ondragover = e => { e.preventDefault(); const r = el.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; el.classList.toggle('dz-b', dep); el.classList.toggle('dz-a', !dep); };
    el.ondragleave = () => el.classList.remove('dz-a', 'dz-b');
    el.ondrop = e => { e.preventDefault(); const r = el.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; if (moverLei(e.dataTransfer.getData('text/plain'), id, dep)) { renderTree(); toast('Ordem atualizada', 'ok'); } };
  });
}
function modalOrganizarLeis() {
  const ramo = S.prefs.ramoAtivo;
  const linhas = () => leisOrdenadas(leisDoRamo(ramo)).map(l => `<div class="org-row" draggable="true" data-id="${l.id}"><span class="grip">⠿</span><span class="ico" style="background:${(ramoById(l.ramos[0]) || {}).cor || 'var(--txt3)'}">${esc(l.sigla.slice(0, 4))}</span><span class="t"><b>${esc(l.epigrafe)}</b><small>${esc(l.nome)}</small></span><span class="mini">${artigosDe(l).length} art.</span><span class="ops"><button class="ibtn" data-op="topo" title="Para o topo">⤒</button><button class="ibtn" data-op="cima" title="Subir">${I.up}</button><button class="ibtn" data-op="baixo" title="Descer">${I.down}</button><button class="ibtn" data-op="fim" title="Para o fim">⤓</button></span></div>`).join('');
  openModal({ title: 'Organizar as leis da coluna', wide: true,
    body: `<div class="form"><label>Critério de ordenação<select id="og-crit">${ORDENS.map(([v, l]) => `<option value="${v}" ${(S.prefs.ordemLeis || 'manual') === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="hint">Escolhendo um critério automático, a coluna passa a segui-lo. Arrastar uma lei ou usar as setas fixa a ordem como "definida por mim", preservando o arranjo atual.</span></label>
      <div class="hint">${ramo ? `Mostrando as leis de ${esc(ramoById(ramo).nome)}; a ordem vale para todo o acervo.` : 'Arraste pelo ⠿ ou use as setas. A ordem vale para a coluna e para o filtro por ramo.'}</div></div>
      <div class="org-list" id="og-list">${linhas()}</div>`,
    buttons: [{ label: 'Inverter ordem', cls: 'left', onClick: () => { fixarOrdemAtual(); S.leis.reverse(); save(); modalOrganizarLeis(); renderTree(); return false; } }, { label: 'Fechar', cls: 'pri', onClick: () => renderTree() }],
    onOpen: b => {
      const redes = () => { $('#og-list', b).innerHTML = linhas(); liga(); renderTree(); };
      const liga = () => {
        $$('.org-row', b).forEach(row => {
          const id = row.dataset.id;
          $$('[data-op]', row).forEach(bt => bt.onclick = () => {
            fixarOrdemAtual(); const op = bt.dataset.op;
            if (op === 'topo' || op === 'fim') { const i = S.leis.findIndex(l => l.id === id); const [l] = S.leis.splice(i, 1); op === 'topo' ? S.leis.unshift(l) : S.leis.push(l); save(); }
            else moverLeiPos(id, op === 'cima' ? -1 : 1);
            $('#og-crit', b).value = 'manual'; redes();
          });
          row.ondragstart = e => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; row.classList.add('arrastando'); };
          row.ondragend = () => { $$('.org-row', b).forEach(r => r.classList.remove('arrastando', 'dz-a', 'dz-b')); };
          row.ondragover = e => { e.preventDefault(); const r = row.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; row.classList.toggle('dz-b', dep); row.classList.toggle('dz-a', !dep); };
          row.ondragleave = () => row.classList.remove('dz-a', 'dz-b');
          row.ondrop = e => { e.preventDefault(); const r = row.getBoundingClientRect(); const dep = e.clientY > r.top + r.height / 2; if (moverLei(e.dataTransfer.getData('text/plain'), id, dep)) { $('#og-crit', b).value = 'manual'; redes(); } };
        });
      };
      liga();
      $('#og-crit', b).onchange = e => { S.prefs.ordemLeis = e.target.value; save(); redes(); };
    } });
}
</script>

const crPlanCache = new Map();

function crRead(c, disc, date) { const k = date + '|' + disc; return Object.prototype.hasOwnProperty.call(c.reads, k) ? c.reads[k] : null; }
function crVisivel(c, disc, date) { const t = crTarget(c, disc, date); if (t === null) return false; if (t > 0) return true; return crRead(c, disc, date) !== null || crAdjOf(c, disc, date).length > 0; }

      ${r !== null ? '<button class="btn sm ghost" data-op="limpar">Limpar</button>' : ''}
      ${pend > 0 && date <= today() ? `<span class="mini">Adiar ${nfBR.format(pend)} ${un} em</span><select class="inp" data-role="ndias" style="width:82px"><option>1</option><option>2</option><option>3</option><option selected>5</option><option>7</option></select><button class="btn sm" data-op="redist">Redistribuir</button>` : ''}</div>`;
  return `<div class="blk st-${st}">

    <div class="blk-bar">${barras || '<span style="width:100%"></span>'}</div>

}
function crBindBlocos(root, depois) {
  $$('[data-lei]', root).forEach(a => a.onclick = e => { e.stopPropagation(); closeModal(); openLeiHome(a.dataset.lei); });
  $$('[data-blk]', root).forEach(box => {
    const [cid, disc, date] = box.dataset.blk.split('|'); const c = cronoById(cid); if (!c) return;
    const inp = $('[data-role="lido"]', box);
    $$('[data-op]', box).forEach(b => b.onclick = () => {
      const op = b.dataset.op;
      if (op === 'salvar') crSetRead(c, disc, date, inp.value === '' ? null : inp.value);
      else if (op === 'tudo') crSetRead(c, disc, date, crTarget(c, disc, date));
      else if (op === 'limpar') crSetRead(c, disc, date, null);
      else if (op === 'redist') { if (!crRedistribuir(c, disc, date, +$('[data-role="ndias"]', box).value || 5)) return; }
      if (depois) depois();
    });
    if (inp) inp.onkeydown = e => { if (e.key === 'Enter') { crSetRead(c, disc, date, inp.value === '' ? null : inp.value); if (depois) depois(); } };
  });
}

/* ---- gráfico semanal ---- */
function crDesenharGrafico(c) {
  const cv = $('#crChart'); if (!cv || !cv.parentElement) return;
  const W = Math.max(300, cv.parentElement.getBoundingClientRect().width - 4), H = 200, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!dataOk(c.start) || !dataOk(c.end) || c.start > c.end) return;
  let ws = addDias(c.start, -((pISO(c.start).getDay() + 6) % 7));
  const semanas = []; let guard = 0;
  while (ws <= c.end && guard++ < 200) {
    const we = addDias(ws, 6); let plano = 0, lido = 0;
    for (const d of c.discs) for (const dt of crDatas(c, d.id)) if (dt >= ws && dt <= we) { plano += crTarget(c, d.id, dt) || 0; const r = crRead(c, d.id, dt); if (r !== null) lido += r; }
    semanas.push({ ws, plano, lido }); ws = addDias(ws, 7);
  }
  if (!semanas.length) return;
  const max = Math.max(1, ...semanas.map(w => Math.max(w.plano, w.lido)));
  const cs = getComputedStyle(document.documentElement);
  const cor1 = (cs.getPropertyValue('--pri-soft') || '').trim() || 'rgba(99,102,241,.2)';
  const cor2 = (cs.getPropertyValue('--pri') || '').trim() || '#4f46e5';
  const cLin = (cs.getPropertyValue('--line') || '').trim() || '#ddd', cTxt = (cs.getPropertyValue('--txt3') || '').trim() || '#888';
  const pl = 46, pb = 22, pt = 8, cw = (W - pl - 8) / semanas.length;
  ctx.font = '10px ui-monospace,monospace'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = pt + (H - pt - pb) * (1 - g / 4);
    ctx.strokeStyle = cLin; ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(W - 4, y); ctx.stroke();
    ctx.fillStyle = cTxt; ctx.fillText(nfBR.format(Math.round(max * g / 4)), 2, y + 3);
  }
  const t = today(), passo = Math.ceil(semanas.length / 9);
  semanas.forEach((w, i) => {
    const x = pl + i * cw, bw = Math.max(3, cw * .62);
    ctx.fillStyle = cor1; ctx.fillRect(x + (cw - bw) / 2, H - pb - (H - pt - pb) * (w.plano / max), bw, (H - pt - pb) * (w.plano / max));
    ctx.fillStyle = cor2; ctx.fillRect(x + (cw - bw) / 2, H - pb - (H - pt - pb) * (w.lido / max), bw, (H - pt - pb) * (w.lido / max));
    if (i % passo === 0) { ctx.fillStyle = cTxt; ctx.fillText(fmtBRc(w.ws), x + 1, H - 6); }
    if (w.ws <= t && addDias(w.ws, 6) >= t) { ctx.fillStyle = cor2; ctx.fillRect(x + (cw - bw) / 2, H - pb + 2, bw, 2); }
  });
}

<script>
/* =====================================================================
   PARTE 10 — vínculos abaixo do artigo: referências no texto (com edição
   manual), correlações e pré-visualização sem sair da página
   ===================================================================== */
const refsMan = a => { if (!a.refsMan) a.refsMan = []; return a.refsMan; };
const refsOff = a => { if (!a.refsOff) a.refsOff = []; return a.refsOff; };

/* ---- detecção automática no texto do artigo ---- */
function refsDetectadas(lei, art) {
  const txt = plain(art.texto), out = [];
  const vistos = new Set();
  const rx = /\bart(?:igo)?s?\.?\s*(\d+)\s*(?:º|o|°)?(?:\s*-\s*([A-Z]))?/gi; let m;
  while ((m = rx.exec(txt))) {
    const n = normNumero(m[1] + (m[2] ? '-' + m[2] : ''));
    const t = artigosDe(lei).find(a => normNumero(a.numero) === n);
    if (t && t.id !== art.id && normNumero(t.numero) !== normNumero(art.numero) && !vistos.has('a:' + t.id)) { vistos.add('a:' + t.id); out.push({ k: 'a:' + t.id, tipo: 'art', lei, art: t }); }
  }
  const rl = /\b(Lei(?:\s+Complementar)?|Decreto-Lei|Decreto)\s+n?\.?\s*º?\s*([\d.]+)/gi;
  while ((m = rl.exec(txt))) {
    const num = m[2].replace(/\./g, '');
    if (num.length < 3) continue;
    const l = S.leis.find(x => x.id !== lei.id && norm(x.epigrafe).replace(/\./g, '').includes(num));
    if (l && !vistos.has('l:' + l.id)) { vistos.add('l:' + l.id); out.push({ k: 'l:' + l.id, tipo: 'lei', lei: l }); }
  }
  return out;
}
function refsDoArtigo(lei, art) {
  const off = new Set(refsOff(art));
  const auto = refsDetectadas(lei, art).filter(r => !off.has(r.k)).map(r => Object.assign({ auto: true }, r));
  const man = [];
  for (const r of refsMan(art)) {
    if (r.artId) { const f = findArt(r.leiId, r.artId); if (f) man.push({ k: 'm:' + r.id, tipo: 'art', lei: f.lei, art: f.art, man: r }); }
    else { const l = leiById(r.leiId); if (l) man.push({ k: 'm:' + r.id, tipo: 'lei', lei: l, man: r }); }
  }
  return auto.concat(man);
}
const refRotulo = r => r.tipo === 'art' ? `${r.lei.sigla}, ${artLabel(r.art)}` : r.lei.epigrafe;

/* ---- pré-visualização ---- */
const artsQueCitamCaderno = cadId => { const out = []; for (const l of S.leis) for (const a of artigosDe(l)) for (const k of a.links) if (k.cadId === cadId) out.push({ lei: l, art: a, obs: k.obs }); return out; };
function alvoDaChave(lei, art, k) {
  if (k && k.startsWith('j:')) { const j = jurisDe(art).find(x => x.id === k.slice(2)); return j ? { tipo: 'jur', jur: j, lei, art } : null; }
  if (k && k.startsWith('c:')) {
    const i = +k.slice(2); const kk = art.links[i]; if (!kk) return null;
    if (kk.cadId) { const c = cadById(kk.cadId); return c ? { tipo: 'cad', cad: c, obs: kk.obs } : null; }
    const f = findArt(kk.leiId, kk.artId); return f ? { tipo: 'art', lei: f.lei, art: f.art, obs: kk.obs } : null;
  }
  if (k && k.startsWith('b:')) { const f = findArt(k.slice(2).split('|')[0], k.slice(2).split('|')[1]); return f ? { tipo: 'art', lei: f.lei, art: f.art } : null; }
  if (k && k.startsWith('d:')) { const c = cadById(k.slice(2)); return c ? { tipo: 'cad', cad: c } : null; }
  const todos = refsDoArtigo(lei, art);
  return todos.find(r => r.k === k) || null;
}
function previewHTML(al) {
  if (!al) return '<div class="empty">Item não encontrado — pode ter sido excluído.</div>';
  if (al.tipo === 'jur') {
    const j = al.jur, t = tipoJuris(j.tipo);
    return `<div class="vp-head"><span class="chip" style="background:${tipoJurisCor(j.tipo)}1f;color:${tipoJurisCor(j.tipo)};border-color:transparent">${esc(tipoJurisNome(j.tipo))}${t && t.vinc ? ' · vinculante' : ''}</span><b>${esc(j.titulo)}</b><span style="flex:1"></span>
      <button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Editar na aba</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
      <div class="vp-corpo">${sanitizeHtml(j.conteudo) || '<div class="empty">Julgado sem conteúdo.</div>'}</div>`;
  }
  if (al.tipo === 'cad') {
    const c = al.cad;
    return `<div class="vp-head"><b>${esc(c.titulo)}</b><span class="mini">caderno · ${esc((ramoById(c.ramo) || {}).nome || 'sem ramo')}</span><span style="flex:1"></span>
      <button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Abrir caderno</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
      ${al.obs ? `<div class="vp-obs">${esc(al.obs)}</div>` : ''}
      <div class="vp-corpo">${sanitizeHtml(c.conteudo) || '<div class="empty">Caderno sem conteúdo.</div>'}</div>`;
  }
  if (al.tipo === 'lei') {
    const l = al.lei, arts = artigosDe(l);
    return `<div class="vp-head"><b>${esc(l.epigrafe)}</b><span class="mini">${esc(l.nome)}</span><span style="flex:1"></span>
      <button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Abrir lei</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
      <div class="vp-corpo"><p class="mini">${arts.length ? `${nfBR.format(arts.length)} artigos cadastrados.` : 'Texto ainda não importado.'}${l.ementa ? ' ' + esc(l.ementa) : ''}</p>
      ${arts.slice(0, 3).map(a => `<p><b>${esc(artLabel(a))}</b> ${esc(plain(a.texto).replace(/^Art\.?\s*[\d.ºo°\-A-Z]+\.?\s*/i, '').slice(0, 180))}…</p>`).join('')}</div>`;
  }
  const a = al.art, l = al.lei, cr = crumbsDe(l, a);
  return `<div class="vp-head"><b>${esc(l.sigla)}, ${esc(artLabel(a))}</b><span class="mini">${esc(l.epigrafe)}</span>
      ${a.estrelas ? `<span style="color:var(--star)">${'★'.repeat(a.estrelas)}</span>` : ''}${a.status !== 'vigente' ? `<span class="status ${a.status}">${a.status}</span>` : ''}<span style="flex:1"></span>
      <button class="btn sm" data-vp="janela">⧉ janela</button><button class="btn sm pri" data-vp="abrir">Abrir artigo</button><button class="btn sm ghost" data-vp="fechar">✕</button></div>
    ${cr.length ? `<div class="crumbs vp-crumbs">${cr.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}
    ${al.obs ? `<div class="vp-obs">${esc(al.obs)}</div>` : ''}
    <div class="vp-corpo leitura">${sanitizeHtml(a.texto) || '<div class="empty">Artigo sem texto.</div>'}</div>
    ${temNota(a) ? `<div class="vp-extra"><b>Notas</b>${notasHtml(a)}</div>` : ''}
    ${temJuris(a) ? `<div class="vp-extra"><b>Jurisprudência</b>${jurisHtml(a)}</div>` : ''}`;
}
function abrirAlvo(al) {
  if (!al) return;
  if (al.tipo === 'jur') { UI.jurisId = al.jur.id; UI.vprev = null; openArt(al.lei.id, al.art.id, 'juris'); return; }
  if (al.tipo === 'cad') openCad(al.cad.id);
  else if (al.tipo === 'lei') openLeiHome(al.lei.id);

function janelaPreview(lei, art, k) {
  const al = alvoDaChave(lei, art, k);

    wide: true, body: `<div class="vprev solta">${previewHTML(al)}</div>`,

}

/* ---- bloco de vínculos ---- */
function renderVinculos(lei, art) {
  const el = $('#vinc'); if (!el) return;
  const refs = refsDoArtigo(lei, art);
  const back = refBy(art.id), cads = refByCad(art.id);
  const ocultas = refsOff(art).length;
  const chip = (k, rot, extra, tit) => `<span class="chip vchip ${UI.vprev === k ? 'on' : ''}" data-k="${k}" title="${esc(tit || rot)}">${esc(rot)}${extra || ''}</span>`;
  let h = `<div class="vsec"><span class="vlab">Referências no texto</span>
      ${refs.map(r => chip(r.k, refRotulo(r), `<button class="x" data-rm="${r.k}" title="Remover esta referência">×</button>`, plain(r.tipo === 'art' ? r.art.texto : r.lei.nome).slice(0, 160))).join('') || '<span class="mini">nenhuma detectada</span>'}
      <button class="btn sm ghost" id="vr-add" title="Acrescentar uma referência que o programa não detectou">+ referência</button>
      ${ocultas ? `<button class="btn sm ghost" id="vr-rest" title="Trazer de volta as referências que você removeu">restaurar ${ocultas}</button>` : ''}</div>
    <div class="vsec"><span class="vlab">Correlações</span>
      ${art.links.map((k, i) => {
        const rm = `${k.obs ? ' <i class="ob">·</i>' : ''}<button class="x" data-dl="${i}" title="Remover correlação">×</button>`;
        if (k.cadId) { const c = cadById(k.cadId); return c ? chip('c:' + i, '≡ ' + c.titulo, rm, (k.obs ? k.obs + ' — ' : '') + 'caderno · ' + plain(c.conteudo).slice(0, 150)) : `<span class="chip vchip quebrada">caderno excluído<button class="x" data-dl="${i}">×</button></span>`; }
        const f = findArt(k.leiId, k.artId);
        return f ? chip('c:' + i, `${f.lei.sigla}, ${artLabel(f.art)}`, rm, (k.obs ? k.obs + ' — ' : '') + plain(f.art.texto).slice(0, 160)) : `<span class="chip vchip quebrada">vínculo quebrado<button class="x" data-dl="${i}">×</button></span>`;
      }).join('') || '<span class="mini">nenhuma cadastrada</span>'}
      <button class="btn sm ghost" id="vc-add" title="Vincular este artigo a outro artigo ou a um caderno de estudos">+ correlação</button></div>
    <div class="vsec"><span class="vlab">Jurisprudência</span>
      ${jurisDe(art).map(j => (jurisCheia(j) || j.tipo) ? `<span class="chip vchip juris ${UI.vprev === 'j:' + j.id ? 'on' : ''}" data-k="j:${j.id}" style="--tc:${tipoJurisCor(j.tipo)}" title="${esc(tipoJurisNome(j.tipo) + ' — ' + (plain(j.conteudo).slice(0, 150) || 'sem conteúdo'))}"><i class="tj"></i>${esc(tipoJurisAbrev(j.tipo))}${j.titulo && j.titulo !== 'Julgado' && !/^Julgado \d+$/.test(j.titulo) ? ` <b class="jt">${esc(j.titulo)}</b>` : ''}${jurisCheia(j) ? '' : ' <i class="vz">vazio</i>'}</span>` : '').join('') || '<span class="mini">nenhum julgado registrado</span>'}
      <button class="btn sm ghost" id="vj-add" title="Registrar um julgado na aba Jurisprudência">+ julgado</button></div>`;
  if (back.length || cads.length) h += `<div class="vsec"><span class="vlab">Citado em</span>
      ${back.map(b => chip('b:' + b.lei.id + '|' + b.art.id, `${b.lei.sigla}, ${artLabel(b.art)}`, '', (b.obs ? b.obs + ' — ' : '') + plain(b.art.texto).slice(0, 160))).join('')}
      ${cads.map(c => chip('d:' + c.id, c.titulo, '', plain(c.conteudo).slice(0, 160))).join('')}</div>`;
  const al = UI.vprev ? alvoDaChave(lei, art, UI.vprev) : null;
  h += `<div class="vprev" id="vprev" ${UI.vprev ? '' : 'hidden'}>${UI.vprev ? previewHTML(al) : ''}</div>`;
  el.innerHTML = h;

  $$('.vchip', el).forEach(c => c.onclick = e => {
    if (e.target.closest('.x')) return;
    UI.vprev = UI.vprev === c.dataset.k ? null : c.dataset.k;
    renderVinculos(lei, art);
    if (UI.vprev) { const p = $('#vprev'); if (p) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  });
  $$('[data-rm]', el).forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.rm;
    if (k.startsWith('m:')) art.refsMan = refsMan(art).filter(x => 'm:' + x.id !== k);
    else refsOff(art).push(k);
    if (UI.vprev === k) UI.vprev = null;
    save(); renderVinculos(lei, art);
  });
  $$('[data-dl]', el).forEach(b => b.onclick = e => { e.stopPropagation(); art.links.splice(+b.dataset.dl, 1); UI.vprev = null; save(); renderReader(); renderTree(); });
  const rest = $('#vr-rest', el); if (rest) rest.onclick = () => { art.refsOff = []; save(); renderVinculos(lei, art); };
  $('#vr-add', el).onclick = () => modalRefManual(lei, art);
  $('#vc-add', el).onclick = () => modalCorrelacao(lei, art);
  $('#vj-add', el).onclick = () => { const nv = novoJulgado({ titulo: 'Julgado ' + (jurisDe(art).length + 1) }); (art.jurisList = art.jurisList || []).push(nv); UI.jurisId = nv.id; art.atualizadoEm = new Date().toISOString(); save(); openArt(lei.id, art.id, 'juris'); };
  const pv = $('#vprev', el);
  if (pv) $$('[data-vp]', pv).forEach(x => x.onclick = () => {
    const op = x.dataset.vp;
    if (op === 'abrir') abrirAlvo(al);
    else if (op === 'janela') { const k = UI.vprev; UI.vprev = null; renderVinculos(lei, art); janelaPreview(lei, art, k); }
    else { UI.vprev = null; renderVinculos(lei, art); }
  });
}
function modalCorrelacao(lei, art) {

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cl-art">Artigo de lei</button><button class="btn" id="cl-cad" ${cads.length ? '' : 'disabled title="Nenhum caderno criado ainda"'}>Caderno de estudos${cads.length ? ` (${cads.length})` : ''}</button></div></div>`,

      const bc = $('#cl-cad', b); if (!cads.length) return;

          buttons: [{ label: 'Cancelar' }],
          onOpen: bb => {
            const des = () => {
              const f = norm($('#cd-f', bb).value);
              $('#cd-list', bb).innerHTML = cads.filter(c => !f || norm(c.titulo + ' ' + ((ramoById(c.ramo) || {}).nome || '') + ' ' + plain(c.conteudo).slice(0, 4000)).includes(f)).slice(0, 200)
                .map(c => `<div data-id="${c.id}"><b>${esc(c.titulo)}</b><small>${esc((ramoById(c.ramo) || {}).nome || 'sem ramo')} — ${esc(plain(c.conteudo).slice(0, 90) || 'caderno vazio')}</small></div>`).join('') || '<div class="empty">Nenhum caderno</div>';
              $$('#cd-list div[data-id]', bb).forEach(d => d.onclick = () => { const c = cadById(d.dataset.id); closeModal(); vincular({ cadId: c.id }, `Caderno “${c.titulo}”`); });
            };
            $('#cd-f', bb).oninput = des; des();
          },
        });
      };
    },
  });
}
function modalRefManual(lei, art) {
  openModal({
    title: 'Acrescentar referência',
    body: `<div class="form"><p class="hint" style="margin:0">O programa lê o texto do artigo e reconhece sozinho as remissões a outros artigos da mesma lei e a leis do acervo. Aqui você acrescenta o que ele não detectou — inclusive remissões a artigos de outras leis — e o “×” em cada etiqueta remove o que ele reconheceu por engano.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="rf-art">Escolher um artigo</button><button class="btn" id="rf-lei">Referir uma lei inteira</button></div></div>`,
    buttons: [{ label: 'Cancelar' }],
    onOpen: b => {
      $('#rf-art', b).onclick = () => { closeModal(); pickArtigo(r => { refsMan(art).push({ id: uid(), leiId: r.lei.id, artId: r.art.id }); art.atualizadoEm = new Date().toISOString(); save(); renderVinculos(lei, art); toast('Referência acrescentada', 'ok'); }); };
      $('#rf-lei', b).onclick = () => {
        closeModal();
        openModal({
          title: 'Referir uma lei inteira', wide: true,
          body: `<div class="form"><label>Lei<input type="text" id="rf-f" placeholder="filtrar por sigla, epígrafe ou nome…"></label><div class="pick" id="rf-list"></div></div>`,
          buttons: [{ label: 'Cancelar' }],
          onOpen: bb => {
            const des = () => {
              const f = norm($('#rf-f', bb).value);
              $('#rf-list', bb).innerHTML = S.leis.filter(l => !f || norm(l.sigla + ' ' + l.nome + ' ' + l.epigrafe).includes(f)).slice(0, 200).map(l => `<div data-id="${l.id}"><b>${esc(l.sigla)}</b><small>${esc(l.epigrafe)} — ${esc(l.nome)}</small></div>`).join('') || '<div class="empty">Nenhuma lei</div>';
              $$('#rf-list div[data-id]', bb).forEach(d => d.onclick = () => { refsMan(art).push({ id: uid(), leiId: d.dataset.id, artId: null }); art.atualizadoEm = new Date().toISOString(); save(); closeModal(); renderVinculos(lei, art); toast('Referência acrescentada', 'ok'); });
            };
            $('#rf-f', bb).oninput = des; des();
          },
        });
      };
    },
  });
}
</script>
<script>
/* =====================================================================
   PARTE 11 — pesquisa permanente no topo: procura em todo o acervo e
   identifica trechos colados (texto de lei, julgado, nota ou caderno)
   ===================================================================== */
const normG = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim();
function palavrasDe(txt) {
  const o = [], w = [];
  // textos copiados do Planalto costumam vir sem espaço depois de ":", ";" e ")" — separa para não colar duas palavras
  const bruto = String(txt || '').replace(/([:;.,)\]])(?=[A-Za-zÀ-ÿ0-9])/g, '$1 ');
  for (const p of bruto.split(/\s+/)) { const n = normG(p); if (n) { o.push(p); w.push(n.replace(/ /g, '')); } }
  return { o, w };
}
function shingles(ws, n = 3) { const s = new Set(); for (let i = 0; i + n <= ws.length; i++) s.add(ws.slice(i, i + n).join(' ')); return s; }

/* ---------- índice do acervo ---------- */
let GIDX = null, GIDX_REV = -1, GIDX_N = 0;
function gIndice(forcar) {
  if (GIDX && !forcar && GIDX_REV === (S.meta.rev || 0)) return GIDX;
  const ix = [];
  const add = (o) => { const p = palavrasDe(o.txt); if (!p.w.length) return; ix.push(Object.assign(o, { o: p.o, w: p.w, n: p.w.join(' ') })); };
  for (const l of S.leis) {
    add({ k: 'lei', leiId: l.id, tipo: 'Lei', rot: l.epigrafe, sub: l.sigla + ' — ' + l.nome, txt: `${l.epigrafe} ${l.nome} ${l.sigla} ${l.ementa || ''}` });
    for (const a of artigosDe(l)) {
      add({ k: 'art', leiId: l.id, artId: a.id, tipo: 'Artigo', rot: `${l.sigla}, ${artLabel(a)}`, sub: l.epigrafe, txt: plain(a.texto) });
      for (const nt of notasDe(a)) if (plain(nt.conteudo).trim()) add({ k: 'nota', leiId: l.id, artId: a.id, subId: nt.id, tipo: 'Nota', rot: nt.titulo || 'Nota', sub: `${l.sigla}, ${artLabel(a)}`, txt: plain(nt.conteudo) });
      for (const j of jurisDe(a)) if (plain(j.conteudo).trim()) add({ k: 'juris', leiId: l.id, artId: a.id, subId: j.id, tipo: tipoJurisAbrev(j.tipo), cor: tipoJurisCor(j.tipo), rot: j.titulo || 'Julgado', sub: `${l.sigla}, ${artLabel(a)}`, txt: plain(j.conteudo) });
    }
    if (l.notasDoc && plain(l.notasDoc.conteudo).trim()) add({ k: 'leinota', leiId: l.id, tipo: 'Nota da lei', rot: 'Notas', sub: l.epigrafe, txt: plain(l.notasDoc.conteudo) });
  }
  for (const c of S.cadernos) if (c.tipo === 'caderno' && plain(c.conteudo).trim()) add({ k: 'cad', cadId: c.id, tipo: 'Caderno', rot: c.titulo, sub: (ramoById(c.ramo) || {}).nome || 'sem ramo', txt: plain(c.conteudo) });
  GIDX = ix; GIDX_REV = S.meta.rev || 0; GIDX_N = ix.reduce((s, d) => s + d.w.length, 0);
  return GIDX;
}

/* ---------- busca ---------- */
function gProcurar(q) {
  const qp = palavrasDe(q), qw = qp.w;
  if (!qw.length) return { modo: null, res: [] };
  const ix = gIndice();
  const identificar = qw.length >= 6;
  if (!identificar) {
    const alvo = qw.join(' '), res = [];
    for (const d of ix) {
      const i = d.n.indexOf(alvo);
      if (i < 0) continue;
      const pos = d.n.slice(0, i).split(' ').length - 1;
      res.push({ d, cob: 1, exato: true, ini: Math.max(0, pos), fim: Math.min(d.w.length - 1, pos + qw.length - 1), marcadas: new Set(Array.from({ length: qw.length }, (_, k) => pos + k)) });
      if (res.length > 400) break;
    }
    res.sort((a, b) => ordemTipo(a.d.k) - ordemTipo(b.d.k) || a.d.w.length - b.d.w.length);
    return { modo: 'texto', res: res.slice(0, 40), total: res.length };
  }
  const qs = shingles(qw);
  if (!qs.size) return { modo: 'texto', res: [], total: 0 };
  const amostra = [...qs], sondas = [];
  const passo = Math.max(1, Math.floor(amostra.length / 12));
  for (let i = 0; i < amostra.length; i += passo) sondas.push(amostra[i]);
  if (!sondas.includes(amostra[amostra.length - 1])) sondas.push(amostra[amostra.length - 1]);
  let cand = ix.filter(d => sondas.some(t => d.n.includes(t)));
  if (!cand.length) {
    const longas = [...new Set(qw)].filter(w => w.length > 5).sort((a, b) => b.length - a.length).slice(0, 6);
    cand = longas.length ? ix.filter(d => longas.some(w => d.n.includes(w))) : [];
  }
  const res = [];
  for (const d of cand) {
    const marcadas = new Set(); let hit = 0;
    const ds = new Map();
    for (let i = 0; i + 3 <= d.w.length; i++) { const t = d.w[i] + ' ' + d.w[i + 1] + ' ' + d.w[i + 2]; if (!ds.has(t)) ds.set(t, i); }
    for (const t of qs) { const i = ds.get(t); if (i !== undefined) { hit++; marcadas.add(i); marcadas.add(i + 1); marcadas.add(i + 2); } }
    if (!hit) continue;
    const cob = hit / qs.size;
    if (cob < 0.12) continue;
    const idx = [...marcadas].sort((a, b) => a - b);
    res.push({ d, cob, exato: d.n.includes(qw.join(' ')), ini: idx[0], fim: idx[idx.length - 1], marcadas });
  }

/* ================= pesquisa ================= */
function buscar(q, o) {
  const out = []; const qn = norm(q.trim()); if (!qn && o.modo !== 'estrelas') return out;
  const qnum = normNumero(q.trim());
  for (const lei of S.leis) {
    if (o.ramo && !lei.ramos.includes(o.ramo)) continue; if (o.lei && lei.id !== o.lei) continue;
    for (const a of artigosDe(lei)) {
      if (a.estrelas < (o.estrelas || 0)) continue;
      if (o.modo === 'numero') { if (normNumero(a.numero) === qnum) out.push({ lei, art: a, where: 'artigo', snip: plain(a.texto).slice(0, 220) }); continue; }
      const campos = { texto: ['texto', plain(a.texto)], notas: ['notas', notasTxt(a)], juris: ['jurisprudência', jurisTxt(a)], tags: ['tema', a.tags.join(' · ')] };
      const alvo = o.modo === 'tudo' ? Object.keys(campos) : [o.modo];
      for (const k of alvo) { const [lbl, txt] = campos[k]; if (!txt) continue; const idx = norm(txt).indexOf(qn); if (idx >= 0) { out.push({ lei, art: a, where: lbl, snip: snippet(txt, idx, qn.length) }); break; } }
    }
  }
  return out;
}
function snippet(txt, idx, len) { const a = Math.max(0, idx - 100), b = Math.min(txt.length, idx + len + 140); return (a > 0 ? '…' : '') + esc(txt.slice(a, idx)) + '<mark>' + esc(txt.slice(idx, idx + len)) + '</mark>' + esc(txt.slice(idx + len, b)) + (b < txt.length ? '…' : ''); }

    <div class="bigsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="b-q" value="${esc(b.q)}" placeholder="ex.: capacidade contributiva · nascituro · 1225 · dignidade"></div>
    <div class="filters"><div class="seg" id="b-modo">${[['tudo','Tudo'],['texto','Texto da lei'],['tags','Temas'],['notas','Notas'],['juris','Jurisprudência'],['numero','Nº do artigo']].map(([k, l]) => `<button class="${b.modo === k ? 'on' : ''}" data-m="${k}">${l}</button>`).join('')}</div>
      <select id="b-ramo"><option value="">Todos os ramos</option>${S.ramos.map(r => `<option value="${r.id}" ${b.ramo === r.id ? 'selected' : ''}>${esc(r.nome)}</option>`).join('')}</select>
      <select id="b-lei"><option value="">Todas as leis</option>${S.leis.map(l => `<option value="${l.id}" ${b.lei === l.id ? 'selected' : ''}>${esc(l.sigla)} — ${esc(l.epigrafe)}</option>`).join('')}</select>
      <select id="b-est"><option value="0">Qualquer relevância</option>${[1,2,3,4,5].map(n => `<option value="${n}" ${b.estrelas == n ? 'selected' : ''}>${'★'.repeat(n)} ou mais</option>`).join('')}</select></div>
    <div id="b-res"></div>`;
  const run = () => { b.q = $('#b-q').value; b.ramo = $('#b-ramo').value; b.lei = $('#b-lei').value; b.estrelas = +$('#b-est').value; const res = buscar(b.q, b).concat(buscarCadernos(b.q, b)); const R = $('#b-res');

/* ================= temas ================= */
function renderTemas() {

  for (const l of S.leis) for (const a of artigosDe(l)) for (const t of a.tags) put(t, l.ramos);
  for (const c of S.cadernos) for (const t of (c.tags || [])) put(t, c.ramo ? [c.ramo] : []);
  const f = norm(UI.temaF || '');
  let lista = [...ix.entries()].filter(([t]) => !f || norm(t).includes(f));
  if (UI.temaRamo) lista = lista.filter(([, e]) => e.ramos.has(UI.temaRamo));
  lista.sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
  const total = ix.size;

  const item = ([t, e]) => `<div class="titem" data-t="${esc(t)}"><span>${esc(t)}</span><span class="n">${e.n}</span></div>`;
  const colunasAZ = (arr, letras = true) => {
    if (!letras) return `<div class="tcols simples">${arr.map(item).join('')}</div>`;
    const g = new Map();
    for (const x of arr) { const c = norm(x[0]).charAt(0).toUpperCase(); const k = /[A-Z]/.test(c) ? c : '#'; (g.get(k) || g.set(k, []).get(k)).push(x); }
    return `<div class="tcols">${[...g.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([k, xs]) => `<section class="tgrp"><h4>${k}</h4>${xs.map(item).join('')}</section>`).join('')}</div>`;
  };

  let corpo;
  if (!lista.length) corpo = `<div class="empty">${total ? 'Nenhum tema corresponde a este recorte.' : 'Nenhum tema ainda. Abra um artigo e adicione temas na linha "Temas".'}</div>`;
  else if (UI.temaModo === 'ramo') {
    const partes = [];
    for (const r of S.ramos) {
      if (UI.temaRamo && r.id !== UI.temaRamo) continue;
      const xs = lista.filter(([, e]) => e.ramos.has(r.id));
      if (!xs.length) continue;
      partes.push(`<section class="tramo"><h3><span class="dot" style="background:${r.cor}"></span>${esc(r.nome)}<span class="mini">${plural(xs.length, 'tema')}</span></h3>${colunasAZ(xs, xs.length >= 15)}</section>`);

  if (!window.showSaveFilePicker) { toast('Este navegador não permite vincular arquivo (use Chrome/Edge). Use o backup .json.', 'err'); return; }
  try { const h = await window.showSaveFilePicker({ suggestedName: 'vademecum-dados.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] }); fileHandle = h; if (!useLS) await DB.set('fileHandle', h); await saveNow(); S.meta.ultimoBackup = new Date().toISOString(); save(); renderConfig(); toast('Arquivo vinculado: cada alteração será gravada nele', 'ok'); } catch (e) { if (e.name !== 'AbortError') toast('Não foi possível vincular: ' + e.message, 'err'); }
}
async function reautorizarArquivo() { if (!fileHandle) return; try { const p = await fileHandle.requestPermission({ mode: 'readwrite' }); if (p === 'granted') { await saveNow(); toast('Gravação automática reativada', 'ok'); renderConfig(); } } catch (e) { toast(String(e), 'err'); } }
function renderConfig() {
  const V = $('#view-config'); const p = S.prefs; let nA = 0; S.leis.forEach(l => nA += artigosDe(l).length);
  V.innerHTML = `<h2 class="vt">Ajustes e backup</h2><p class="sub">Aparência, dados e segurança do acervo.</p>
    <div class="grid2">
    <div class="card p"><b>Leitura</b><div class="form" style="margin-top:10px"><label>Tema<div class="seg"><button data-tema="claro" class="${p.tema === 'claro' ? 'on' : ''}">Claro</button><button data-tema="escuro" class="${p.tema === 'escuro' ? 'on' : ''}">Escuro</button></div></label><label>Fonte do texto legal<div class="seg"><button data-fonte="serif" class="${p.fonte === 'serif' ? 'on' : ''}">Serifada</button><button data-fonte="sans" class="${p.fonte === 'sans' ? 'on' : ''}">Sem serifa</button></div></label><label>Tamanho da fonte: <span id="fs-lbl">${p.fs}px</span><input type="range" min="14" max="26" value="${p.fs}" id="fs-range"></label><label>Leiaute<div class="seg">${[['auto', 'Automático'], ['desktop', 'Computador'], ['mobile', 'Celular']].map(([k, l]) => `<button data-layout="${k}" class="${(p.layout || 'auto') === k ? 'on' : ''}">${l}</button>`).join('')}</div></label></div></div>
    <div class="card p"><b>Backup e arquivo de dados</b><div class="mini" style="margin:4px 0 10px;line-height:1.5">Os dados ficam gravados neste navegador (${useLS ? 'localStorage' : 'IndexedDB'}). Para não perder nada, exporte o .json periodicamente e guarde-o em nuvem; ou vincule um arquivo para gravação automática a cada alteração (Chrome/Edge).${S.meta.ultimoBackup ? `<br>Último backup: ${fmtDate(S.meta.ultimoBackup)}.` : ''}${fileHandle ? `<br>Arquivo vinculado: <b>${esc(fileHandle.name)}</b> <button class="btn sm" id="cf-reaut">Reautorizar gravação</button>` : ''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cf-exp">${I.imp} Exportar backup (.json)</button><button class="btn" id="cf-imp-merge">Carregar backup e mesclar</button><button class="btn" id="cf-imp-rep">Carregar backup substituindo tudo</button><button class="btn" id="cf-link">${I.link} Vincular arquivo .json</button></div></div>
    <div class="card p"><b>Acervo</b><div class="mini" style="margin:4px 0 10px">${S.leis.length} leis · ${nA} artigos · ${S.ramos.length} ramos</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cf-ramos">Gerenciar ramos</button><button class="btn" id="cf-catalogo">Repor leis do catálogo inicial que foram excluídas</button><button class="btn" id="cf-tree">${p.tree ? 'Ocultar' : 'Mostrar'} lista lateral</button></div></div>
    <div class="card p"><b style="color:var(--err)">Zona de perigo</b><div class="mini" style="margin:4px 0 10px">Apaga tudo e recomeça com o catálogo inicial.</div><button class="btn danger" id="cf-reset">Apagar todos os dados</button></div></div>
    ${renderConfigIA()}
    ${guiaInstalacao()}
    <div class="card p" style="margin-top:12px"><b>Sobre</b><div class="mini" style="line-height:1.6;margin-top:4px">Vade Mecum Vitalício — arquivo único (HTML + JS), sem servidor e sem dependências externas; funciona offline. Os textos de amostra (CF, CTN, CC e CPC, poucos artigos) foram digitados sem consulta ao Planalto e devem ser conferidos e substituídos pela íntegra oficial via "Importar texto". Os links do Planalto cadastrados no catálogo podem mudar; edite-os na lei se necessário.</div></div>`;
  bindConfigIA(V);
  $$('[data-layout]', V).forEach(b => b.onclick = () => { p.layout = b.dataset.layout; save(); applyLayout(); renderConfig(); });
  $$('[data-tema]', V).forEach(b => b.onclick = () => { p.tema = b.dataset.tema; save(); applyPrefs(); renderConfig(); });
  $$('[data-fonte]', V).forEach(b => b.onclick = () => { p.fonte = b.dataset.fonte; save(); applyPrefs(); renderConfig(); });
  $('#fs-range').oninput = e => { p.fs = +e.target.value; $('#fs-lbl').textContent = p.fs + 'px'; applyPrefs(); save(); };
  $('#cf-exp').onclick = exportBackup; $('#cf-link').onclick = vincularArquivo; if ($('#cf-reaut')) $('#cf-reaut').onclick = reautorizarArquivo;
  $('#cf-imp-merge').onclick = () => { $('#file-import').dataset.modo = 'merge'; $('#file-import').click(); };
  $('#cf-imp-rep').onclick = () => confirmar('Substituir tudo', 'Todos os dados atuais serão substituídos pelo conteúdo do arquivo importado.', () => { $('#file-import').dataset.modo = 'replace'; $('#file-import').click(); });
  $('#cf-ramos').onclick = modalRamos; $('#cf-tree').onclick = () => { p.tree = !p.tree; save(); applyPrefs(); renderConfig(); };
  $('#cf-catalogo').onclick = () => { let n = 0; for (const [sigla, nome, epigrafe, rs, url] of LEIS_SEED) if (!S.leis.some(l => l.sigla === sigla)) { S.leis.push({ id: uid(), sigla, nome, epigrafe, ementa: '', ramos: rs, url, itens: [], criadoEm: new Date().toISOString(), amostra: false }); n++; } save(); renderRamos(); renderTree(); toast(`${n} leis repostas`, 'ok'); renderConfig(); };
  $('#cf-reset').onclick = () => confirmar('Apagar todos os dados', 'Tem certeza? Todas as leis, artigos, notas e destaques serão apagados. Exporte um backup antes.', () => { S = seedState(); UI.leiId = null; UI.artId = null; saveNow(); applyPrefs(); renderRamos(); renderTree(); showView('dashboard'); });
}
/* ================= prefs / init ================= */
function applyPrefs() {
  const p = S.prefs; document.documentElement.dataset.theme = p.tema; document.documentElement.dataset.fonte = p.fonte; document.documentElement.style.setProperty('--fs', p.fs + 'px');
  $('#app').classList.toggle('rail-collapsed', !!p.rail); $('#app').classList.toggle('no-tree', !((UI.view === 'leitura' || UI.view === 'cadernos') && p.tree)); $('#btn-fonte').textContent = p.fonte === 'serif' ? 'Serif' : 'Sans';
}
function irPara(q) { // "CC 1225", "CPC art. 3", "1225"
  const m = q.trim().match(/^([A-Za-zÀ-ú0-9.]+)?\s*(?:art\.?\s*)?(\d+\s*[ºo°]?\s*(?:-\s*[A-Za-z]{1,2})?)\s*$/i); if (!m) return false;
  const sig = m[1] ? norm(m[1]) : null; const num = normNumero(m[2]);
  const lei = sig ? S.leis.find(l => norm(l.sigla) === sig) : (UI.leiId ? leiById(UI.leiId) : null); if (!lei) return false;
  const a = artigosDe(lei).find(x => normNumero(x.numero) === num); if (!a) { toast(`${lei.sigla}: art. ${num} não encontrado`, 'err'); return true; }
  openArt(lei.id, a.id); return true;
}
async function init() {
  S = await loadState();
  if (fileHandle) { try { const p = await fileHandle.queryPermission({ mode: 'readwrite' }); if (p !== 'granted') setTimeout(() => toast('Arquivo vinculado: vá em Ajustes e clique em "Reautorizar gravação"'), 1200); } catch (_) {} }
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) {}
  applyPrefs(); renderRamos();
  if (S.prefs.ultimo && findArt(S.prefs.ultimo.leiId, S.prefs.ultimo.artId)) { UI.leiId = S.prefs.ultimo.leiId; UI.artId = S.prefs.ultimo.artId; UI.openLeis.add(UI.leiId); }
  else if (S.prefs.ultimo && leiById(S.prefs.ultimo.leiId)) { UI.leiId = S.prefs.ultimo.leiId; UI.artId = null; UI.openLeis.add(UI.leiId); }
  renderTree(); showView(UI.leiId ? 'leitura' : 'dashboard');
  $$('#nav .navbtn').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('#btn-organizar').onclick = () => { if (UI.view === 'cadernos') { toast('A ordem dos cadernos segue as pastas', ''); return; } UI.reordenar = !UI.reordenar; if (UI.reordenar) UI.openLeis.clear(); $('#btn-organizar').classList.toggle('on', UI.reordenar); renderTree(); if (UI.reordenar) toast('Arraste as leis para reordenar; clique de novo no botão para sair', 'ok'); };
  $('#btn-organizar').oncontextmenu = e => { e.preventDefault(); modalOrganizarLeis(); };
  $('#btn-ordem').onclick = () => modalOrganizarLeis();
  $('#btn-ramos').onclick = modalRamos; $('#btn-nova-lei').onclick = () => UI.view === 'cadernos' ? modalCaderno({ tipo: 'caderno' }) : modalLei(); $('#btn-nova-pasta').onclick = () => modalCaderno({ tipo: 'pasta' });
  $('#file-cad').onchange = e => { const f = e.target.files[0]; const c = cadById(e.target.dataset.cad); if (f && c) importarArquivoCaderno(f, c); e.target.value = ''; };
  if (S.prefs.ultimoCad && cadById(S.prefs.ultimoCad)) UI.cadId = S.prefs.ultimoCad;
  $('#btn-rail').onclick = () => { S.prefs.rail = !S.prefs.rail; save(); applyPrefs(); };
  $('#btn-theme').onclick = () => { S.prefs.tema = S.prefs.tema === 'claro' ? 'escuro' : 'claro'; save(); applyPrefs(); };
  $('#btn-tree').onclick = () => { if (isMobile()) { if (UI.view !== 'leitura' && UI.view !== 'cadernos') showView('leitura'); $('#tree').classList.contains('show') ? closeDrawer() : openDrawer(); return; } S.prefs.tree = !S.prefs.tree; save(); if (UI.view !== 'leitura' && UI.view !== 'cadernos') showView('leitura'); applyPrefs(); };
  $('#btn-font-minus').onclick = () => { S.prefs.fs = Math.max(14, S.prefs.fs - 1); save(); applyPrefs(); };
  $('#btn-font-plus').onclick = () => { S.prefs.fs = Math.min(26, S.prefs.fs + 1); save(); applyPrefs(); };
  $('#btn-fonte').onclick = () => { S.prefs.fonte = S.prefs.fonte === 'serif' ? 'sans' : 'serif'; save(); applyPrefs(); };
  $('#btn-backup-quick').onclick = exportBackup;
  $('#modal-x').onclick = closeModal; $('#overlay').addEventListener('mousedown', e => { if (e.target === $('#overlay')) closeModal(); });
  $('#file-crono').onchange = e => { const f = e.target.files[0]; if (f) importarCronoAntigo(f); e.target.value = ''; };
  $('#file-import').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f, e.target.dataset.modo || 'merge'); e.target.value = ''; };
  const tf = $('#tree-filter'); tf.oninput = debounce(() => { UI.treeFilter = tf.value; renderTree(); }, 150); tf.onkeydown = e => { if (e.key === 'Enter' && UI.view === 'leitura') { if (irPara(tf.value)) { tf.value = ''; UI.treeFilter = ''; renderTree(); } } };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); $('#tree').classList.remove('show'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const g = $('#gsearch'); if (g && g.offsetParent) { g.focus(); g.select(); } else showView('busca'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (UI.view === 'leitura' && UI.dirty) salvarTexto(); else toast('Tudo salvo'); return; }
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && UI.view === 'leitura' && UI.artId) { e.preventDefault(); const v = vizinho(e.key === 'ArrowLeft' ? -1 : 1); if (v) openArt(UI.leiId, v.id); }
  });
  document.addEventListener('click', e => { const a = e.target.closest('a[data-ref]'); if (a && !a.closest('.edit')) { e.preventDefault(); const [l, ar] = a.dataset.ref.split(':'); openArt(l, ar); } });
  window.addEventListener('beforeunload', () => { if (UI.dirty) salvarTexto(true); if (typeof window._docFlush === 'function') window._docFlush(); salvarEmergencia(); try { saveNow(); } catch (_) {} });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (UI.dirty) salvarTexto(true); if (typeof window._docFlush === 'function') window._docFlush(); salvarEmergencia(); saveNow(); } });
  initBuscaGlobal();
  initMobile();
}
init().catch(e => { console.error(e); document.body.innerHTML = '<pre style="padding:20px">Erro ao iniciar: ' + esc(e.stack || e) + '</pre>'; });
</script>
